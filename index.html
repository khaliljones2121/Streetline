let deferredInstallPrompt = null;
let canInstallPWA = false;

function isIOSDevice() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isStandalonePWA() {
  return window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
}
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  canInstallPWA = true;
  if (typeof render === "function") render();
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  canInstallPWA = false;
  if (typeof render === "function") render();
});
async function installSTREETLINE() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    try { await deferredInstallPrompt.userChoice; } catch (e) {}
    deferredInstallPrompt = null;
    canInstallPWA = false;
    render();
    return;
  }
  if (isIOSDevice() && !isStandalonePWA()) {
    alert("To install STREETLINE on iPhone: tap the Share button in Safari, then choose “Add to Home Screen.”");
  }
}
function pwaInstallCard() {
  if (isStandalonePWA()) return "";
  if (canInstallPWA) {
    return `<div class="card install-card pwa-install"><button class="btn btn-wide btn-green" onclick="installSTREETLINE()">📲 INSTALL STREETLINE</button><div class="install-note">Adds STREETLINE to your home screen and opens it like an app.</div></div>`;

  if (isIOSDevice()) {

function renderSplash() { return `<div class="splash" onclick="skipSplash()"><div class="splash-title">STREETLINE</div><div class="splash-sub">pager simulation</div><div class="splash-tap">tap to continue</div></div>`; }
function renderCreateHustler() {
  return `<div class="landing"><h1 class="landtitle" style="font-size:1.4rem;">CREATE HUSTLER</h1><input id="creationName" type="text" maxlength="20" placeholder="Name" value="${creation.name}" oninput="creation.name = this.value" style="width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--card-border);border-radius:8px;color:var(--text);font-family:inherit;font-size:0.95rem;padding:11px;margin-bottom:16px;text-align:center;"><div class="section-label">AVATAR</div><div class="avgrid">${AVATAR_STYLES.map(a => `<button class="avbtn ${creation.avatarId === a.id ? 'avbtn-sel' : ''}" onclick="selectAvatar('${a.id}')">${avatarSVG(a.id, 44)}</button>`).join("")}</div><div class="section-label">EDGE</div>${PERKS.map(p => `<button class="perkcard ${creation.perkId === p.id ? 'perkcard-sel' : ''}" onclick="selectPerk('${p.id}')"><div class="perkcard-label">${p.label}</div><div class="perkcard-desc">${p.desc}</div></button>`).join("")}<button class="btn btn-wide btn-green" onclick="startWithCreation()" style="margin-top:8px;">START</button><button class="btn btn-wide" onclick="backToLanding()" style="margin-top:8px;">BACK</button></div>`;
}
function renderLanding() {
  const saved = loadSave();
  return `<div class="landing"><div class="landcredit">Khalil Jones</div><h1 class="landtitle">STREETLINE</h1><div class="landsub">30 days on the clock</div>${saved ? `<div class="card" style="margin-bottom:14px;"><button class="btn btn-wide btn-green" onclick="continueGame()">CONTINUE</button></div>` : ""}<button class="btn btn-wide ${saved ? '' : 'btn-green'} landstart" onclick="openCharacterSelect()">NEW RUN</button>${pwaInstallCard()}</div>`;
}
function renderTop() {
  return `<div class="playerbar">${avatarSVG(state.avatarId, 30)}<span class="playerbar-name">${state.playerName}</span></div><div class="hdr"><span>DAY ${state.day}/${state.maxDays}</span><span>${state.location.toUpperCase()}</span></div><div class="locflavor">${LOCATION_FLAVOR[state.location]}</div><div class="statrow"><div><span class="label">CASH</span>$${state.cash.toLocaleString()}</div><div><span class="label">BANK</span>$${state.bank.toLocaleString()}</div><div><span class="label">DEBT</span><span class="debt-val">$${state.debt.toLocaleString()}</span></div><div><span class="label">HEAT</span>${Math.round(state.heat)}%</div></div>`;
}
function renderDeal() {
  return DRUGS.map(d => `<div class="card"><div class="cardrow-top"><span class="name">${localName(d.key)}</span><span class="price">$${getBuyPrice(d.key)}</span></div><div class="cardrow-sub"><span>HOLD: ${state.inventory[d.key]}</span><span class="${priceLevel(d.key).cls}">${priceLevel(d.key).word}</span></div><div class="cardbtns"><button class="btn" onclick="buy('${d.key}')">BUY ${state.qty}</button><button class="btn" onclick="sell('${d.key}')" ${state.inventory[d.key]>0?'':'disabled'}>SELL ${state.qty}</button></div></div>`).join("") + `<div class="qtypanel"><div class="section-label">QTY</div><div class="stepper"><button onclick="stepQty(-1)">−</button><input class="qtyval" type="number" inputmode="numeric" value="${state.qty}" min="1" oninput="setQty(this.value)"><button onclick="stepQty(1)">+</button></div></div>`;
}
function renderMap() {
  return `<div class="section-label">TRAVEL</div><div class="locgrid">${LOCATIONS.map(loc => `<button class="btn maploc" onclick="travel('${loc}')"><div class="maploc-top"><span class="maploc-name">${loc}</span><span class="${loc===state.location?'maploc-here':'maploc-go'}">${loc===state.location?"HERE":"GO"}</span></div><div class="maploc-tags">RISK ${riskLabel(loc)}</div></button>`).join("")}</div><div class="section-label">DEBT</div><div class="card"><div class="amtfield"><input type="number" inputmode="numeric" value="${state.debtAmt}" min="0" oninput="setDebtAmt(this.value)"><button class="btn btn-green" onclick="payDebt()">PAY</button></div></div>`;
}
function renderStash() {
  return `<div class="section-label">BANK</div><div class="card"><div class="amtfield"><input type="number" inputmode="numeric" value="${state.bankAmt}" min="0" oninput="setBankAmt(this.value)"><button class="btn" onclick="bankDeposit()">IN</button><button class="btn" onclick="bankWithdraw()">OUT</button></div></div><div class="section-label">BAG</div><div class="card"><button class="btn btn-wide btn-green" onclick="upgradeBag()">UPGRADE ($${bagUpgradeCost().toLocaleString()})</button></div>`;
}
function renderContacts() {
  return `<div class="section-label">CONTACTS</div>${(CONTACTS[state.location] || []).map(c => { const t = trustOf(state.location, c.role); return `<div class="card"><div class="contactname">${c.name.toUpperCase()} <span class="trustpct">${t}%</span></div><div class="contactline">${c.line}</div><button class="btn btn-wide btn-green" onclick="talkTo('${state.location}','${c.role}')">TALK</button></div>`; }).join("")}`;
}
function renderEvent(ev) {
  if (ev.type === "police") return `<div class="event-box"><h2>⚠ POLICE</h2><p>Checkpoint ahead.</p><div class="event-actions"><button class="btn" onclick="resolvePolice('run')">RUN</button><button class="btn" onclick="resolvePolice('bribe')">BRIBE</button></div></div>`;
  if (ev.type === "gang") return `<div class="event-box"><h2>⚠ AMBUSH</h2><p>Pay $${ev.demand.toLocaleString()} or fight.</p><div class="event-actions"><button class="btn" onclick="resolveGang('pay')">PAY</button><button class="btn" onclick="resolveGang('run')">RUN</button><button class="btn" onclick="resolveGang('fight')">FIGHT</button></div></div>`;
  return "";
}
document.querySelectorAll(".key").forEach(k => k.addEventListener("click", () => setView(k.dataset.nav)));
render();
setTimeout(() => { if (!splashDone) skipSplash(); }, 3600);

/* Register the service worker after the game is running. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
