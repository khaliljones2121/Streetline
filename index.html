<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STREETLINE</title>
  <style>
    :root {
      --bg: #0a0d13;
      --card: #131722;
      --card-border: rgba(255,255,255,0.08);
      --text: #e7e9ee;
      --muted: #7b8394;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: 'Courier New', ui-monospace, Menlo, monospace;
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #111827 0%, #000 60%);
    }
    .app {
      width: min(480px, 100%);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      margin: 0 0 12px;
      text-align: center;
      letter-spacing: 4px;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>STREETLINE</h1>
    <p>Streetline is ready.</p>
  </div>
</body>
</html>
