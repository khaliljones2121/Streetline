<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STREETLINE</title>
<style>
  :root {
    --bg: #0a0d13;
    --card: #131722;
    --card-border: rgba(255,255,255,0.08);
    --text: #e7e9ee;
    --muted: #7b8394;
    --muted-2: #545b6b;
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.15);
    --debt: #ff6b7d;
    --danger: #ff5566;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }
  body {
    font-family: 'Courier New', ui-monospace, Menlo, monospace;
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  .screen {
    flex: 1 1 auto;
    background: var(--bg);
    color: var(--text);
    padding: 0 16px 10px;
    overflow-y: auto;
    position: relative;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    color: var(--muted);
    padding: 10px 0 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }
  .statusbar .appname { letter-spacing: 2px; color: var(--muted); }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .battery {
    width: 20px; height: 10px;
    border: 1px solid var(--muted);
    border-radius: 2px;
    position: relative;
    display: inline-block;
  }
  .battery::after {
    content: "";
    position: absolute; top: -3px; right: -3px;
    width: 2px; height: 4px;
    background: var(--muted);
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    position: absolute; top: 1px; bottom: 1px; left: 1px;
    width: 60%;
    background: var(--muted);
    border-radius: 1px;
  }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 9px; }
  .bars span { width: 2px; background: var(--muted); display: block; }
  .bars span:nth-child(1) { height: 3px; }
  .bars span:nth-child(2) { height: 5px; }
  .bars span:nth-child(3) { height: 7px; }
  .bars span:nth-child(4) { height: 9px; }
  .mutebtn {
    background: none; border: none; color: var(--muted);
    font-size: 0.85rem; padding: 0; cursor: pointer; line-height: 1;
  }
  .statline {
    display: flex; justify-content: space-between;
    font-size: 0.8rem; padding: 5px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .statline:last-child { border-bottom: none; }
  .statline span:first-child { color: var(--muted); }

  .playerbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0 10px;
  }
  .playerbar-name { font-size: 0.86rem; font-weight: bold; }
  .playerbar-info { flex: 1; min-width: 0; }
  .playerbar-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .health-readout { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
  .healthbar { height: 7px; width: 100%; background: #202633; border: 1px solid rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
  .healthfill { height: 100%; width: 100%; background: var(--green); border-radius: 99px; transition: width 0.25s ease, background 0.25s ease; }
  .healthfill.warn { background: #eab308; }
  .healthfill.danger { background: var(--danger); }
  .health-warning { font-size: 0.72rem; margin: -4px 0 10px; color: #eab308; }
  .health-warning.danger { color: var(--danger); }
  .meterrow { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:-4px 0 10px; }
  .mini-meter { background:var(--card); border:1px solid var(--card-border); border-radius:9px; padding:7px 9px; }
  .mini-meter-top { display:flex; justify-content:space-between; font-size:.68rem; color:var(--muted); margin-bottom:4px; }
  .meter { height:5px; background:#202633; border-radius:99px; overflow:hidden; }
  .meterfill { height:100%; border-radius:99px; transition:width .2s ease; }
  .energyfill { background:#60a5fa; }
  .armorfill { background:#a78bfa; }
  .heat-tier { font-weight:bold; }
  .day-summary { border-color:rgba(34,197,94,.35); }
  .summary-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:7px 12px; font-size:.76rem; }
  .summary-grid span { color:var(--muted); display:block; font-size:.65rem; }
  .mission-card { border-color:rgba(167,139,250,.45); }
  .contact-tier { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; font-size:.72rem; color:var(--muted); }
  .contact-tier b { color:var(--text); }
  .contact-milestones { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:8px 0 10px; }
  .contact-milestone { border:1px solid var(--card-border); border-radius:6px; padding:4px 2px; text-align:center; font-size:.58rem; color:var(--muted-2); }
  .contact-milestone.on { color:var(--green); border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.05); }
  .contact-favor { margin-top:8px; padding-top:8px; border-top:1px solid var(--card-border); }
  .favor-ready { color:var(--green); font-size:.7rem; font-weight:bold; }
  .favor-locked { color:var(--muted-2); font-size:.7rem; }

  /* STREETLINE MAP — #3 CITY CARTOGRAPHY + #4 MAP CONTROL PANEL */
  .street-map-layout{display:grid;grid-template-columns:minmax(0,1fr) 274px;gap:12px;align-items:stretch}
  .citymap-wrap{min-width:0}
  .citymap{position:relative;height:500px;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:16px;touch-action:none;user-select:none;background:#101713;box-shadow:inset 0 0 90px rgba(0,0,0,.55),0 10px 32px rgba(0,0,0,.28)}
  .citymap::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:12;background:radial-gradient(circle at 52% 48%,transparent 28%,rgba(0,0,0,.08) 62%,rgba(0,0,0,.52) 100%)}
  .citymap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:13;opacity:.10;background-image:radial-gradient(rgba(255,255,255,.2) .55px,transparent .55px);background-size:7px 7px}
  .map-world{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;will-change:transform}
  .cityroads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
  .citywater{fill:#102d35;stroke:#4b8790;stroke-width:.5}
  .water-inner{fill:none;stroke:rgba(94,181,190,.18);stroke-width:.35}
  .water-label{fill:rgba(109,194,202,.5);font-size:2.2px;letter-spacing:1px;font-family:Arial,sans-serif;font-weight:700}
  .map-block{fill:#17211d;stroke:rgba(181,195,184,.075);stroke-width:.38}
  .map-block-alt{fill:#1b2722;stroke:rgba(181,195,184,.065);stroke-width:.38}
  .map-park{fill:#153326;stroke:rgba(87,181,116,.22);stroke-width:.4}
  .map-park-label{fill:rgba(101,190,124,.43);font-size:2px;letter-spacing:.7px;font-family:Arial,sans-serif;font-weight:700}
  .road{stroke:rgba(224,229,218,.2);stroke-width:1.05;fill:none}
  .road-minor{stroke:rgba(224,229,218,.12);stroke-width:.55;fill:none}
  .road-main{stroke:rgba(232,231,211,.47);stroke-width:2.0;fill:none}
  .road-highway{stroke:rgba(227,191,91,.7);stroke-width:2.7;fill:none}
  .road-highway-core{stroke:#222923;stroke-width:1.25;fill:none}
  .road-bridge{stroke:#d2b765;stroke-width:1.8;fill:none}
  .road-dash{stroke:rgba(151,180,163,.25);stroke-width:.55;stroke-dasharray:2.5 3.5;fill:none}
  .map-label{fill:rgba(215,223,214,.4);font-size:2.35px;letter-spacing:.7px;font-family:Arial,sans-serif;font-weight:800}
  .map-label-major{fill:rgba(229,235,226,.62);font-size:2.75px;letter-spacing:.8px;font-family:Arial,sans-serif;font-weight:900}
  .map-zone{position:absolute;border:1px solid rgba(255,255,255,.08);border-radius:20% 30% 24% 28%;pointer-events:none;opacity:.45;z-index:2;mix-blend-mode:screen;box-shadow:inset 0 0 32px rgba(0,0,0,.12)}
  .zone-bungalow{left:3%;top:19%;width:30%;height:27%;background:rgba(36,150,94,.07);border-color:rgba(65,190,119,.26)}
  .zone-back{left:3%;top:55%;width:31%;height:25%;background:rgba(190,66,84,.05);border-color:rgba(230,94,112,.2)}
  .zone-venice{left:35%;top:57%;width:28%;height:23%;background:rgba(47,142,180,.05);border-color:rgba(83,174,207,.2)}
  .zone-downtown{left:36%;top:28%;width:29%;height:26%;background:rgba(183,157,67,.045);border-color:rgba(220,190,83,.2)}
  .zone-carver{left:66%;top:27%;width:31%;height:28%;background:rgba(106,77,161,.045);border-color:rgba(145,111,198,.19)}
  .zone-owned{background:rgba(34,197,94,.16)!important;border:1.5px solid rgba(34,197,94,.72)!important;box-shadow:0 0 28px rgba(34,197,94,.1),inset 0 0 30px rgba(34,197,94,.07)}
  .zone-selected{outline:1px solid rgba(255,255,255,.78);outline-offset:3px}
  .map-territory-label{position:absolute;transform:translate(-50%,-50%);z-index:7;padding:3px 6px;border:1px solid rgba(34,197,94,.46);border-radius:4px;background:rgba(4,12,9,.84);color:#7bea9a;font-size:.45rem;font-weight:bold;letter-spacing:.65px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .business-marker{position:absolute;transform:translate(-50%,-50%);z-index:9;min-width:44px;max-width:70px;padding:3px 4px;border:1px solid rgba(86,219,132,.72);border-radius:6px;background:rgba(4,13,9,.94);color:#86efac;text-align:center;box-shadow:0 0 14px rgba(34,197,94,.13);pointer-events:none}
  .business-marker .bm-icon{display:block;font-size:.68rem;line-height:1}.business-marker .bm-name{display:block;margin-top:2px;font-size:.42rem;font-weight:bold;letter-spacing:.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.business-marker .bm-cond{display:block;margin-top:1px;font-size:.39rem;color:#9aaba6}.business-marker.bm-low{border-color:rgba(255,91,111,.72);color:#ff7888}.business-marker.bm-low .bm-cond{color:#ff7888}
  .map-marker{position:absolute;transform:translate(-50%,-50%);z-index:8;max-width:120px;padding:0;border:0;border-radius:0;background:transparent;color:#e8efed;font-family:inherit;cursor:pointer;text-align:center;box-shadow:none;transition:transform .13s ease,filter .13s ease}
  .map-marker:hover{transform:translate(-50%,-50%) scale(1.08);filter:brightness(1.15)}.map-marker:active{transform:translate(-50%,-50%) scale(.97)}
  .map-marker .marker-name{display:block;margin-top:11px;padding:3px 7px;border:1px solid rgba(225,235,232,.18);border-radius:5px;background:rgba(7,14,16,.86);color:#dce7e4;font-size:.54rem;font-weight:850;letter-spacing:.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 9px rgba(0,0,0,.35)}
  .map-marker .marker-sub{display:none}.marker-dot{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;border:2px solid #dce7e4;background:#101713;box-shadow:0 0 0 3px rgba(6,12,14,.76),0 2px 8px rgba(0,0,0,.45)}
  .marker-current .marker-dot{width:15px;height:15px;border-color:#55c9ff;background:#55c9ff;box-shadow:0 0 0 3px rgba(8,16,20,.82),0 0 0 6px rgba(56,189,248,.16),0 0 20px rgba(56,189,248,.6)}.marker-current .marker-name{border-color:rgba(56,189,248,.5);color:#8ddcff}
  .marker-owned .marker-dot{border-color:#4ade80;background:#4ade80;box-shadow:0 0 0 3px rgba(8,16,11,.82),0 0 0 5px rgba(34,197,94,.13),0 0 14px rgba(34,197,94,.38)}.marker-owned .marker-name{border-color:rgba(34,197,94,.44);color:#9af0b2}
  .marker-locked{opacity:.3;cursor:not-allowed}.marker-locked .marker-dot{border-color:#7b8585;background:#252d2d}.marker-locked .marker-name{border-style:dashed;color:#87918f}.marker-danger .marker-dot{border-color:#fb7185;box-shadow:0 0 0 3px rgba(8,14,16,.82),0 0 13px rgba(251,113,133,.4)}.marker-danger .marker-name{border-color:rgba(251,113,133,.38)}.marker-highmarket .marker-name::after{content:"  $";color:#a7f3b7}.marker-selected .marker-name{outline:1px solid rgba(255,255,255,.82);outline-offset:2px}.marker-icon{display:none}
  .map-compass{position:absolute;right:11px;top:11px;z-index:15;width:31px;height:43px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(6,12,15,.87);text-align:center;padding-top:4px;font-size:.6rem;color:#cdd8d5;box-shadow:0 3px 10px rgba(0,0,0,.28)}.map-compass .arrow{display:block;font-size:1rem;line-height:14px;color:#f1f5f4}
  .map-scale{position:absolute;left:11px;bottom:11px;z-index:15;padding:4px 7px;border:1px solid rgba(255,255,255,.12);border-radius:5px;background:rgba(6,12,15,.8);font-size:.48rem;color:#91a09c;letter-spacing:.45px}.map-caption{position:absolute;left:11px;top:11px;z-index:15;padding:5px 9px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:rgba(6,12,15,.82);font-size:.5rem;color:#aebbb7;letter-spacing:1.2px;font-weight:800}
  .map-zoom-controls{position:absolute;right:11px;bottom:11px;z-index:16;display:flex;flex-direction:column;gap:4px}.map-zoom-controls button{width:33px;height:33px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(6,12,15,.92);color:#e8f0ee;font:700 17px/1 inherit;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}.map-zoom-controls button:active{transform:scale(.94)}.map-zoom-readout{position:absolute;right:11px;bottom:121px;z-index:16;padding:4px 7px;border:1px solid rgba(255,255,255,.13);border-radius:5px;background:rgba(6,12,15,.86);color:#a8b6b4;font-size:.49rem;letter-spacing:.5px}.map-pan-hint{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);z-index:15;padding:4px 8px;border:1px solid rgba(255,255,255,.12);border-radius:5px;background:rgba(6,12,15,.72);color:#879593;font-size:.47rem;letter-spacing:.55px;pointer-events:none;opacity:.82}
  .map-panel{background:linear-gradient(180deg,rgba(20,27,29,.99),rgba(8,13,16,.99));border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:13px;box-shadow:0 8px 24px rgba(0,0,0,.24);height:100%;box-sizing:border-box}.map-panel-title{font-size:.64rem;letter-spacing:1.15px;color:#81908c;margin-bottom:8px}.map-filter-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.map-filter-head b{font-size:.73rem;letter-spacing:.9px}.map-filter-clear{border:0;background:none;color:#69dc8b;font:inherit;font-size:.55rem;cursor:pointer;padding:2px}.map-filters{display:grid;gap:5px;margin-bottom:14px}.map-filter{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid rgba(255,255,255,.07);border-radius:7px;background:rgba(255,255,255,.022);font-size:.6rem;color:#9aa8a5;cursor:pointer}.map-filter:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.12)}.map-filter input{accent-color:#34d979;width:13px;height:13px;margin:0}.map-filter .filter-dot{width:7px;height:7px;border-radius:50%;background:#889592}.map-filter .filter-green{background:#4ade80}.map-filter .filter-red{background:#fb7185}.map-filter .filter-blue{background:#38bdf8}.map-filter .filter-yellow{background:#eab308}
  .map-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin-bottom:13px}.legend-item{display:flex;align-items:center;gap:6px;font-size:.57rem;color:#899793}.legend-icon{width:14px;text-align:center;font-size:.7rem;color:#dbe4e1;flex:0 0 14px}.legend-blue{color:#55c9ff}.legend-house{color:#4ade80}.legend-red{color:#fb7185}.legend-police{color:#60a5fa}.legend-yellow{color:#eab308}.location-info{border-top:1px solid rgba(255,255,255,.08);padding-top:12px}.location-info-name{font-size:.86rem;font-weight:900;letter-spacing:.55px;margin-bottom:9px}.map-stat{display:grid;grid-template-columns:54px 1fr auto;gap:5px;align-items:center;margin:6px 0;font-size:.58rem}.map-stat-label{color:#74827f}.stat-bars{display:flex;gap:2px}.stat-bars i{display:block;width:10px;height:5px;border-radius:1px;background:#29322f}.stat-bars i.on-market{background:#22c55e}.stat-bars i.on-police{background:#60a5fa}.stat-bars i.on-gang{background:#fb7185}.map-stat-value{color:#d4ddda;font-size:.55rem}.territory-badge{color:#69dc8b;font-size:.57rem;margin-top:8px;padding:5px 6px;border:1px solid rgba(34,197,94,.18);background:rgba(34,197,94,.035);border-radius:5px}.map-panel .btn{margin-top:8px}.map-note{margin:7px 0 8px;font-size:.56rem;color:#788783;line-height:1.45}.map-extra-locked{margin-top:8px;font-size:.58rem;color:var(--muted)}.map-debt{margin-top:10px}
  @media(max-width:760px){.street-map-layout{grid-template-columns:1fr}.citymap{height:520px}.map-panel{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.map-panel>.map-panel-title,.map-panel>.map-filter-head,.map-panel>.map-filters,.map-panel>.location-info{grid-column:1/-1}.map-filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}}
  .regional-map-switch{display:flex;gap:8px;margin:-4px 0 10px}.regional-map-switch .btn{flex:1;min-height:34px;font-size:.57rem;letter-spacing:.5px} .regional-map-switch .btn-locked{opacity:.55;filter:saturate(.35);border-color:rgba(255,255,255,.08);color:#7d8a87}.regional-summary{display:grid;gap:3px;padding:9px 10px;margin-bottom:10px;border:1px solid rgba(255,255,255,.09);border-radius:8px;background:rgba(255,255,255,.025)}.regional-summary b{font-size:.65rem;letter-spacing:.8px}.regional-summary span{font-size:.55rem;color:#7d8a87}.regional-land{fill:#d9dfd9}.regional-water{fill:#a9c9d3;opacity:.9}.regional-river{fill:none;stroke:#9fc4cf;stroke-width:3;opacity:.8}.regional-highway{fill:none;stroke:#c5a25e;stroke-width:2.1;opacity:.9}.regional-road{fill:none;stroke:#aeb8b1;stroke-width:.9;opacity:.9}.regional-road-small{fill:none;stroke:#c2c9c4;stroke-width:.55;opacity:.9}.regional-blocks path{fill:#cbd2cc;stroke:#9ea9a2;stroke-width:.25}.regional-trees circle{fill:#8db28d;stroke:#6e966f;stroke-width:.35}.regional-label{fill:#53605a;font-size:2px;letter-spacing:.3px;font-weight:800}.regional-label-major{fill:#4b5952;font-size:3px;letter-spacing:.8px;font-weight:900}.regional-water-label{fill:#5f8994;font-size:1.8px;letter-spacing:.35px;font-weight:800}
@media(max-width:480px){.citymap{height:500px}.map-marker{max-width:104px}.map-marker .marker-name{font-size:.51rem}.map-panel{display:block}.map-filters{grid-template-columns:1fr 1fr}}


  .street-detail-map{border:1px solid rgba(0,0,0,.18);border-radius:14px;overflow:hidden;background:#e4ebe7;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .st-viewport{position:relative;height:390px;overflow:hidden;touch-action:pan-y pinch-zoom;background:#e4ebe7;}
  .st-viewport .nb-world{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;will-change:transform;}
  .st-viewport svg{width:100%;height:100%;display:block;}
  .st-land{fill:#e7eee9}.st-water{fill:#b9dbe3}.st-road{fill:none;stroke:#f8fbf9;stroke-width:2}.st-mainroad{fill:none;stroke:#ffffff;stroke-width:3.5}
  .st-building{fill:#c9d2ce;stroke:#aebbb5;stroke-width:.45}.st-focus{fill:#d8efe1;stroke:#24a866;stroke-width:.9}.st-focus-label{font-size:4px;fill:#25543e;font-weight:700}.st-pin circle:first-child{fill:#1f8cff;stroke:#fff;stroke-width:1.2}.st-pin circle:last-child{fill:#fff}
  .st-info{display:flex;flex-wrap:wrap;gap:7px 16px;padding:10px 12px;background:rgba(255,255,255,.9);border-top:1px solid rgba(0,0,0,.12);font-size:.68rem;color:#45534d}.st-info strong{color:#18231e}.st-mini-legend{margin-left:auto;color:#66756f}
  .nb-landmark{cursor:pointer}.nb-landmark:focus rect{stroke:#16834e;stroke-width:1.2}
  @media(max-width:480px){.st-viewport{height:350px}.st-mini-legend{width:100%;margin-left:0}}

    text-shadow: 0 0 24px rgba(34,197,94,0.55);

/* STREETLINE — GPS → DEAL transition */
.location-transition{position:fixed;inset:0;z-index:9999;background:rgba(5,9,13,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;pointer-events:auto;overflow:hidden;animation:stFadeIn .16s ease-out;}
.location-transition .lt-mapwash{position:absolute;inset:-12%;background:radial-gradient(circle at 50% 48%,rgba(74,222,128,.10),transparent 35%),linear-gradient(180deg,rgba(7,12,17,.05),rgba(7,12,17,.5));animation:stMapPush .9s cubic-bezier(.2,.75,.2,1) forwards;}
.location-transition .lt-card{position:relative;width:min(88%,360px);padding:20px 18px 17px;border:1px solid rgba(74,222,128,.42);border-radius:14px;background:rgba(9,15,19,.94);box-shadow:0 18px 55px rgba(0,0,0,.55),0 0 35px rgba(74,222,128,.08);transform:translateY(18px) scale(.96);opacity:0;animation:stCardIn .42s .08s cubic-bezier(.16,1,.3,1) forwards;}
.location-transition .lt-kicker{font-size:.56rem;letter-spacing:.16em;color:var(--green);font-weight:800;margin-bottom:7px;}
.location-transition .lt-name{font-size:1.18rem;font-weight:900;letter-spacing:.04em;margin-bottom:12px;}
.location-transition .lt-row{display:flex;justify-content:space-between;gap:10px;font-size:.62rem;color:var(--muted);border-top:1px solid rgba(255,255,255,.07);padding-top:9px;}
.location-transition .lt-row b{color:var(--text);font-weight:800;}
.location-transition .lt-bar{height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:13px;}
.location-transition .lt-bar i{display:block;height:100%;width:0;background:var(--green);animation:stBar .7s .18s ease-out forwards;}
.location-transition.leaving .lt-card{animation:stCardOut .28s ease-in forwards;}
@keyframes stFadeIn{from{opacity:0}to{opacity:1}}
@keyframes stMapPush{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.18);opacity:1}}
@keyframes stCardIn{to{transform:translateY(0) scale(1);opacity:1}}
@keyframes stCardOut{to{transform:translateY(-22px) scale(.98);opacity:0}}
@keyframes stBar{to{width:100%}}
@media(prefers-reduced-motion:reduce){.location-transition *{animation-duration:.01ms!important;animation-delay:0ms!important}}

const VEHICLES = [
  { id:"streetRunner", name:"STREET RUNNER", cost:0, energy:0, capacity:0, protection:0, maintenance:0, desc:"Your starter ride. Nothing fancy, but it gets you there." },
  { id:"compact", name:"COMPACT", cost:2500, energy:2, capacity:5, protection:5, maintenance:35, desc:"Easy to move around in. Saves a little Energy on every trip." },
  { id:"sedan", name:"SEDAN", cost:5000, energy:2, capacity:10, protection:15, maintenance:50, desc:"Balanced ride with better protection and carrying room." },
  { id:"van", name:"VAN", cost:8000, energy:1, capacity:25, protection:20, maintenance:75, desc:"More room and solid protection, but heavier to keep running." },
  { id:"performance", name:"PERFORMANCE", cost:12000, energy:4, capacity:8, protection:10, maintenance:100, desc:"Fast and efficient. The best Energy savings, with higher upkeep." }
];
function vehicleById(id) { return VEHICLES.find(v => v.id === id) || VEHICLES[0]; }
function currentVehicle() { return vehicleById(state.currentVehicle || "streetRunner"); }
function vehicleCapacity() { return (currentVehicle().capacity || 0) + Math.max(0,Math.min(3,Number(state?.vehicleTuneLevel)||0))*5; }
function stashCapacity() { return (state.capacity || 0) + vehicleCapacity(); }
function vehicleEnergyCost() {
  const v = currentVehicle();
  const perkCost = state.perkId === "runner" ? 7 : 10;
  return Math.max(3, perkCost - (v.energy || 0) - Math.max(0,Math.min(3,Number(state?.vehicleTuneLevel)||0)));
}
function vehicleProtection() { return currentVehicle().protection || 0; }
function vehicleCondition() { return Math.max(0, Math.min(100, Math.round(state.vehicleCondition == null ? 100 : state.vehicleCondition))); }
function vehicleConditionMult() { return vehicleCondition() <= 20 ? 0.6 : vehicleCondition() <= 50 ? 0.8 : 1; }
function vehicleMaintenanceCost() {
  const v = currentVehicle();
  const base = (v.maintenance || 0) * (1 + (100 - vehicleCondition()) / 100);
  // Owning the Auto Shop makes repairs cheaper, so the business has a direct gameplay effect.
  const shopDiscount = typeof businessOwned === "function" && businessOwned("autoshop") ? 0.25 : 0;
  return Math.max(50, Math.round(base * (1 - shopDiscount)));
}
function buyVehicle(id) {
  const v = vehicleById(id);
  if (!v || v.id === currentVehicle().id) return;
  if (state.cash < v.cost) { sndFail(); addLog(`Not enough cash for the ${v.name}.`); render(); return; }
  state.cash -= v.cost;
  state.currentVehicle = v.id;
  state.vehicleCondition = 100;
  state.vehicleTuneLevel = 0;
  sndGood();
  addLog(`Switched to the ${v.name}. Travel Energy is now ${vehicleEnergyCost()}.`);
  render();
}
function repairVehicle() {
  const condition = vehicleCondition();
  if (condition >= 100) { sndFail(); addLog("Your vehicle is already at 100% condition."); render(); return; }
  const cost = vehicleMaintenanceCost();
  if (state.cash < cost) { sndFail(); addLog(`Not enough cash for repairs. Need $${cost.toLocaleString()}.`); render(); return; }
  state.cash -= cost;
  state.vehicleCondition = 100;
  sndGood();
  addLog(`${currentVehicle().name} repaired to 100% for $${cost.toLocaleString()}.`);
  render();
}
function damageVehicle(amount) {
  if (!state || !currentVehicle()) return;
  state.vehicleCondition = Math.max(0, vehicleCondition() - Math.max(0, amount || 0));
  if (vehicleCondition() <= 20) addLog(`${currentVehicle().name} is in rough shape. Repairs are recommended.`);
}
function vehicleSummary() {
  const v = currentVehicle();
  return `${v.name} · ${vehicleCondition()}% condition · ${vehicleEnergyCost()} Energy/trip`;
}
function vehicleTuneCost() { const level=Math.max(0,Math.min(3,Number(state?.vehicleTuneLevel)||0)); return level>=3?null:Math.round(currentVehicle().cost*(0.12+level*0.08)); }
function tuneVehicle() {
  const cost=vehicleTuneCost();
  if(cost===null){addLog("Your current ride is fully tuned.");render();return;}
  if(state.cash<cost){sndFail();addLog(`Need $${cost.toLocaleString()} to tune your ride.`);render();return;}
  state.cash-=cost; state.vehicleTuneLevel=Math.min(3,(Number(state.vehicleTuneLevel)||0)+1);
  sndGood(); addLog(`${currentVehicle().name} tuned to level ${state.vehicleTuneLevel}: +5 capacity and lower travel energy cost.`); saveGame(); render();
}

// ---- Save / mute persistence ----
const SAVE_KEY = "streetline_save_v2";
const SAVE_BACKUP_KEY = "streetline_save_backup_v1";
const SAVE_SCHEMA_VERSION = 3;
const MUTE_KEY = "streetline_muted_v1";
let muted = false;
let lastSaveSucceeded = true;
try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) {}

function saveGame() {
  if (!appStarted || !state || state.over) return false;
  try {
    state.saveSchemaVersion = SAVE_SCHEMA_VERSION;
    state.lastSavedAt = new Date().toISOString();
    const payload = JSON.stringify(state);
    // Keep the previous valid save as a recovery copy before replacing the main save.
    const previous = localStorage.getItem(SAVE_KEY);
    if (previous) {
      try { JSON.parse(previous); localStorage.setItem(SAVE_BACKUP_KEY, previous); } catch (e) {}
    }
    localStorage.setItem(SAVE_KEY, payload);
    lastSaveSucceeded = true;
    return true;
  } catch (e) {
    lastSaveSucceeded = false;
    return false;
  }
}
function loadSave() {
  let s = null;
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
    // If the primary save is damaged, recover the last valid snapshot.
    if (!s || typeof s !== "object" || s.over) {
      const backup = localStorage.getItem(SAVE_BACKUP_KEY);
      if (backup) { try { const recovered = JSON.parse(backup); if (recovered && !recovered.over) { s = recovered; localStorage.setItem(SAVE_KEY, backup); } } catch (e) {} }
    }
    if (!s || typeof s !== "object" || s.over) return null;
    // Safe migrations preserve older runs and fill fields added in newer versions.
    s.maxDays = 60;
    s.currentVehicle = s.currentVehicle || "streetRunner";
    s.vehicleTuneLevel = Math.max(0,Math.min(3,Number(s.vehicleTuneLevel)||0));
    s.vehicleCondition = s.vehicleCondition == null ? 100 : Math.max(0, Math.min(100, s.vehicleCondition));
    s.businesses = s.businesses && typeof s.businesses === "object" ? s.businesses : {};
    s.inventory = s.inventory && typeof s.inventory === "object" ? s.inventory : {};
    s.stats = s.stats && typeof s.stats === "object" ? s.stats : {};
    s.contactInbox = Array.isArray(s.contactInbox) ? s.contactInbox.slice(-80) : [];
    s.saveSchemaVersion = SAVE_SCHEMA_VERSION;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {}
    return s;
  } catch (e) { return null; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_BACKUP_KEY); } catch (e) {}
}
function saveNow() {
  const ok = saveGame();
  if (ok) { if (typeof addLog === "function") addLog("Run saved on this device."); }
  else if (typeof addLog === "function") addLog("Save failed. Device storage may be full or unavailable.");
  render();
}
// Save when the player refreshes, closes the tab, or backgrounds the app.
window.addEventListener("pagehide", () => { if (appStarted && state && !state.over) saveGame(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && appStarted && state && !state.over) saveGame(); });
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (e) {}
  render();
}

let audioCtx = null;
function ac() {
  if (!audioCtx) {

function beep(freq, dur, type, vol, delay) {
  if (muted) return;
  const ctx = ac();
  if (!ctx) return;
  try {
    const t0 = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol || 0.18, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}

  { id:"runner", name:"RUNNER", cost:2500, incomeMult:0.15, desc:"+15% daily business income" },
  { id:"manager", name:"MANAGER", cost:3500, conditionLoss:0.5, desc:"Cuts condition loss in half" },
  { id:"connector", name:"CONNECTOR", cost:4000, trustBonus:2, desc:"+2 Contact Trust per day" },
  { id:"watcher", name:"WATCHER", cost:4500, rivalCut:2, desc:"Cuts Rival Pressure each day" },
  { id:"accountant", name:"ACCOUNTANT", cost:6000, incomeShield:0.15, desc:"Protects 15% of business income from bad days" }
];
const EMPIRE_LEVELS = [
  { name:"OWNER", min:1, max:1 },
  { name:"OPERATOR", min:2, max:3 },
  { name:"BOSS", min:4, max:5 },
  { name:"TYCOON", min:6, max:6 },
  { name:"EMPIRE", min:7, max:99 }
];

function businessOwned(id) { return !!(state.businesses && state.businesses[id]); }
function businessCount() { return Object.keys(state.businesses || {}).length; }
function businessLevel() {
  const n = businessCount();
  return (EMPIRE_LEVELS.find(x => n >= x.min && n <= x.max) || EMPIRE_LEVELS[EMPIRE_LEVELS.length-1]).name;
}
function businessCondition(id) {
  return Math.max(0, Math.min(100, Math.round(state.businesses?.[id]?.condition ?? 100)));
}
function businessManager(id) { return state.businesses?.[id]?.manager || null; }
function businessIncome(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || !businessOwned(id)) return 0;
  const conditionMult = 0.5 + businessCondition(id) / 200;
  const mgr = BUSINESS_MANAGERS.find(x => x.id === businessManager(id));
  const managerMult = mgr?.incomeMult || 0;
  const hqBoost = businessOwned("hq") ? 1.10 : 1;
  const level = Math.max(0, Math.min(3, Number(state.businesses?.[id]?.level)||0));
  const upgradeMult = 1 + level * 0.15;
  const skillMult = 1 + (typeof skillLevel === "function" ? skillLevel("empireMind")*.05 : 0);
  return Math.round(b.income * conditionMult * (1 + managerMult) * hqBoost * upgradeMult * skillMult);
}
function businessUpgradeCost(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || !businessOwned(id)) return null;
  const level = Math.max(0, Math.min(3, Number(state.businesses?.[id]?.level)||0));
  return level >= 3 ? null : Math.round(b.cost * (0.20 + level * 0.10));
}
function upgradeBusiness(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || !businessOwned(id)) return;
  const cost = businessUpgradeCost(id);
  if (cost === null) { addLog(`${b.name} is fully upgraded.`); render(); return; }
  if (state.cash < cost) { sndFail(); addLog(`Need $${cost.toLocaleString()} to upgrade ${b.name}.`); render(); return; }
  state.cash -= cost;
  state.businesses[id].level = Math.min(3, (Number(state.businesses[id].level)||0) + 1);
  state.stats.businessUpgrades = (state.stats.businessUpgrades||0)+1;
  sndGood(); addLog(`${b.name} upgraded to level ${state.businesses[id].level}. Income increased by 15%.`); saveGame(); render();
}
function businessDailyIncome() {
  return BUSINESSES.reduce((sum,b) => sum + businessIncome(b.id), 0);
}
function businessMaintenanceCost(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || !businessOwned(id)) return 0;
  return Math.max(50, Math.round(b.cost * 0.01));
}
function businessEmpireValue() {
  return BUSINESSES.reduce((sum,b) => sum + (businessOwned(b.id) ? b.cost : 0), 0);
}
function empireManagerCost(id) {
  const b = state.businesses?.[id];
  if (!b) return 0;
  const current = b.manager;
  return current ? 0 : 0;
}
function businessCanBuy(b) {
  if (!b || businessOwned(b.id)) return false;
  if (b.empire && businessCount() < 6) return false;
  return state.cash >= b.cost;
}
function buyBusiness(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || businessOwned(id)) return;
  if (b.empire && businessCount() < 6) {
    sndFail(); addLog("HQ requires 6 other businesses first."); render(); return;
  }
  if (state.cash < b.cost) {
    sndFail(); addLog(`Not enough cash for ${b.name}.`); render(); return;
  }
  state.cash -= b.cost;
  state.businesses[id] = { condition:100, purchasedDay:state.day, manager:null };
  state.stats.businessesBought = (state.stats.businessesBought || 0) + 1;
  gainReputation(4, "business established");
  sndGood();
  addLog(`Opened ${b.name} in ${b.location} for $${b.cost.toLocaleString()}.`);
  render();
}
function maintainBusiness(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || !businessOwned(id)) return;
  const cost = businessMaintenanceCost(id);
  if (state.cash < cost) {
    sndFail(); addLog(`Not enough cash to maintain ${b.name}.`); render(); return;
  }
  state.cash -= cost;
  state.businesses[id].condition = Math.min(100, businessCondition(id) + 25);
  state.stats.businessMaintenance = (state.stats.businessMaintenance || 0) + cost;
  sndGood();
  addLog(`${b.name} maintenance complete. Condition +25%.`);
  render();
}
function hireBusinessManager(id, managerId) {
  const b = BUSINESSES.find(x => x.id === id);
  const mgr = BUSINESS_MANAGERS.find(x => x.id === managerId);
  if (!b || !mgr || !businessOwned(id)) return;
  if (state.businesses[id].manager === managerId) return;
  if (state.cash < mgr.cost) {
    sndFail(); addLog(`Not enough cash to hire a ${mgr.name}.`); render(); return;
  }
  state.cash -= mgr.cost;
  state.businesses[id].manager = managerId;
  state.stats.managersHired = (state.stats.managersHired || 0) + 1;
  sndGood();
  addLog(`Hired ${mgr.name} for ${b.name}.`);
  render();
}
function resolveBusinessAttack() {
  const owned = BUSINESSES.filter(b => businessOwned(b.id));
  if (!owned.length) return;
  const pressure = Math.max(0, ...Object.values(state.rivalPressure || {}));
  if (pressure < 60) return;
  const chance = Math.min(0.16, 0.04 + pressure / 1200);
  if (Math.random() >= chance) return;
  const target = owned[Math.floor(Math.random() * owned.length)];
  const entry = state.businesses[target.id];
  const damage = 8 + Math.floor(Math.random() * 8);
  entry.condition = Math.max(0, businessCondition(target.id) - damage);
  state.heat = Math.min(100, state.heat + 3);
  if (state.stats) state.stats.businessesHit = (state.stats.businessesHit || 0) + 1;
  sndBad();
  addLog(`Rivals hit ${target.name}. Condition -${damage}%.`);
}

function businessDailyTick() {
  if (!state.businesses) return;
  resolveBusinessAttack();
  let gross = 0;
  let maintenance = 0;
  Object.keys(state.businesses).forEach(id => {
    const b = BUSINESSES.find(x => x.id === id);
    if (!b) return;
    const entry = state.businesses[id];
    const mgr = BUSINESS_MANAGERS.find(x => x.id === entry.manager);
    const loss = mgr?.conditionLoss ?? 1.5;
    entry.condition = Math.max(0, businessCondition(id) - loss);
    const localPulse = b.location ? cityPulseFor(b.location) : null;
    const pulseMult = localPulse && localPulse.days > 0 ? localPulse.businessMult : 1;
    gross += Math.round(businessIncome(id) * pulseMult);
    if (b.heatCut) state.heat = Math.max(0, state.heat - b.heatCut);
    if (b.trust) {
      allWorldLocations().forEach(loc => {
        (CONTACTS[loc] || []).forEach(c => gainContactTrust(loc, c.role, b.trust));
      });
    }
    if (b.rivalCut) {
      Object.keys(state.rivalPressure || {}).forEach(k => state.rivalPressure[k] = Math.max(0, state.rivalPressure[k] - b.rivalCut));
    }
    if (b.recovery) recoverHealth(b.recovery, `${b.name} recovery`);
    if (b.energy) recoverEnergy(b.energy, `${b.name} rest`);
    if (mgr?.trustBonus) {
      allWorldLocations().forEach(loc => {
        (CONTACTS[loc] || []).forEach(c => gainContactTrust(loc, c.role, mgr.trustBonus));
      });
    }
    if (mgr?.rivalCut) {
      Object.keys(state.rivalPressure || {}).forEach(k => state.rivalPressure[k] = Math.max(0, state.rivalPressure[k] - mgr.rivalCut));
    }
  });
  if (gross > 0) {
    const pressure = Math.max(0, ...Object.values(state.rivalPressure || {}));
    const badDayLoss = pressure >= 50 ? Math.round(gross * Math.min(0.12, pressure / 1000)) : 0;
    const accountantOwned = Object.values(state.businesses).some(x => x.manager === "accountant");
    const protectedLoss = accountantOwned ? Math.round(badDayLoss * 0.15) : 0;
    const payout = Math.max(0, gross - badDayLoss + protectedLoss);
    state.cash += payout;
    state.stats.businessIncome = (state.stats.businessIncome || 0) + payout;
    if (badDayLoss > 0) {
      addLog(`Rival pressure cost the empire $${badDayLoss.toLocaleString()} in business income${accountantOwned ? ` — accountant protected $${protectedLoss.toLocaleString()}` : ''}.`);
    }
    addLog(`Businesses generated +$${payout.toLocaleString()} today.`);
  }
}
// ---- Neighborhood Influence 1.0 ----
function neighborhoodInfluence(loc) {
  if (!loc) return 0;
  let score = 0;
  if (state.territories?.[loc]) score += 35;
  const localBusinesses = BUSINESSES.filter(b => businessOwned(b.id) && b.location === loc);
  score += Math.min(30, localBusinesses.length * 15);
  const contacts = CONTACTS[loc] || [];
  const trustAvg = contacts.length ? contacts.reduce((sum, c) => sum + trustOf(loc, c.role), 0) / contacts.length : 0;
  score += Math.min(25, trustAvg * 0.25);
  score -= Math.min(20, (state.rivalPressure?.[loc] || 0) * 0.20);
  score -= Math.min(10, (state.heat || 0) * 0.05);
  return Math.max(0, Math.min(100, Math.round(score)));
}
function influenceTier(score) {
  if (score >= 80) return 'DOMINANT';
  if (score >= 60) return 'POWERFUL';
  if (score >= 40) return 'ESTABLISHED';
  if (score >= 20) return 'PRESENCE';
  return 'UNKNOWN';
}
function influenceBar(score) {
  const n = Math.max(0, Math.min(10, Math.round(score / 10)));
  return `<span class="stat-bars">${Array.from({length:10}, (_,i) => `<i class="${i<n ? 'on-market' : ''}"></i>`).join('')}</span>`;
}
function strongestInfluenceLocation() {
  return LOCATIONS.reduce((best, loc) => neighborhoodInfluence(loc) > neighborhoodInfluence(best) ? loc : best, LOCATIONS[0]);
}
function renderInfluenceCard() {
  const strongest = strongestInfluenceLocation();
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;font-weight:bold;"><span>🗺️ NEIGHBORHOOD INFLUENCE</span><span>${strongest ? strongest.toUpperCase() : '—'}</span></div>
    <div style="font-size:.7rem;color:var(--muted);margin:5px 0 9px;">Territories, businesses, contact trust, rival pressure and heat all shape your influence.</div>
    ${LOCATIONS.map(loc => {
      const score = neighborhoodInfluence(loc);
      return `<div style="margin:7px 0;"><div style="display:flex;justify-content:space-between;font-size:.7rem;"><span>${loc}</span><span>${score}% · ${influenceTier(score)}</span></div><div style="margin-top:3px;">${influenceBar(score)}</div></div>`;
    }).join('')}
  </div>`;
}

function renderCityWire() {
  const heat = Math.max(0, Math.min(100, Number(state.heat) || 0));
  const pressure = Math.round(Math.max(0, ...Object.values(state.rivalPressure || {}).map(v => Number(v) || 0)));
  const ownedBusinesses = businessCount();
  const territoryCount = Object.keys(state.territories || {}).length;
  const rep = Math.max(0, Number(state.reputation) || 0);
  const headlines = [];
  if (heat >= 70) headlines.push({ tag: 'POLICE SCANNER', text: 'Patrol activity is climbing. Keep your profile low.' });
  else if (heat <= 20) headlines.push({ tag: 'NEIGHBORHOOD WATCH', text: 'The streets are relatively quiet tonight.' });
  if (pressure >= 60) headlines.push({ tag: 'CREW WATCH', text: 'Rival crews are pushing hard for influence.' });
  else if (pressure <= 15) headlines.push({ tag: 'CREW WATCH', text: 'Rival pressure has eased across the city.' });
  if (ownedBusinesses >= 4) headlines.push({ tag: 'LOCAL BUSINESS', text: 'Independent businesses are becoming a serious city power.' });
  else headlines.push({ tag: 'LOCAL BUSINESS', text: 'New owners are trying to establish themselves around town.' });
  if (territoryCount > 0) headlines.push({ tag: 'TERRITORY DESK', text: `${territoryCount} neighborhood${territoryCount === 1 ? '' : 's'} under your control are shaping the local balance.` });
  if (rep >= 25) headlines.push({ tag: 'STREET TALK', text: 'Your name is carrying farther beyond your home block.' });
  const item = headlines[(Math.max(1, Number(state.day) || 1) - 1) % headlines.length];
  return `<div class="card" aria-label="City Wire local headlines"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><strong style="font-size:.82rem;letter-spacing:.08em;color:var(--green);">CITY WIRE</strong><span style="font-size:.62rem;color:var(--muted);">LOCAL HEADLINES · DAY ${Math.max(1, Number(state.day) || 1)}</span></div><div style="font-size:.68rem;color:var(--muted);margin-top:8px;">${item.tag}</div><div style="font-size:.8rem;margin-top:3px;line-height:1.4;">${item.text}</div><div style="display:flex;gap:12px;flex-wrap:wrap;font-size:.68rem;color:var(--muted);margin-top:10px;"><span>HEAT ${heat}%</span><span>RIVAL PRESSURE ${pressure}%</span><span>BUSINESSES ${ownedBusinesses}/${BUSINESSES.length}</span><span>TERRITORIES ${territoryCount}</span></div></div>`;
}

    </div>`).join("")}
  `;
}

function continueGame() {
  const saved = loadSave();
  if (!saved) {
    // A stale/missing save should never make the button appear dead.
    appStarted = false;
    charSelectOpen = false;
    render();
    return;
  }
  appStarted = true;
  splashDone = true;
  LOCATIONS = computeLocations();
  state = saved;
  // Normalize older saves before any render function touches their fields.
  state.cash = Number.isFinite(Number(state.cash)) ? Number(state.cash) : 0;
  state.bank = Number.isFinite(Number(state.bank)) ? Number(state.bank) : 0;
  state.debt = Number.isFinite(Number(state.debt)) ? Number(state.debt) : 0;
  state.day = Number.isFinite(Number(state.day)) ? Number(state.day) : 1;
  // All existing and new runs now use the 60-day campaign.
  state.maxDays = 60;
  state.location = state.location || LOCATIONS[0] || "Bungalow Park";

function showContinueTransition(){

function healthPct() {
  const max = state.maxHealth || 100;
  return Math.max(0, Math.min(100, Math.round(((state.health ?? max) / max) * 100)));
}

function healthClass() {
  const hp = healthPct();
  return hp <= 25 ? "danger" : hp <= 50 ? "warn" : "";
}

function recoverHealth(amount, reason) {
  const max = state.maxHealth || 100;
  const before = state.health ?? max;
  state.health = Math.min(max, before + Math.max(0, amount));
  const healed = state.health - before;
  if (healed > 0 && reason) addLog(`${reason} +${healed} HP.`);
  return healed;
}

function damageHealth(amount, reason) {
  const max = state.maxHealth || 100;
  const before = state.health ?? max;
  const perkCut = state.perkId === "iron" ? 0.15 : 0;
  const reduced = Math.max(0, amount * (1 - perkCut) * (1 - armorReduction()));
  state.health = Math.max(0, Math.round(before - reduced));
  const damage = before - state.health;
  state.stats.damageTaken = (state.stats.damageTaken || 0) + damage;
  if (damage > 0) addLog(`${reason} -${damage} HP.`);
  if (state.health <= 0 && !state.over) {
    state.health = 0;
    state.pendingEvent = { type: "hospital", cause: reason };
    sndBad();
    return true;
  }
  return false;
}

const MARKET_EVENTS = [
  { id:"rush", name:"DEMAND SURGE", copy:"Word spread fast. Buyers are paying a premium today.", buy:1.08, sell:1.22, demand:1.30, chance:14 },
  { id:"oversupply", name:"OVERSUPPLY", copy:"Too much product hit the block. Prices are soft today.", buy:.82, sell:.78, demand:.82, chance:14 },
  { id:"shortage", name:"SUPPLY SHORTAGE", copy:"Stock is scarce here. Buying costs more, but sellers have leverage.", buy:1.24, sell:1.12, demand:1.12, chance:10 },
  { id:"crackdown", name:"POLICE CRACKDOWN", copy:"The market is tense. Activity is down and prices are volatile.", buy:1.05, sell:.84, demand:.72, chance:10 },
  { id:"festival", name:"NIGHTLIFE WEEKEND", copy:"More people are out. Demand and selling prices are up.", buy:1.04, sell:1.18, demand:1.24, chance:12 },
  { id:"quiet", name:"QUIET MARKET", copy:"A slow day. Buyers are scarce and sellers compete harder.", buy:.92, sell:.86, demand:.78, chance:15 },
  { id:"steady", name:"NORMAL CONDITIONS", copy:"No major event. Local demand sets the pace.", buy:1, sell:1, demand:1, chance:25 }
];
function pickMarketEvent() {
  const total=MARKET_EVENTS.reduce((n,e)=>n+e.chance,0); let r=Math.random()*total;
  for(const e of MARKET_EVENTS){r-=e.chance;if(r<=0)return {...e,day:Number(state.day)||1};}
  return {...MARKET_EVENTS[MARKET_EVENTS.length-1],day:Number(state.day)||1};
}
function marketEventFor(loc) {
  if(!state.marketEvents || typeof state.marketEvents!=='object') state.marketEvents={};
  let event=state.marketEvents[loc];
  if(!event || Number(event.day)!==Number(state.day)) { event=pickMarketEvent(); state.marketEvents[loc]=event; }
  return event;
}
function demandFor(loc,key) {
  const event=marketEventFor(loc);
  const locMod=LOCATION_MODS[loc] || REGIONAL_LOCATION_MODS[loc] || {priceMult:1,volMult:1};
  const localFactor=Math.max(.72,Math.min(1.32,1+(Number(locMod.volMult||1)-1)*.18));
  const productIndex=Math.max(0,DRUGS.findIndex(d=>d.key===key));
  const itemFactor=[.94,1.08,1.02,.90,1.12,.97,1.05][productIndex%7];
  return Math.max(.55,Math.min(1.65,event.demand*localFactor*itemFactor));
}
function rollPrices(loc) {
  state.prices[loc] = {};
  const mod = LOCATION_MODS[loc] || REGIONAL_LOCATION_MODS[loc] || { priceMult: 1, volMult: 1 };
  const event=pickMarketEvent();
  if(!state.marketEvents || typeof state.marketEvents!=='object') state.marketEvents={};
  state.marketEvents[loc]=event;
  DRUGS.forEach((d,index) => {
    const vol = Math.min(.48, d.vol * (mod.volMult || 1));
    const swing = 1 + (Math.random() * 2 - 1) * vol;
    const itemFactor=[.94,1.08,1.02,.90,1.12,.97,1.05][index%7];
    const localDemand=Math.max(.72,Math.min(1.32,1+((mod.volMult||1)-1)*.18));
    let price = Math.max(4, Math.round(d.base * (mod.priceMult||1) * swing * itemFactor * localDemand));
    if (Math.random() < 0.06) {
      const spike = Math.random() < 0.5 ? 1.55 : 0.68;
      price = Math.round(price * spike);
      if (!state._spikeNote) state._spikeNote = [];
      state._spikeNote.push(`${d.name} ${spike > 1 ? "spiked" : "dipped"} in ${loc}`);
    }
    state.prices[loc][d.key] = price;
  });
}

function streetLingo(msg) {
  const swaps = [
    [/Not enough cash/gi, "You are short on bread"],
    [/Not enough Energy/gi, "You are low on juice"],
    [/mission went sideways/gi, "job went left"],
    [/job went clean/gi, "job came back clean"],
    [/LOCATION UNLOCKED/g, "NEW BLOCK OPEN"],
    [/Paid down/gi, "Chipped away at"],
    [/Upgraded the stash bag/gi, "Levelled up the stash bag"],
    [/Heat rises/gi, "Heat is climbing"],
  ];
  let line = String(msg);
  swaps.forEach(([pattern, replacement]) => { line = line.replace(pattern, replacement); });
  return line;
}
function streetTalkLine() {
  const local = {
    "Northside": "Northside stays alert. Let your moves speak; don't do the most.",
    "Woodland": "Woodland looks quiet, but the locals peep everything. Move natural.",
    "Ridgewood": "Ridgewood got long memories. Keep it solid and don't burn a bridge."
  };
  if (local[state.location]) return local[state.location];
  const lines = [
    "Move smart; every shortcut comes with a price.",
    "Keep your word and your numbers straight. Trust is currency.",
    "Heat is climbing. Lay low before the whole block starts talking.",
    "Don't flash the bread. Make it work for you.",
    "New block, new rules. Read the room before you move.",
    "Everybody got a story. Watch what they do, not what they say.",
    "Stay ten toes, keep your head clear, and don't chase every play.",
    "A quiet win still counts. You don't have to announce every move."
  ];
  const idx = ((Number(state.day)||1) + String(state.location||"").length + (Number(state.heat)>=60?3:0)) % lines.length;
  return lines[idx];
}
function addLog(msg) {
  msg = streetLingo(msg);
  state.log.unshift(msg);
  state.log = state.log.slice(0, 6);
}

function invUsed() {
  return Object.values(state.inventory).reduce((a,b) => a+b, 0);
}

function netWorth() {
  const stock = DRUGS.reduce((sum,d) => sum + d.base * state.inventory[d.key], 0);
  return state.cash + state.bank + Math.round(stock*0.4) - state.debt;
}

function nameOf(key) { return DRUGS.find(d => d.key === key).name; }

// ---- Contacts / trust ----
function contactKey(loc, role) { return loc + "::" + role; }
function contactOf(loc, role) { return (CONTACTS[loc] || []).find(c => c.role === role); }
function trustOf(loc, role) { return state.contactTrust[contactKey(loc, role)] || 0; }
function gainContactTrust(loc, role, amt) {
  const k = contactKey(loc, role);
  state.contactTrust[k] = Math.min(100, (state.contactTrust[k] || 0) + amt);
}
function bumpAllContacts(loc, amt) {
  (CONTACTS[loc] || []).forEach(c => gainContactTrust(loc, c.role, amt));
}
function tierIndex(trust) { return Math.min(4, Math.floor(trust / 25)); }
function tierWord(trust) { return TIER_WORDS[tierIndex(trust)]; }
function contactMilestones(trust) { return [25,50,75,100].map(v => trust >= v); }
function favorReady(loc, role) {
  const trust = trustOf(loc, role);
  const last = state.contactFavorUsedDay[contactKey(loc, role)];
  return trust >= 50 && (last === undefined || (state.day - last) >= 5);
}
function callInFavor(loc, role) {
  const c = contactOf(loc, role);
  if (!c) return;
  const k = contactKey(loc, role);
  if (trustOf(loc, role) < 50) { sndFail(); addLog(`${c.name} says you need more trust first.`); render(); return; }
  if (!favorReady(loc, role)) { sndFail(); addLog(`${c.name}'s favor isn't ready yet.`); render(); return; }
  state.contactFavorUsedDay[k] = state.day;
  state.contactFavors[k] = (state.contactFavors[k] || 0) + 1;
  recoverEnergy(15, `${c.name}'s favor`);
  recoverHealth(5, `${c.name}'s favor`);
  sndGood();
  addLog(`${c.name} came through. +15 Energy and +5 Health.`);
  render();
}

function contactConversation(loc, role, topic, contact, trustBefore) {
  const scripts = {
    connector: {
      word: ["You want the real version? Listen more than you talk. The block tells on itself if you give it time.", "I heard a few things, but I'm not handing names around. Keep showing up and I'll know you can handle it."],
      people: ["Everybody has a story. The trick is figuring out who's talking to help and who's talking to get paid.", "I can point you in the right direction, but you still have to make your own read on people."],
      check: ["You checked in. That counts. Most people only remember a contact when they need something.", "Good to see you come through without a whole speech. Keep that energy and we'll be straight."]
    },
    market: {
      word: ["Prices don't move for no reason. Watch what people ask for, not just what they buy.", "I keep my ear on the numbers. Don't rush a deal just because somebody sounds confident."],
      people: ["Everybody wants a shortcut. The smart move is knowing what something is worth before you open your wallet.", "I can help you read the room, but don't confuse a loud offer with a good one."],
      check: ["Business is business, but respect still matters. You keep it fair with me, I'll do the same.", "You came to talk, not just grab something and vanish. I notice that."]
    },
    muscle: {
      word: ["Keep your head clear and don't let somebody else's problem become your whole day.", "The safest trouble is the trouble you see coming and walk around."],
      people: ["Loyalty is shown in the quiet moments, not the big promises. Remember that.", "I don't need a speech. Be consistent and we'll understand each other."],
      check: ["All good over here. I respect somebody who checks in before things get messy.", "You showed respect by stopping through. That goes further than people think."]
    }
  };
  const topicKey = topic === 'people' || topic === 'shop' ? 'people' : topic === 'check' ? 'check' : 'word';
  const lines = (scripts[role] || scripts.connector)[topicKey];
  const reply = lines[(Math.floor((trustBefore + state.day + contact.name.length) / 8)) % lines.length];
  const playerLines = {word:'“What’s the word around here?”',people:role==='market'?'“Talk me through the business.”':role==='muscle'?'“Who should I keep an eye on?”':'“Who’s worth knowing?”',check:'“Just checking in. How you been?”'};
  return {name:contact.name,topic:topicKey,day:state.day,player:playerLines[topicKey],reply,beforeTrust:trustBefore,trust:Math.min(100,trustBefore+8)};
}

function talkTo(loc, role, topic = "word") {
  // Defensive init keeps this working with older saved games too.
  state.talkedDay = state.talkedDay || {};
  state.dealsSinceTalk = state.dealsSinceTalk || {};
  state.contactTrust = state.contactTrust || {};

  const c = contactOf(loc, role);
  if (!c) {
    addLog("That contact isn't available in this location.");
    render();
    return;
  }

  const k = contactKey(loc, role);
  if (state.talkedDay[k] === state.day) {
    addLog(`${c.name} has nothing new for you today.`);
    render();
    return;
  }

  const trustBefore = trustOf(loc, role);
  state.contactDialogue = state.contactDialogue || {};
  state.contactDialogue[k] = contactConversation(loc, role, topic, c, trustBefore);
  gainContactTrust(loc, role, 8);
  state.talkedDay[k] = state.day;
  state.dealsSinceTalk[loc] = 0;
  addLog(`Talked with ${c.name}. +8 Trust.`);
  render();
  // Sound is optional; never let audio prevent the contact action from rendering.
  try { sndClick(); } catch (e) {}
}

// Expose contact action explicitly for mobile browsers and inline button handlers.
window.talkTo = talkTo;

function ensureLocationMarketData(loc) {
  if (!state.prices) state.prices = {};
  if (!state.prices[loc] || typeof state.prices[loc] !== "object") rollPrices(loc);
  if (!state.prices[loc]) state.prices[loc] = {};
  return state.prices[loc];
}

function getBuyPrice(key) {
  const prices = ensureLocationMarketData(state.location);
  const base = prices[key] ?? DRUGS.find(d => d.key === key).base;
  const t = trustOf(state.location, "market") / 100;
  const pulse = cityPulseFor(state.location);
  const cityMult = pulse && pulse.days > 0 ? pulse.buyMult : 1;
  const event=marketEventFor(state.location);
  const demandMult=Math.max(.78,Math.min(1.28,.92+demandFor(state.location,key)*.12));
  return Math.max(1, Math.round(base * (1.05 - 0.10 * t) * rivalMarketMult(state.location, "buy") * cityMult * (event.buy||1) * demandMult * (1 - skillLevel("trader")*.03)));
}
function getSellPrice(key) {
  const prices = ensureLocationMarketData(state.location);
  const base = prices[key] ?? DRUGS.find(d => d.key === key).base;
  const t = trustOf(state.location, "market") / 100;
  const pulse = cityPulseFor(state.location);
  const cityMult = pulse && pulse.days > 0 ? pulse.sellMult : 1;
  const event=marketEventFor(state.location);
  const demandMult=Math.max(.68,Math.min(1.42,.70+demandFor(state.location,key)*.30));
  return Math.max(1, Math.round(base * (0.90 + 0.05 * t) * rivalMarketMult(state.location, "sell") * cityMult * (event.sell||1) * demandMult * (1 + skillLevel("negotiator")*.03)));
}
function priceLevel(key) {
  const prices = ensureLocationMarketData(state.location);
  const base = prices[key] ?? DRUGS.find(d => d.key === key).base;
  const mod = LOCATION_MODS[state.location] || { priceMult: 1 };
  const typical = DRUGS.find(d => d.key === key).base * mod.priceMult;
  const ratio = base / typical;
  if (ratio < 0.85) return { word: "LOW", cls: "tag-low" };
  if (ratio > 1.15) return { word: "HIGH", cls: "tag-high" };
  return { word: "FAIR", cls: "tag-fair" };
}

// ---- quantity / amount setters (inline, no modal) ----
function setQty(n) {
  n = Math.max(1, Math.floor(Number(n)) || 1);
  state.qty = n;
  render();
}
function stepQty(delta) { setQty(state.qty + delta); }

function setBankAmt(n) {
  n = Math.max(0, Math.floor(Number(n)) || 0);
  state.bankAmt = n;
  render();
}
function setDebtAmt(n) {
  n = Math.max(0, Math.floor(Number(n)) || 0);
  state.debtAmt = n;
  render();
}

function buy(key) {
  const qty = state.qty;
  const price = getBuyPrice(key);
  const cost = price * qty;
  if (qty <= 0) return;
  if (invUsed() + qty > stashCapacity()) { sndFail(); addLog("Not enough room in the stash."); render(); return; }
  if (cost > state.cash) { sndFail(); addLog("Not enough cash."); render(); return; }
  state.cash -= cost;
  state.inventory[key] += qty;
  const loc = state.location;
  const heatMult = (LOCATION_MODS[loc] || {}).heatMult ?? 1;
  const muscleCut = 1 - 0.3 * (trustOf(loc, "muscle") / 100);
  state.heat = Math.min(100, state.heat + qty * 0.4 * heatMult * muscleCut);
  bumpAllContacts(loc, 1);
  state.dealsSinceTalk[loc] = (state.dealsSinceTalk[loc] || 0) + 1;
  rivalBump(loc, Math.min(4, Math.max(1, Math.ceil(qty / 5))));
  state.stats.totalSpent += cost;
  state.dealHistory = Array.isArray(state.dealHistory) ? state.dealHistory : [];
  state.dealHistory.unshift({day:state.day,loc:state.location,action:'BUY',item:localName(key),qty,total:cost}); state.dealHistory=state.dealHistory.slice(0,8);

  lastDealFeedback = {kind:"buy", text:`PURCHASE COMPLETE · ${qty} ${localName(key)} · −$${cost.toLocaleString()}`};
  try { saveGame(); } catch(e) {}
  render();
}

function sellAll(key) {
  if (!state || !Object.prototype.hasOwnProperty.call(state.inventory || {}, key)) return;
  const owned = Math.max(0, Math.floor(Number(state.inventory[key]) || 0));
  if (owned < 1) { sndFail(); addLog(`You don't have any ${localName(key)} to sell.`); render(); return; }
  const previousQty = state.qty;
  state.qty = owned;
  sell(key);
  if (state) { state.qty = Math.max(1, Math.min(Number(previousQty)||1, Math.max(1, stashCapacity()))); saveGame(); render(); }
}
function sell(key, unitPriceOverride) {
  let qty = Math.min(Math.max(0, Math.floor(Number(state.qty)||0)), Math.max(0, Math.floor(Number(state.inventory[key])||0)));
  if (qty <= 0) { sndFail(); addLog(`You don't have any ${localName(key)} to sell.`); render(); return; }
  const price = Number.isFinite(Number(unitPriceOverride)) && Number(unitPriceOverride) > 0 ? Math.round(Number(unitPriceOverride)) : getSellPrice(key);
  const total = price * qty;
  state.inventory[key] -= qty;
  state.cash += total;
  bumpAllContacts(state.location, 1);
  state.dealsSinceTalk[state.location] = (state.dealsSinceTalk[state.location] || 0) + 1;
  rivalBump(state.location, Math.min(3, Math.max(1, Math.ceil(qty / 5))));
  state.stats.totalRevenue += total;
  state.dealHistory = Array.isArray(state.dealHistory) ? state.dealHistory : [];
  state.dealHistory.unshift({day:state.day,loc:state.location,action:'SELL',item:localName(key),qty,total}); state.dealHistory=state.dealHistory.slice(0,8);
  gainReputation(Math.max(1, Math.floor(qty / 10)), "profitable market activity");
  sndSell();
  addLog(`Sold ${qty} ${localName(key)} for $${total.toLocaleString()}.`);
  lastDealFeedback = {kind:"sell", text:`SALE COMPLETE · ${qty} ${localName(key)} · +$${total.toLocaleString()}`};
  try { saveGame(); } catch(e) {}
  render();
}

function bankDeposit() {
  const amt = Math.min(state.bankAmt, state.cash);
  if (amt <= 0) { sndFail(); addLog("Nothing to deposit."); render(); return; }
  state.cash -= amt;
  state.bank += amt;
  sndClick();
  addLog(`Stashed $${amt.toLocaleString()} in the bank.`);
  render();
}
function bankWithdraw() {
  const amt = Math.min(state.bankAmt, state.bank);
  if (amt <= 0) { sndFail(); addLog("Nothing to withdraw."); render(); return; }
  state.bank -= amt;
  state.cash += amt;
  sndClick();
  addLog(`Pulled $${amt.toLocaleString()} from the bank.`);
  render();
}
function payDebt() {
  const amt = Math.min(state.debtAmt, state.cash, state.debt);
  if (amt <= 0) { sndFail(); addLog("Nothing to pay."); render(); return; }
  state.cash -= amt;
  state.debt -= amt;
  gainReputation(Math.max(1, Math.floor(amt / 1000)), "debt paid down");
  sndClick();
  addLog(`Paid down $${amt.toLocaleString()} of debt.`);
  render();
}

function bagUpgradeCost() { return 400 + state.capacityLevel * 300; }
function upgradeBag() {
  const cost = bagUpgradeCost();

function rivalFor(loc) {
  const exact = RIVALS.find(r => r.home === loc);
  if (exact) return exact;
  if (typeof REGIONAL_LOCATIONS !== "undefined" && REGIONAL_LOCATIONS.includes(loc)) {
    return RIVALS.find(r => r.region === "regional") || RIVALS[0];
  }
  return RIVALS[Math.max(0, LOCATIONS.indexOf(loc)) % RIVALS.length];
}
function rivalPressureFor(loc) {
  const r = rivalFor(loc);
  return Math.max(0, Math.min(100, Number((state.rivalPressure || {})[r.id] || 0)));
}
function rivalStatus(p) {
  if (p < 20) return "QUIET";
  if (p < 45) return "WATCHING";
  if (p < 70) return "ACTIVE";
  return "HOT";
}
function rivalMarketMult(loc, side) {
  const p = rivalPressureFor(loc);
  if (p < 45) return 1;
  const amount = Math.min(0.08, (p - 40) * 0.002);
  return side === "buy" ? 1 + amount : 1 - amount;
}
function rivalBump(loc, amount) {
  const r = rivalFor(loc);
  if (!state.rivalPressure) state.rivalPressure = {};
  state.rivalPressure[r.id] = Math.max(0, Math.min(100, (state.rivalPressure[r.id] || 0) + amount));
}
function rivalCool(loc, amount) {
  const r = rivalFor(loc);
  if (!state.rivalPressure) state.rivalPressure = {};
  state.rivalPressure[r.id] = Math.max(0, (state.rivalPressure[r.id] || 0) - amount);
}
function checkRivalEvent() {
  if (state.pendingEvent || state.over || state.day < 4) return false;
  const p = rivalPressureFor(state.location);
  if (p < 35 || Math.random() >= Math.min(0.18, 0.03 + p * 0.0015)) return false;
  const rival = rivalFor(state.location);
  state.pendingEvent = { type:"rival", rivalId:rival.id, rivalName:rival.name, style:rival.style, pressure:p };
  state.stats.rivalEncounters = (state.stats.rivalEncounters || 0) + 1;
  sndBad();
  return true;
}
function resolveRival(choice) {
  const ev = state.pendingEvent;
  if (!ev || ev.type !== "rival") return;
  const loc = state.location;
  const rival = rivalFor(loc);
  const p = rivalPressureFor(loc);
  if (choice === "negotiate") {
    const fee = Math.min(state.cash, 150 + Math.round(p * 2));
    state.cash -= fee; rivalCool(loc, 25); state.heat = Math.max(0, state.heat - 3);
    state.stats.rivalNegotiated = (state.stats.rivalNegotiated || 0) + 1;
    sndGood(); addLog(`You negotiated with ${rival.name}. Pressure drops and the market cools off.`);
  } else if (choice === "laylow") {
    const energy = Math.min(10, state.energy || 0);
    spendEnergy(energy, "Laying low"); state.stats.energySpent = (state.stats.energySpent || 0) + energy;
    rivalCool(loc, 18); state.heat = Math.max(0, state.heat - 8);
    state.stats.rivalAvoided = (state.stats.rivalAvoided || 0) + 1;
    sndClick(); addLog(`You kept a low profile. ${rival.name} loses interest for now.`);
  } else if (choice === "compete") {
    const chance = Math.max(0.35, 0.72 - rival.power / 250 + (state.perkId === "hustler" ? 0.08 : 0));
    const success = Math.random() < chance;
    state.stats.rivalChallenges = (state.stats.rivalChallenges || 0) + 1;
    if (success) {
      rivalCool(loc, 12); state.cash += 250; state.heat = Math.min(100, state.heat + 2);
      sndGood(); addLog(`You held your market position. +$250 and rival pressure eases.`);
    } else {
      rivalBump(loc, 12); state.cash = Math.max(0, state.cash - Math.min(state.cash, 175));
      state.heat = Math.min(100, state.heat + 7);
      sndBad(); addLog(`The market pushed back. You lost some cash and rival pressure rises.`);
    }
  }
  state.pendingEvent = null;
  render();
}

// ---- Territory ownership (claim a town, pay upkeep, risk drops the longer you hold it) ----
const TERRITORY_COST = 1000;
const TERRITORY_UPKEEP = 150;
function territoryHeldDays(loc) {
  const t = state.territories[loc];
  return t ? Math.max(0, state.day - t.claimedDay) : 0;
}
function territoryRiskCut(loc) {
  if (!state.territories[loc]) return 1;
  return 1 - Math.min(0.3, territoryHeldDays(loc) * 0.02);
}
function claimTerritory(loc) {
  if (state.territories[loc]) return;
  if (state.cash < TERRITORY_COST) { sndFail(); addLog("Not enough cash to claim this territory."); render(); return; }
  state.cash -= TERRITORY_COST;
  state.territories[loc] = { claimedDay: state.day };
  rivalBump(loc, 12);
  sndGood();
  addLog(`Claimed ${loc} as your territory. Upkeep $${TERRITORY_UPKEEP} every 5 days.`);
  render();
}

function territoryDefenseLevel(loc) {
  return Math.max(0, Math.min(3, Number(state.territoryDefense?.[loc] || 0)));
}
function reinforceTerritory(loc) {
  if (!state.territories?.[loc]) return;
  const level = territoryDefenseLevel(loc);
  if (level >= 3) { addLog(`${loc} is already fully reinforced.`); render(); return; }
  const cost = 750 + level * 750;
  if (state.cash < cost) { sndFail(); addLog(`Not enough cash to reinforce ${loc}.`); render(); return; }
  state.cash -= cost;
  state.territoryDefense[loc] = level + 1;
  state.stats.territoryReinforced = (state.stats.territoryReinforced || 0) + 1;
  rivalCool(loc, 5);
  sndGood();
  addLog(`Reinforced ${loc}. Defense level ${level + 1}/3.`);
  render();
}
function checkTerritoryDispute() {
  if (state.pendingEvent || state.over || state.day < 5) return false;
  const loc = state.location;
  if (!state.territories?.[loc]) return false;
  const pressure = rivalPressureFor(loc);
  if (pressure < 55) return false;
  const defense = territoryDefenseLevel(loc);
  const chance = Math.max(0.015, Math.min(0.12, 0.035 + (pressure - 50) * 0.0015 - defense * 0.012));
  if (Math.random() >= chance) return false;
  const rival = rivalFor(loc);
  state.pendingEvent = { type:'territory', loc, rivalId:rival.id, rivalName:rival.name, pressure, defense };
  state.stats.territoryDisputes = (state.stats.territoryDisputes || 0) + 1;
  sndBad();
  return true;
}
function resolveTerritory(choice) {
  const ev = state.pendingEvent;
  if (!ev || ev.type !== 'territory') return;
  const loc = ev.loc;
  const defense = territoryDefenseLevel(loc);
  const pressure = rivalPressureFor(loc);
  if (!state.territories?.[loc]) { state.pendingEvent = null; render(); return; }
  if (choice === 'negotiate') {
    const fee = Math.min(state.cash, 200 + Math.round(pressure * 3));
    state.cash -= fee; rivalCool(loc, 30); state.heat = Math.max(0, state.heat - 4);
    addLog(`You negotiated over ${loc}. Paid $${fee.toLocaleString()} and cooled the dispute.`);
    sndGood();
  } else if (choice === 'reinforce') {
    const cost = 500 + defense * 500;
    if (state.cash < cost) { addLog(`Not enough cash to reinforce ${loc} right now.`); render(); return; }
    state.cash -= cost;
    state.territoryDefense[loc] = Math.min(3, defense + 1);
    rivalCool(loc, 12 + defense * 4);
    state.heat = Math.min(100, state.heat + 1);
    state.stats.territoryReinforced = (state.stats.territoryReinforced || 0) + 1;
    addLog(`You reinforced ${loc}. Defense is now ${territoryDefenseLevel(loc)}/3.`);
    sndGood();
  } else if (choice === 'hold') {
    const chance = Math.min(0.92, 0.55 + defense * 0.10 + territoryHeldDays(loc) * 0.005 - Math.max(0, pressure - 55) * 0.003);
    if (Math.random() < chance) {
      rivalCool(loc, 22); state.heat = Math.min(100, state.heat + 2);
      state.stats.territoryWins = (state.stats.territoryWins || 0) + 1;
      gainReputation(6, "territory held");
      addLog(`You held ${loc}. Rival pressure drops.`); sndGood();
    } else {
      delete state.territories[loc];
      delete state.territoryDefense[loc];
      rivalBump(loc, 8); state.heat = Math.min(100, state.heat + 6);
      state.stats.territoryLosses = (state.stats.territoryLosses || 0) + 1;
      addLog(`You lost control of ${loc}. The territory is gone.`); sndBad();
    }
  }
  state.pendingEvent = null;
  render();
}
