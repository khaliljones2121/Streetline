      sndClick();
    }
  } else if (ev.kind === "business") {
    if (choice === "a") {
      if (state.cash < 100) {
        addLog("Not enough cash for maintenance. The issue stays unresolved.");
        sndBad();
      } else {
        state.cash -= 100;
        state._businessMaintenanceBoost = 1;
        addLog("Maintenance handled. Your businesses are ready for the next day.");
        sndGood();
      }
    } else {
      state._businessMaintenanceBoost = 0;
      addLog("You deferred maintenance. Tomorrow's business income may take a hit.");
      sndClick();
    }
  } else if (ev.kind === "safehouse") {
    if (choice === "a") {
      recoverEnergy(12, "Safehouse recovery");
      recoverHealth(4, "Safehouse recovery");
      state.heat = Math.max(0, state.heat - 5);
      addLog("You took the quiet night. Energy +12, Health +4, Heat -5.");
      sndGood();
    } else {
      addLog("You stayed active. The safehouse remains available later.");
      sndClick();
    }
  } else if (ev.kind === "market") {
    if (choice === "a") {
      if (state.energy < 4) {
        addLog("You're too low on juice to check the rumor properly. The word passes you by.");
        sndBad();
      } else {
        spendEnergy(4, "Checking a neighborhood rumor");
        const market = ensureCityMarket();
        market[state.location] = { type:"rush", days:2, buyMult:1.08, sellMult:1.18, businessMult:1.10, rumor:`Word is ${state.location} is picking up. Demand's looking better for a day or two.` };
        gainContactTrust(state.location, "connector", 3);
        addLog(`You checked the word. ${state.location} demand looks stronger for the next couple days. Connector trust +3.`);
        sndGood();
      }
    } else {
      addLog("You let the rumor ride. No energy spent; the market will do what it does.");
      sndClick();
    }
  } else if (ev.kind === "rivalRumor") {
    if (choice === "a") {
      state.heat = Math.max(0, state.heat - 4);
      recoverEnergy(2, "Keeping a low profile");
      const rival = (typeof RIVALS !== "undefined" ? RIVALS : []).find(r => r.home === state.location);
      if (rival) state.rivalPressure[rival.id] = Math.max(0, (state.rivalPressure[rival.id] || 0) - 4);
      addLog("You kept your profile low. Heat -4 and the block gets a little quieter.");
      sndGood();
    } else {
      gainReputation(2, "showed face after a rumor");
      state.heat = Math.min(100, state.heat + 2);
      addLog("You showed face. Reputation +2, but the extra attention nudged Heat up by 2.");
      sndClick();
    }
  }

  state.pendingEvent = null;
  render();
}

function ensureCityMarket() {
  if (!state.cityMarket || typeof state.cityMarket !== "object") state.cityMarket = {};
  return state.cityMarket;
}
function cityPulseFor(loc) {
  return ensureCityMarket()[loc] || null;
}
function cityPulseLine() {
  const pulse = cityPulseFor(state.location);
  if (pulse && pulse.days > 0) return pulse.rumor;
  const lines = [
    `${state.location} is moving regular today. Keep your eyes open and your plans flexible.`,
    `Word on the block: the mood can change quick. Check prices before you commit.`,
    `Folks are talking, but not every rumor is worth chasing. Read the room.`,
    `The city never sits still. One good connection can change your whole day.`
  ];
  return lines[(Number(state.day || 1) + String(state.location || "").length) % lines.length];
}
function tickCityPulse() {
  const market = ensureCityMarket();
  Object.keys(market).forEach(loc => {
    market[loc].days = Math.max(0, Number(market[loc].days || 0) - 1);
    if (!market[loc].days) delete market[loc];
  });
  // A city-wide rumor or demand shift appears every few days, not on every turn.
  if (Math.random() < 0.38) {
    const places = (typeof allWorldLocations === "function" ? allWorldLocations() : LOCATIONS).filter(Boolean);
    if (!places.length) return;
    const loc = places[Math.floor(Math.random() * places.length)];
    const type = ["rush", "slow", "watch"][Math.floor(Math.random() * 3)];
    const pulse = type === "rush"
      ? { type, days: 2, buyMult: 1.12, sellMult: 1.12, businessMult: 1.18, rumor: `Word is ${loc} is busy today. Demand's up — don't sleep on the swing.` }
      : type === "slow"
      ? { type, days: 2, buyMult: 0.90, sellMult: 0.90, businessMult: 0.86, rumor: `${loc} is moving slow. Prices feel soft and local business is taking a breather.` }
      : { type, days: 2, buyMult: 1.06, sellMult: 0.96, businessMult: 0.95, rumor: `People say eyes are on ${loc}. Keep it low-key and don't chase every play.` };
    market[loc] = pulse;
    addLog(`CITY WIRE: ${pulse.rumor}`);
  }
}

function advanceDay() {
  state.day++;
  delete state._spikeNote;
  state.maxCash = Math.max(state.maxCash || 0, state.cash || 0);
  state.maxHeat = Math.max(state.maxHeat || 0, state.heat || 0);
  state.maxHealthReached = Math.max(state.maxHealthReached || 0, state.health || 0);
  const previous = { health: state.health, energy: state.energy, heat: state.heat, cash: state.cash, bank: state.bank, debt: state.debt };
  const energyRest = 5;
  recoverEnergy(energyRest, "A night's rest");
  if (state.health < (state.maxHealth || 100)) {
    recoverHealth(5, "A night's rest puts you back on your feet.");
  }
  businessDailyTick();
  if (state.perkId === "ghost") state.heat = Math.max(0, state.heat - 8 - skillLevel("lowProfile")*2);
  else state.heat = Math.max(0, state.heat - 3 - skillLevel("lowProfile")*2);
  LOCATIONS.forEach(l => rollPrices(l));
  REGIONAL_LOCATIONS.forEach(l => rollPrices(l));
  tickCityPulse();
  Object.keys(state.rivalPressure || {}).forEach(id => { state.rivalPressure[id] = Math.max(0, state.rivalPressure[id] - 3); });
  sndTravel();
  state.netWorthHistory.push({ day: state.day, nw: netWorth() });
  state.daySummary = {
    day: state.day - 1, cash: state.cash - previous.cash, health: state.health - previous.health,
    energy: state.energy - previous.energy, heat: state.heat - previous.heat, nw: netWorth()
  };

  if (state.day % 5 === 0) {
    const interest = Math.round(state.debt * 0.12);
    state.debt += interest;
    state.stats.totalInterestPaid += interest;
    addLog(`The loan shark's crew adds $${interest.toLocaleString()} interest. Debt: $${state.debt.toLocaleString()}.`);

    Object.keys(state.territories).forEach(loc => {
      const total = TERRITORY_UPKEEP;
      if (state.cash >= total) {
        state.cash -= total;
        addLog(`Paid $${total.toLocaleString()} upkeep on ${loc}.`);
      } else if (state.cash + state.bank >= total) {
        const fromBank = total - state.cash;
        state.bank -= fromBank;
        state.cash = 0;
        addLog(`Paid $${total.toLocaleString()} upkeep on ${loc} (dipped into the bank).`);
      } else {
        delete state.territories[loc];
        sndBad();
        addLog(`Lost control of ${loc} — couldn't cover the upkeep.`);
      }
    });
  }

  if (state.day > state.maxDays) {
    ensureExpansionState();
    if (!state.legacyMode) {
      state.legacyMode = true;
      state.legacyStartedDay = state.day;
      state.legacyCycles = 0;
      state.regionBadges = state.regionBadges || {};
      state.regionBadges["60-day-survivor"] = true;
      const legacyBonus = Math.max(1000, Math.round(Math.max(0, netWorth()) * 0.02));
      state.cash += legacyBonus;
      (netWorth() >= 0 ? sndGood : sndBad)();
      addLog(`DAY 60 COMPLETE · LEGACY MODE UNLOCKED. One-time legacy bonus: $${legacyBonus.toLocaleString()}. Your run and save continue.`);
    } else if ((state.day - state.maxDays) % 30 === 0) {
      state.legacyCycles = (state.legacyCycles || 0) + 1;
      const legacyBonus = Math.max(1500, Math.round(Math.max(0, netWorth()) * 0.025));
      state.cash += legacyBonus;
      state.regionBadges[`legacy-${state.legacyCycles}`] = true;
      gainReputation(2, "legacy milestone");
      addLog(`LEGACY MILESTONE ${state.legacyCycles} · +$${legacyBonus.toLocaleString()} and +2 reputation. The city keeps moving.`);
      sndGood();
    }
  }

  if (state.heat >= 90) {
    state.wantedStreak = (state.wantedStreak || 0) + 1;
    gainReputation(1, "survived a high-heat day");
  } else {
    state.wantedStreak = 0;
  }
  if (state.wantedStreak >= 3 && state.bank > 0) {
    const seized = Math.round(state.bank * 0.25);
    state.bank -= seized;
    state.heat = Math.max(0, state.heat - 40);
    state.wantedStreak = 0;
    sndBad();
    addLog(`You're too hot. Cops raided your bank account and took $${seized.toLocaleString()}.`);
  }

  if (state.mission && state.day > state.mission.expires) { addLog(`${state.mission.contact}'s job expired.`); state.stats.missionsFailed = (state.stats.missionsFailed||0) + 1; state.mission = null; }
  generateMission();
  if (generateLivingWorldEvent()) { render(); return; }

  if (!state.pendingEvent && Math.random() < 0.10) {
    const streetEvents = [
      { title: "⚠ STREET PROBLEM", text: "Someone outside the spot recognizes you and starts asking questions.", a: "WALK AWAY", b: "PAY $75", kind: "questions" },
      { title: "⚠ LOST WALLET", text: "You spot a wallet on the sidewalk. Nobody seems to be watching.", a: "LEAVE IT", b: "TAKE THE RISK", kind: "wallet" },
      { title: "⚠ CLOSED BLOCK", text: "A block ahead is shut down. You can wait it out or take a rough shortcut.", a: "WAIT", b: "SHORTCUT", kind: "block" }
    ];
    state.pendingEvent = { type: "street", ...streetEvents[Math.floor(Math.random()*streetEvents.length)] };
    sndClick();
  }
  if (checkTerritoryDispute()) { render(); return; }
  if (checkRivalEvent()) { render(); return; }

  const dealsSince = state.dealsSinceTalk[state.location] || 0;
  const snitchThreshold = 12;
  const snitchChance = dealsSince > snitchThreshold ? Math.min(0.35, (dealsSince - snitchThreshold) * 0.02) : 0;
  if (Math.random() < snitchChance) {
    const contacts = CONTACTS[state.location] || [];
    const snitch = contacts[Math.floor(Math.random() * contacts.length)];
    state.pendingEvent = { type: "snitch", name: snitch ? snitch.name : "someone close to you", demand: Math.round(150 + state.cash * 0.15) };
    sndBad();
    render();
    return;
  }

  const mod = LOCATION_MODS[state.location] || { policeMult: 1, gangMult: 1 };
  const connectorCut = 1 - 0.3 * (trustOf(state.location, "connector") / 100);
  const territoryCut = territoryRiskCut(state.location);
  const policeChance = 0.16 * mod.policeMult * connectorCut * territoryCut;
  const gangChance = 0.14 * mod.gangMult * connectorCut * territoryCut;
  const roll = Math.random();
  if (roll < policeChance) {
    state.pendingEvent = { type: "police" };
    sndPolice();
  } else if (roll < policeChance + gangChance) {
    state.pendingEvent = { type: "gang", demand: Math.round(150 + Math.random()*350 + state.cash*0.1) };
    sndGang();
  } else if (state._spikeNote && state._spikeNote.length) {
    addLog(state._spikeNote[0]);
  }
  render();
}

function resolveStreet(choice) {
  const ev = state.pendingEvent;
  if (!ev) return;
  if (ev.kind === "questions") {
    if (choice === "a") { state.heat = Math.max(0, state.heat - 3); recoverEnergy(2, "Keeping your head down"); addLog("You kept moving and the situation faded behind you."); sndGood(); }
    else { state.cash = Math.max(0, state.cash - 75); state.heat = Math.max(0, state.heat - 8); addLog("You paid to keep things quiet."); sndClick(); }
  } else if (ev.kind === "wallet") {
    if (choice === "a") { state.heat = Math.max(0, state.heat - 1); addLog("You left the wallet where it was. No complications."); sndGood(); }
    else { const found = 40 + Math.floor(Math.random()*160); state.cash += found; state.heat = Math.min(100, state.heat + 4); addLog(`You took the risk and found $${found}. Heat +4%.`); sndClick(); }
  } else if (ev.kind === "block") {
    if (choice === "a") { recoverEnergy(5, "Waiting it out"); addLog("You waited for the block to clear."); sndGood(); }
    else { spendEnergy(8, "Shortcut"); state.stats.energySpent = (state.stats.energySpent||0)+8; state.heat = Math.min(100, state.heat + 5); damageHealth(5, "The shortcut gets rough"); addLog("The shortcut saved time but cost energy and raised heat."); sndBad(); }
  }
  if (state.health > 0) state.pendingEvent = null;
  render();
}

function resolvePolice(choice) {
  const heatFactor = state.heat / 100;
  if (choice === "run") {
    const caught = Math.random() < (0.25 + heatFactor*0.4);
    if (caught) {
      const lostPct = 0.4 + Math.random()*0.3;
      DRUGS.forEach(d => state.inventory[d.key] = Math.floor(state.inventory[d.key]*(1-lostPct)));
      const fine = Math.round(state.cash*0.3);
      state.cash -= fine;
      state.heat = Math.max(0, state.heat - 30);
      state.stats.policeCaught++;
      damageHealth(15, "The checkpoint roughs you up");
      sndBad();
      addLog(`Cops caught you running. Product seized, fined $${fine.toLocaleString()}.`);
    } else {
      state.stats.policeEscaped++;
      sndGood();
      addLog("You slipped past the patrol.");
    }
  } else if (choice === "bribe") {
    const bribe = Math.min(state.cash, Math.round(200 + state.heat*8));
    state.cash -= bribe;
    state.heat = Math.max(0, state.heat - 50);
    state.stats.policeBribed++;
    sndClick();
    addLog(`Paid a $${bribe.toLocaleString()} "toll" to look the other way.`);
  }
  if (state.health > 0) state.pendingEvent = null;
  render();
}

function resolveGang(choice) {
  const ev = state.pendingEvent;
  if (choice === "pay") {
    const amt = Math.min(state.cash, ev.demand);
    state.cash -= amt;
    state.stats.gangPaid++;
    sndClick();
    addLog(`Paid ${amt < ev.demand ? "everything you had — " : ""}$${amt.toLocaleString()} to walk away.`);
  } else if (choice === "run") {
    const escaped = Math.random() < 0.55;
    if (escaped) {
      state.stats.gangEscaped++;
      sndGood();
      addLog("You bolted down an alley and lost them.");
    } else {
      const lostPct = 0.2 + Math.random()*0.3;
      DRUGS.forEach(d => state.inventory[d.key] = Math.floor(state.inventory[d.key]*(1-lostPct)));
      const cashLoss = Math.round(state.cash * 0.25);
      state.cash -= cashLoss;
      state.stats.gangCaught++;
      damageHealth(20, "The ambush leaves you bruised");
      sndBad();
      addLog(`They caught you. Roughed up, took $${cashLoss.toLocaleString()} and some product.`);
    }
  } else if (choice === "fight") {
    const weapon = currentWeapon();
    const win = Math.random() < (0.45 + weapon.winBonus);
    if (win) {
      const take = Math.round((80 + Math.random()*200) * weapon.takeMult);
      state.cash += take;
      state.stats.fightsWon++;
      sndGood();
      addLog(`Won the scrap${weapon.name !== "Unarmed" ? ` with the ${weapon.name}` : ""}, took $${take.toLocaleString()} off them.`);
    } else {
      const cashLoss = Math.round(state.cash * 0.35 * weapon.lossMult);
      state.cash -= cashLoss;
      state.stats.fightsLost++;
      damageHealth(30, "The fight leaves you hurt");
      sndBad();
      addLog(`Lost the fight. Down $${cashLoss.toLocaleString()} and bruised.`);
    }
  }
  if (state.health > 0) state.pendingEvent = null;
  render();
}

function resolveHospital(choice) {
  if (choice === "hospital") {
    const cost = 250;
    if (state.cash < cost) {
      sndFail();
      addLog("You can't afford the hospital. You have to lay low.");
      choice = "laylow";
    } else {
      state.cash -= cost;
      state.health = state.maxHealth || 100;
      state.heat = Math.max(0, state.heat - 10);
      sndGood();
      addLog(`Paid $${cost.toLocaleString()} for treatment. Health restored to ${state.health}.`);
    }
  }
  if (choice === "laylow") {
    state.health = Math.max(60, Math.round((state.maxHealth || 100) * 0.6));
    state.heat = Math.max(0, state.heat - 15);
    sndGood();
    addLog(`You lay low until you're back to ${state.health} HP. Heat cools off.`);
  }
  state.pendingEvent = null;
  render();
}

function resolveSnitch(choice) {
  const ev = state.pendingEvent;
  const loc = state.location;
  if (choice === "payoff") {
    const amt = Math.min(state.cash, ev.demand);
    state.cash -= amt;
    state.heat = Math.max(0, state.heat - 20);
    sndClick();
    addLog(`Paid $${amt.toLocaleString()} to make ${ev.name}'s tip disappear before it reached anyone.`);
  } else {
    const lostPct = 0.35 + Math.random() * 0.25;
    DRUGS.forEach(d => state.inventory[d.key] = Math.floor(state.inventory[d.key] * (1 - lostPct)));
    const fine = Math.round(state.cash * 0.3);
    state.cash -= fine;
    state.stats.policeCaught++;
    damageHealth(10, "The snitch fallout leaves you shaken");
    sndBad();
    addLog(`${ev.name} dropped a dime on you. Cops hit you for $${fine.toLocaleString()} and most of your stash.`);
  }
  // A snitch event means someone in this town's crew already turned once — trust takes a hit.
  (CONTACTS[loc] || []).forEach(c => {
    const k = contactKey(loc, c.role);
    state.contactTrust[k] = Math.max(0, (state.contactTrust[k] || 0) - 15);
  });
  state.dealsSinceTalk[loc] = 0;
  if (state.health > 0) state.pendingEvent = null;
  render();
}

function setView(v) {
  // Navigation keys remain mounted during the landing screen, so guard against
  // a click before a run has created the game state.
  if (!appStarted || !state) return;
  if (v === "map") {
    if (REGIONAL_LOCATIONS.includes(state.location)) {
      mapRegion = "regional";
      mapSelectedLocation = state.location;
    } else if (MARINA_LOCATIONS.includes(state.location)) {
      mapRegion = "marina";
      mapSelectedLocation = state.location;
    } else {
      mapRegion = "atlantic";
      if (!SOUTH_SIDE_LOCATIONS.includes(mapSelectedLocation)) mapSelectedLocation = state.location;
    }
  }
  state.view = v;
  render();
}

function esc(s) { return String(s); }

function sparklineSVG(history) {
  if (!history || history.length < 2) return "";
  const w = 300, h = 60, pad = 4;
  const values = history.map(pt => pt.nw);
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0);
  const range = (max - min) || 1;
  const stepX = (w - 2 * pad) / (history.length - 1);
  const pts = history.map((pt, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((pt.nw - min) / range) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const last = values[values.length - 1];
  const color = last >= 0 ? "#22c55e" : "#ff6b7d";
  const zeroY = h - pad - ((0 - min) / range) * (h - 2 * pad);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:60px;display:block;">
      <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>
  `;
}

function computeBadges() {
  const s = state.stats || {};
  const nw = netWorth();
  const maxTrust = Math.max(0, ...Object.values(state.contactTrust || {}));
  const badges = [];
  if (nw >= 0) badges.push({ label: "Debt Free", desc: "Ended the run in the black." });
  if (s.policeCaught === 0 && s.gangCaught === 0) badges.push({ label: "Untouchable", desc: "Never once got caught." });
  if (s.totalSpent >= 20000) badges.push({ label: "Big Spender", desc: "Moved $20,000+ in product." });
  if (s.fightsWon >= 3 && s.fightsLost === 0) badges.push({ label: "Sharp Shooter", desc: "Won every fight you had." });
  if (maxTrust >= 100) badges.push({ label: "Maxed Out", desc: "Earned a contact's full trust." });
  if (state.justUnlocked) badges.push({ label: "Trailblazer", desc: `Opened up ${state.justUnlocked}.` });
  if (state.capacityLevel >= 2) badges.push({ label: "Bigger Bag", desc: "Upgraded the stash bag twice or more." });
  return badges;
}

function runAchievements() {
  const s = state.stats || {};
  const nw = netWorth();
  const visited = state.locationsVisited || [state.location];
  const territoryCount = Object.keys(state.territories || {}).length;
  const safehouseCount = Object.keys(state.safehouses || {}).length;
  const maxTrust = Math.max(0, ...Object.values(state.contactTrust || {}));
  return [
    { icon:"💰", label:"BIGGEST BAG", value:`$${(state.maxCash || state.cash || 0).toLocaleString()}`, desc:"Highest cash held during the run." },
    { icon:"📈", label:"MARKET KING", value:`$${Math.max(0, s.totalRevenue - s.totalSpent).toLocaleString()}`, desc:"Trading profit earned." },
    { icon:"🗺️", label:"CITY RUNNER", value:`${visited.length}/${LOCATIONS.length}`, desc:"Different locations visited." },
    { icon:"🏠", label:"NEIGHBORHOOD BOSS", value:`${territoryCount}`, desc:"Territories controlled at the end." },
    { icon:"🤝", label:"CONNECTED", value:`${maxTrust}%`, desc:"Highest contact trust reached." },
    { icon:"⚡", label:"ROAD WARRIOR", value:`${Math.round(s.energySpent || 0)}`, desc:"Energy spent during the run." },
    { icon:"❤️", label:"SURVIVOR", value:`${Math.round(state.health)}/${state.maxHealth || 100}`, desc:"Health remaining at the finish." },
    { icon:"👻", label:"GHOST RUN", value: state.maxHeat < 20 ? "YES" : "NO", desc:"Finished without ever reaching high heat." },
    { icon:"🔥", label:"HEAT MAGNET", value:`${Math.round(state.maxHeat || state.heat || 0)}%`, desc:"Highest heat reached." },
    { icon:"🏆", label:"60-DAY HUSTLE", value:"COMPLETE", desc:"Finished the full 60-day run." },
    { icon:"🏚️", label:"SAFEHOUSE NETWORK", value:`${safehouseCount}`, desc:"Safehouses owned at the end." },
  ];
}

function statsBreakdown() {
  const s = state.stats;
  const profit = s.totalRevenue - s.totalSpent;
  const badges = computeBadges();
  const achievements = runAchievements();
  return `
    <div class="section-label">ACHIEVEMENTS</div>
    <div class="card">
      ${achievements.map(a => `
        <div class="statline" style="align-items:flex-start;">
          <span style="color:var(--text);font-weight:bold;">${a.icon} ${a.label}</span>
          <span style="text-align:right;"><b>${a.value}</b><br><span class="muted">${a.desc}</span></span>
        </div>
      `).join("")}
    </div>
    ${badges.length ? `
    <div class="section-label">BADGES EARNED</div>
    <div class="card">
      ${badges.map(b => `
        <div class="statline" style="align-items:flex-start;">
          <span style="color:var(--green);font-weight:bold;">🏅 ${b.label}</span>
          <span style="text-align:right;">${b.desc}</span>
        </div>
      `).join("")}
    </div>` : ""}
    <div class="section-label">NET WORTH OVER TIME</div>
    <div class="card">${sparklineSVG(state.netWorthHistory)}</div>
    <div class="section-label">RUN BREAKDOWN</div>
    <div class="card">
      <div class="statline"><span>Trading revenue</span><span>$${s.totalRevenue.toLocaleString()}</span></div>
      <div class="statline"><span>Trading spend</span><span>$${s.totalSpent.toLocaleString()}</span></div>
      <div class="statline"><span>Trading profit</span><span class="${profit>=0?'tag-low':'tag-high'}">$${profit.toLocaleString()}</span></div>

function riskLabel(loc) {
  const mod = LOCATION_MODS[loc] || REGIONAL_LOCATION_MODS[loc] || {policeMult:1,gangMult:1};
  const avg = ((mod.policeMult || 1) + (mod.gangMult || 1)) / 2;
  if (avg <= 0.75) return "LOW";
  if (avg <= 1.1) return "MED";
  return "HIGH";
}
function mktLabel(loc) {
  const mod = LOCATION_MODS[loc] || REGIONAL_LOCATION_MODS[loc] || {priceMult:1};
  if (mod.priceMult <= 0.85) return "CHEAP";
  if (mod.priceMult <= 1.1) return "FAIR";
  return "RICH";
}

function statusBar() {
  const now = new Date();
  const h24 = now.getHours();
  const h = h24 % 12 || 12;
  const m = String(now.getMinutes()).padStart(2, "0");
  const isNight = h24 >= 19 || h24 < 6;
  return `
    <div class="statusbar">
      <span>${isNight ? "🌙" : "☀️"} ${h}:${m}</span>
      <span class="appname">STREETLINE</span>
      <span class="right">
        <button class="mutebtn" onclick="toggleMute()">${muted ? "🔇" : "🔊"}</button>
        <span class="bars"><span></span><span></span><span></span><span></span></span>
        <span class="battery"><span class="battery-fill"></span></span>
      </span>
    </div>
  `;
}

function render() {
  const screen = document.getElementById("screen");
  const keysEl = document.querySelector(".keysgrid");

  if (!splashDone) {
    document.body.classList.remove("apartment-mode");
    keysEl.style.visibility = "hidden";
    screen.innerHTML = renderSplash();
    return;
  }

  if (!appStarted) {
    document.body.classList.remove("apartment-mode");
    keysEl.style.visibility = "hidden";
    screen.innerHTML = statusBar() + (charSelectOpen ? renderCreateHustler() : renderLanding());
    return;
  }
  keysEl.style.visibility = "visible";

  if (!state) { screen.innerHTML = ""; return; }
  if (typeof ensureExpansionState === "function") ensureExpansionState();
  document.body.classList.toggle("apartment-mode", state.view === "home");
  if (state.view === "wardrobe") {
    saveGame();
    screen.innerHTML = statusBar() + renderWardrobe();
    return;
  }
  if (state.view === "home") {
    saveGame();
    screen.innerHTML = statusBar() + renderApartment();
    return;
  }

  state.maxCash = Math.max(state.maxCash || 0, state.cash || 0);
  state.maxHeat = Math.max(state.maxHeat || 0, state.heat || 0);
  state.maxHealthReached = Math.max(state.maxHealthReached || 0, state.health || 0);
  saveGame();

  document.querySelectorAll(".key").forEach(k => {
    k.classList.toggle("active", k.dataset.nav === state.view && !state.over && !state.pendingEvent);
  });
  const inboxNavCount=document.getElementById('inboxNavCount');
  if(inboxNavCount) { const unreadInbox=(state.contactInbox||[]).filter(m=>!m.read).length; inboxNavCount.textContent=unreadInbox?String(unreadInbox):''; inboxNavCount.classList.toggle('has-count',unreadInbox>0); }

  if (state.pendingEvent) {
    screen.innerHTML = statusBar() + renderEvent(state.pendingEvent);
    return;
  }

  if (state.over) {
    const nw = netWorth();
    screen.innerHTML = statusBar() + `
      <div class="hdr"><span>STREETLINE</span><span>RUN COMPLETE</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        ${avatarSVG(state.avatarId, 44, state.colorId, state.accessoryId, state.skinId, state.hairColorId, state.eyeColorId, state.outfitId, state.bottomId, state.shoeId, state.faceId, state.browId, state.mouthId, state.buildId, state.markingId, state.headwearId)}
        <h1 style="font-size:1.15rem;margin:0;">${state.playerName || "You"} — ${nw >= 0 ? "GOT OUT CLEAN" : "STILL IN THE HOLE"}</h1>
      </div>
      <div class="statrow">
        <div><span class="label">CASH</span>$${state.cash.toLocaleString()}</div>
        <div><span class="label">BANK</span>$${state.bank.toLocaleString()}</div>
        <div><span class="label">DEBT</span><span class="debt-val">$${state.debt.toLocaleString()}</span></div>
        <div><span class="label">NET</span>$${nw.toLocaleString()}</div>
      </div>
      <p style="font-size:0.85rem;color:var(--muted);">60 days on the street. ${nw >= 0 ? "You cleared your debt and then some." : "You're still under water — the crew won't forget."}</p>
      ${state.justUnlocked ? `
      <div class="card" style="border-color:var(--green);">
        <div style="font-size:0.9rem;font-weight:bold;color:var(--green);margin-bottom:4px;">🔓 NEW TERRITORY UNLOCKED</div>
        <div style="font-size:0.85rem;">${state.justUnlocked} is open for your next run.</div>
      </div>` : (nw >= 0 && EXTRA_LOCATIONS.every(isLocationUnlocked) ? `
      <div class="card">
        <div style="font-size:0.85rem;color:var(--muted);">All territory outside AC is already open — nothing left to unlock.</div>
      </div>` : (nw < 0 ? `
      <div class="card">
        <div style="font-size:0.85rem;color:var(--muted);">Win clean next time to unlock new territory outside AC.</div>
      </div>` : ""))}
      ${statsBreakdown()}
      <button class="btn btn-wide btn-green" onclick="openCharacterSelect()">RUN IT BACK</button>
    `;
    return;
  }

  let body = "";
  if (state.view === "deal") body = renderDeal();
  else if (state.view === "map") body = renderMap() + renderExpansionRegions();
  else if (state.view === "stash") body = renderStash();
  else if (state.view === "contacts") body = renderContacts();
  else if (state.view === "inbox") { state.view = "contacts"; body = renderContacts(); }

  screen.innerHTML = statusBar() + renderTop() + body + `
    <div class="section-label">LOG</div>
    <div class="log">${state.log.map(l => `<div>&gt; ${esc(l)}</div>`).join("")}</div>
  `;
  if (state.view === "map") { initMapPanZoom(); }
}

];
const APARTMENT_EXTRAS = [
  {id:"security",name:"DOOR SECURITY",cost:1500,desc:"Extra home security lowers Heat by another 6 whenever you rest."},
  {id:"storage",name:"STASH SHELVING",cost:2500,desc:"Organized shelves increase carry capacity by 10."},

function openApartment(){ if(!state)return; state.view="home"; render(); }
function apartmentGo(view){
  if(!state || document.documentElement.classList.contains('apt-transitioning'))return;
  document.documentElement.classList.add('apt-transitioning');
  window.setTimeout(()=>{
    state.view=view;
    render();
    document.documentElement.classList.remove('apt-transitioning');
    const screen=document.querySelector('.screen');
    if(screen)screen.scrollTop=0;
  },220);
}
function apartmentRest(){
  if(!state)return;
  const h=state.apartmentUpgrades||{};
  const tier=APARTMENT_LEVELS[Math.max(0,Math.min(3,Number(state.apartmentLevel||1)-1))];
  const hp=tier.restHealth+(h.comfort?12:0), en=tier.restEnergy+(h.comfort?12:0);
  const heatReduction=8+(h.security?6:0)+(h.workstation?4:0);
  const beforeH=state.health||0,beforeE=state.energy||0;
  state.health=Math.min(state.maxHealth||100,beforeH+hp);
  state.energy=Math.min(state.maxEnergy||100,beforeE+en);
  const beforeHeat=state.heat||0;
  state.heat=Math.max(0,beforeHeat-heatReduction);
  addLog(`Rested at home: Health +${Math.round(state.health-beforeH)}, Energy +${Math.round(state.energy-beforeE)}, Heat -${Math.round(beforeHeat-state.heat)}.`);
  sndGood(); render();
}
function buyApartmentLevel(level){
  if(!state)return;
  const next=APARTMENT_LEVELS.find(x=>x.level===level);
  const current=Number(state.apartmentLevel||1);
  if(!next||level!==current+1)return;
  if((state.cash||0)<next.cost){sndFail();addLog(`Need $${next.cost.toLocaleString()} cash for ${next.name}.`);render();return;}
  state.cash-=next.cost;state.apartmentLevel=level;state.capacity=(state.capacity||60)+next.capacity;
  addLog(`Apartment upgraded to ${next.name}. Stash capacity +${next.capacity}. Rest now restores ${next.restHealth} Health / ${next.restEnergy} Energy before extras.`);sndGood();render();
}
function buyApartmentExtra(id){
  if(!state)return;
  state.apartmentUpgrades=state.apartmentUpgrades||{};
  if(state.apartmentUpgrades[id])return;
  const x=APARTMENT_EXTRAS.find(a=>a.id===id);if(!x)return;
  if((state.cash||0)<x.cost){sndFail();addLog(`Need $${x.cost.toLocaleString()} cash for ${x.name}.`);render();return;}
  state.cash-=x.cost;state.apartmentUpgrades[id]=true;
  if(id==='storage')state.capacity=(state.capacity||60)+10;
  addLog(`Installed ${x.name}${id==='storage'?'. Stash capacity +10.':'.'}`);sndGood();render();
}

function slCurrentWardrobeCharacter(){
  // Character creator IDs are character01/character02 and femaleJune/femaleLuna.
  const id=String(state?.artCharacterId||'').toLowerCase();
  const gender=String(state?.gender||state?.playerGender||'').toLowerCase();
  if(id==='femalehailey')return 'female_3';
  if(id==='characterdin')return 'male_3';
  if(id==='femaleluna'||id==='female_2'||id==='female2')return 'female_2';
  if(id==='femalejune'||id==='female_1'||id==='female1')return 'female_1';
  if(id==='character02'||id==='male_2'||id==='male2')return 'male_2';
  if(id==='character01'||id==='male_1'||id==='male1')return 'male_1';
  return gender==='female'?'female_1':'male_1';
}
function slWardrobeRecolor(img, jacket, shirt, pants, shoes) {
  if(img.dataset.painted === 'yes') return;
  img.dataset.painted='yes';
  const cv=document.createElement('canvas');
  cv.width=512; cv.height=420;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0,512,420);
  const frame=cx.getImageData(0,0,512,420), d=frame.data;
  const female=(img.dataset.character||'').startsWith('female');
  const palettes={
    jacket:[[1,1,1],[.53,.59,.65],[.60,.34,.30],[.34,.52,.40],[.74,.65,.46]],
    shirt:[[1,1,1],[.50,.63,.75],[.74,.39,.43],[.35,.60,.45],[.88,.78,.60]],
    pants:[[1,1,1],[.42,.47,.56],[.43,.52,.37],[.64,.48,.38],[.25,.28,.33]],
    shoes:[[1,1,1],[.52,.37,.25],[.31,.48,.34],[.65,.65,.67],[.36,.38,.54]]
  };
  const sections=[
    {name:'jacket',sel:jacket,y1:110,y2:253,x1:185,x2:326},
    {name:'shirt',sel:shirt,y1:138,y2:228,x1:208,x2:304},
    {name:'pants',sel:pants,y1:235,y2:365,x1:190,x2:322},
    {name:'shoes',sel:shoes,y1:350,y2:410,x1:185,x2:329}
  ];
  // Recolor original outfit pixels only; never paste separate floating garments.
  // Preserve shading, texture, transparency, face and hands.
  for(const section of sections) {
    const colors=palettes[section.name];
    const tint=colors[section.sel%colors.length];
    if(section.sel===0)continue;
    for(let y=section.y1;y<section.y2;y++)for(let x=section.x1;x<section.x2;x++){
      const i=(y*512+x)*4;
      if(d[i+3]<35)continue;
      const r=d[i],g=d[i+1],b=d[i+2];
      const max=Math.max(r,g,b),min=Math.min(r,g,b);
      // Skin tones stay unchanged, particularly hands in the jacket region.
      if(section.name==='jacket'||section.name==='shirt'){
        if(r>g*1.15&&g>b*1.08&&r>85&&g>42)continue;
      }
      if(section.name==='pants'&&y<247)continue;
      const amount=.56;
      const light=(r+g+b)/3;
      d[i]=Math.min(255,r*(1-amount)+light*tint[0]*amount);
      d[i+1]=Math.min(255,g*(1-amount)+light*tint[1]*amount);
      d[i+2]=Math.min(255,b*(1-amount)+light*tint[2]*amount);
    }
  }
  cx.putImageData(frame,0,0);
  img.onload=null;
  img.src=cv.toDataURL('image/png');
}

function slFourCharacterPreview(w){

 const code=characterCodes[selected]||'M1';

 const filename=`${code}_J${val('jackets')}_S${val('shirts')}_P${val('pants')}_H${val('shoes')}`;
 let src=SL_COMPLETE_OUTFIT_IMAGES[filename];
 if(selected==='male_3'||selected==='female_3'){
  // Each of the 16 gear combinations has its own complete, full-body PNG.
  // No overlapping clothing layers, no modulo/recycled outfit index.
  const characterName=selected==='male_3'?'DIN':'HAILEY';

}

const PRODUCT_LOOKS = {

  pills:["CORE / WHITE","CORE / PEARL","CORE / STEEL","CORE / NIGHT"],
  powder:["DUST / CLEAR","DUST / SILVER","DUST / FROST","DUST / NIGHT"],
  crank:["SHARD / AMBER","SHARD / GOLD","SHARD / ICE","SHARD / NIGHT"],
  tar:["BLOCK / BLACK","BLOCK / CHARCOAL","BLOCK / SLATE","BLOCK / NIGHT"]
};
function productVariant(key){
  const idx=DRUGS.findIndex(x=>x.key===key);
  const n=PRODUCT_LOOKS[key]?.length || 4;
  return Math.abs((Number(state?.day)||1)*3 + idx*5) % n;
}
function productVisual(key){

    powder:`<path d="M18 13h28l-3 27H21z" fill="#111a20" stroke="${accent}" stroke-width="1.7"/><path d="M18 13h28v7H18z" fill="#1c2a31" stroke="${accent}" stroke-width="1"/><path d="M23 25c4-3 8 3 12 0s7 2 10-1" fill="none" stroke="#eaf7ff" stroke-opacity=".55" stroke-width="1.4"/><path d="M26 30h12M29 34h6" stroke="${accent}" stroke-width="1.2" stroke-linecap="round"/><circle cx="40" cy="16.5" r="1.8" fill="${accent}"/>`,

function acceptMarketOffer(key, multiplier) {
  const available = Math.max(0, Number(state.inventory[key]) || 0);
  const qty = Math.min(Math.max(1, Number(state.qty) || 1), available);
  if (!qty) { sndFail(); addLog(`No ${localName(key)} available for that contact offer.`); render(); return; }
  const base = getSellPrice(key);
  const total = Math.round(base * Number(multiplier || 1.2) * qty);
  state.inventory[key] -= qty;
  state.cash += total;
  state.stats = state.stats || {};
  state.stats.totalRevenue = (state.stats.totalRevenue || 0) + total;
  state.dealHistory = Array.isArray(state.dealHistory) ? state.dealHistory : [];
  state.dealHistory.unshift({day:state.day,loc:state.location,action:'CONTACT OFFER',item:localName(key),qty,total});
  state.dealHistory = state.dealHistory.slice(0,8);
  bumpAllContacts(state.location, 1);
  gainReputation(Math.max(1, Math.floor(qty / 10)), 'contact market offer');
  sndSell(); addLog(`CONTACT OFFER: moved ${qty} ${localName(key)} for $${total.toLocaleString()}.`); render();
}

let mapSelectedLocation = null;

let mapPanX = 0;
let mapPanY = 0;
let mapPointers = new Map();
let mapPinchStart = null;

function clampMapZoom(v) { return Math.max(1, Math.min(2.5, v)); }
function applyMapTransform() {
  const world = document.getElementById("streetMapWorld");
  if (!world) return;
  world.style.transition = "";
  const z = clampMapZoom(mapZoom);
  mapZoom = z;
  const maxPan = 48 * (z - 1);
  mapPanX = Math.max(-maxPan, Math.min(maxPan, mapPanX));
  mapPanY = Math.max(-maxPan, Math.min(maxPan, mapPanY));
  world.style.transform = `translate3d(${mapPanX}%, ${mapPanY}%, 0) scale(${mapZoom})`;
  const readout = document.getElementById("mapZoomReadout");
  if (readout) readout.textContent = `${Math.round(mapZoom * 100)}%`;
}
function setMapZoom(v) {
  mapZoom = clampMapZoom(v);
  if (mapZoom === 1) { mapPanX = 0; mapPanY = 0; }
  applyMapTransform();
  sndClick();
}
function zoomMap(delta) { setMapZoom(mapZoom + delta); }
function resetMapView() { mapZoom = 1; mapPanX = 0; mapPanY = 0; applyMapTransform(); sndClick(); }
function mapDistance(a,b) { return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
function initMapPanZoom() {
  const map = document.getElementById("streetMapViewport");
  if (!map || map.dataset.bound === "1") return;
  map.dataset.bound = "1";
  map.addEventListener("wheel", e => {
    e.preventDefault();
    zoomMap(e.deltaY < 0 ? 0.12 : -0.12);
  }, {passive:false});
  map.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch" && e.target.closest("button, input, label")) return;
    if (e.pointerType === "mouse") {
      map.setPointerCapture?.(e.pointerId);
      mapPointers.set(e.pointerId, {clientX:e.clientX, clientY:e.clientY, type:e.pointerType});
    } else if (e.pointerType === "touch") {
      mapPointers.set(e.pointerId, {clientX:e.clientX, clientY:e.clientY, type:e.pointerType});
      if (mapPointers.size === 2) {
        const pts = [...mapPointers.values()];
        mapPinchStart = {distance:mapDistance(pts[0],pts[1]), zoom:mapZoom};
      }
    }
  });
  map.addEventListener("pointermove", e => {
    if (!mapPointers.has(e.pointerId)) return;
    const prev = mapPointers.get(e.pointerId);
    const dx = e.clientX - prev.clientX, dy = e.clientY - prev.clientY;
    mapPointers.set(e.pointerId, {clientX:e.clientX, clientY:e.clientY, type:e.pointerType});
    if (e.pointerType === "mouse" && mapPointers.size === 1) {
      mapPanX += dx / Math.max(1, map.clientWidth) * 100;
      mapPanY += dy / Math.max(1, map.clientHeight) * 100;
      applyMapTransform();
    } else if (e.pointerType === "touch" && mapPointers.size === 2 && mapPinchStart) {
      e.preventDefault();
      const pts = [...mapPointers.values()];
      const ratio = mapDistance(pts[0], pts[1]) / mapPinchStart.distance;
      mapZoom = clampMapZoom(mapPinchStart.zoom * ratio);
      applyMapTransform();
    }
  }, {passive:false});
  const endPointer = e => {
    mapPointers.delete(e.pointerId);
    if (mapPointers.size < 2) mapPinchStart = null;
  };
  map.addEventListener("pointerup", endPointer);
  map.addEventListener("pointercancel", endPointer);
  applyMapTransform();
}

let locationTransitionBusy = false;

function selectMapLocation(loc) {
  if (!LOCATIONS.includes(loc)) { sndFail(); return; }
  if (state.pendingEvent || state.over || locationTransitionBusy) { sndFail(); return; }

  mapSelectedLocation = loc;
  mapDetailLocation = null;
  mapStreetDetail = null;
  nbZoomLevel = 1; nbPanX = 0; nbPanY = 0;

  const isCurrent = loc === state.location;
  const cost = Math.ceil(vehicleEnergyCost() / vehicleConditionMult());
  const energy = state.energy ?? (state.maxEnergy || 100);
  if (!isCurrent && energy < cost) {
    sndFail();
    addLog('Not enough Energy to travel. REST to recover +50 Energy.');
    render();
    return;
  }

  locationTransitionBusy = true;
  sndClick();

  const map = document.getElementById('streetMapWorld');
  if (map) {
    map.style.transition = 'transform .9s cubic-bezier(.18,.82,.2,1)';
    map.style.transformOrigin = '50% 50%';
    map.style.transform = 'scale(1.18)';
  }

  const risk = mapRiskLevel(loc, 'police') >= 4 ? 'HIGH POLICE' : mapRiskLevel(loc, 'gang') >= 4 ? 'HIGH GANG' : 'LOW PROFILE';
  const transition = document.createElement('div');
  transition.className = 'location-transition';
  transition.innerHTML = `
    <div class="lt-mapwash"></div>
    <div class="lt-card">
      <div class="lt-kicker">${isCurrent ? 'ARRIVING AT' : 'TRAVELING TO'}</div>
      <div class="lt-name">${esc(loc.toUpperCase())}</div>
      <div class="lt-row"><span>LOCAL CONDITIONS</span><b>${risk}</b></div>
      <div class="lt-row" style="margin-top:8px;"><span>${isCurrent ? 'STATUS' : 'TRAVEL COST'}</span><b>${isCurrent ? 'ON LOCATION' : cost + ' ENERGY'}</b></div>
      <div class="lt-bar"><i></i></div>
    </div>`;
  document.body.appendChild(transition);

  setTimeout(() => {
    transition.classList.add('leaving');
    setTimeout(() => {
      transition.remove();
      locationTransitionBusy = false;
      if (isCurrent) {
        state.view = 'deal';
        render();
      } else {
        travel(loc);
        state.view = 'deal';
        render();
      }
    }, 280);
  }, 760);
}

function neighborhoodAction(loc, action) {
  if (!LOCATIONS.includes(loc)) return;
  if (action === 'scout') {
    if (state.energy < 5) { sndFail(); addLog('Not enough Energy to scout this neighborhood.'); render(); return; }
    state.energy -= 5;
    gainContactTrust(loc, 'connector', 4);
    if (Math.random() < .35) { state.heat = Math.max(0, state.heat - 1); addLog(`Scouted ${loc}. You found a cleaner route.`); }
    else addLog(`Scouted ${loc}. Local streets are now more familiar.`);
    sndGood(); render();
  } else if (action === 'contacts') {
    const c = CONTACTS[loc]?.[0];
    if (!c) { addLog(`No known contact in ${loc} yet.`); sndFail(); render(); return; }
    gainContactTrust(loc, c.role, 6);
    addLog(`Checked in with ${c.name}. Trust +6.`);
    sndGood(); render();
  } else if (action === 'territory') {
    claimTerritory(loc);
  }
}
function streetAction(loc, poi, action) {
  if (!LOCATIONS.includes(loc)) return;
  const name = poi?.name || 'this location';
  if (action === 'inspect') {
    if (state.energy < 3) { sndFail(); addLog('Not enough Energy to inspect the area.'); render(); return; }
    state.energy -= 3;
    addLog(`Inspected ${name} in ${loc}. Area details updated.`);
    sndGood(); render();
  } else if (action === 'business') {
    const b = BUSINESSES.find(x => businessOwned(x.id) && x.location === loc && (name.includes(x.name) || x.name.includes(name)));
    if (b) addLog(`${b.name}: ${businessCondition(b.id)}% condition · +$${businessIncome(b.id)}/day.`);
    else addLog(`${name}: no owned business attached to this location.`);
    sndClick(); render();
  } else if (action === 'contact') {
    const c = CONTACTS[loc]?.[0];
    if (!c) { addLog(`No known contact at ${loc}.`); sndFail(); render(); return; }
    gainContactTrust(loc, c.role, 8);
    addLog(`Talked with ${c.name}. Trust +8.`);
    sndGood(); render();
  } else if (action === 'mission') {
    const c = CONTACTS[loc]?.[0];
    if (!c || trustOf(loc,c.role) < 25) { addLog('You need a connected local contact before a job can appear.'); sndFail(); render(); return; }

    state.heat = Math.min(100, state.heat + 2);
    addLog(`Completed a local job around ${name}. +$250 · Trust +10.`);
    sndGood(); render();
  }
}

let nbZoomLevel=1, nbPanX=0, nbPanY=0;
function nbApply(){const w=document.getElementById('nbWorld');if(!w)return;const z=Math.max(1,Math.min(2.6,nbZoomLevel));nbZoomLevel=z;const m=45*(z-1);nbPanX=Math.max(-m,Math.min(m,nbPanX));nbPanY=Math.max(-m,Math.min(m,nbPanY));w.style.transform=`translate3d(${nbPanX}%,${nbPanY}%,0) scale(${z})`;}

function initNeighborhoodMap(){
  const m=document.getElementById('nbViewport');
  if(!m||m.dataset.bound==='1')return;
  m.dataset.bound='1';
  let active=null,last=null,dragging=false;
  m.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    active=e.pointerId; dragging=false; last={x:e.clientX,y:e.clientY};
  });
  m.addEventListener('pointermove',e=>{
    if(active!==e.pointerId)return;
    const dx=e.clientX-last.x,dy=e.clientY-last.y;
    if(!dragging && Math.abs(dx)<8 && Math.abs(dy)<8)return;
    if(!dragging){
      if(Math.abs(dy)>Math.abs(dx)*1.15){ active=null; return; }
      dragging=true;
      m.setPointerCapture?.(e.pointerId);
    }
    last={x:e.clientX,y:e.clientY};
    nbPanX+=dx/Math.max(1,m.clientWidth)*100;
    nbPanY+=dy/Math.max(1,m.clientHeight)*100;
    nbApply();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>m.addEventListener(ev,()=>{active=null;last=null;dragging=false;}));
  m.addEventListener('wheel',e=>{e.preventDefault();nbZoom(e.deltaY<0?.15:-.15)},{passive:false});
  nbApply();
}

function ensureExpansionState(){
 if(!state)return;
 state.skills=state.skills&&typeof state.skills==="object"?state.skills:{};
 state.skillPointsSpent=Math.max(0,Number(state.skillPointsSpent)||0);
 state.legacyMode=!!state.legacyMode;state.legacyCycles=Math.max(0,Number(state.legacyCycles)||0);
 state.empireDividendDay=Number(state.empireDividendDay)||0;
 state.rivalWins=Number(state.rivalWins)||0;
 state.properties=state.properties&&typeof state.properties==="object"?state.properties:{};
 state.regionBadges=state.regionBadges&&typeof state.regionBadges==="object"?state.regionBadges:{};
 STREETLINE_SKILLS.forEach(x=>state.skills[x.id]=Math.max(0,Math.min(x.max,Number(state.skills[x.id])||0)));
}
function skillLevel(id){ensureExpansionState();return Math.max(0,Number(state?.skills?.[id])||0);}
function totalSkillPointsEarned(){return Math.floor(Math.max(0,Number(state?.reputation)||0)/8);}
function skillPointsAvailable(){ensureExpansionState();return Math.max(0,totalSkillPointsEarned()-(state.skillPointsSpent||0));}
function characterLevel(){if(!state)return 1;const xp=Math.max(0,Number(state.reputation)||0)*10+(state.stats?.missionsCompleted||0)*18+(state.stats?.businessesBought||0)*12+(state.dealHistory||[]).length*2+(state.rivalWins||0)*15;return Math.max(1,Math.floor(xp/100)+1);}
function characterXP(){if(!state)return 0;return Math.max(0,Number(state.reputation)||0)*10+(state.stats?.missionsCompleted||0)*18+(state.stats?.businessesBought||0)*12+(state.dealHistory||[]).length*2+(state.rivalWins||0)*15;}
function buySkill(id){ensureExpansionState();const sk=STREETLINE_SKILLS.find(x=>x.id===id);if(!sk)return;const level=skillLevel(id);if(level>=sk.max){addLog(`${sk.name} is fully upgraded.`);render();return;}if(skillPointsAvailable()<sk.cost){sndFail();addLog(`Need ${sk.cost} skill point to upgrade ${sk.name}. Earn reputation to gain points.`);render();return;}state.skills[id]=level+1;state.skillPointsSpent+=sk.cost;sndGood();addLog(`${sk.name} upgraded to level ${level+1}/${sk.max}.`);saveGame();render();}
function expansionRegionOpen(id){return regionUnlocked(id);}

function renderCampaignProgress() {
  const day=Math.max(1,Number(state.day)||1), progress=state.legacyMode?100:Math.min(100,Math.round(day/60*100));
  const achievements=[
    {name:"FIRST DEAL",desc:"Complete a buy or sale",done:(state.dealHistory||[]).length>0},
    {name:"KNOWN FACE",desc:"Reach 50 trust with a contact",done:contactTrustCount(50)>0},
    {name:"PROPERTY OWNER",desc:"Claim your first territory",done:territoryCountSafe()>0},
    {name:"BUSINESS OWNER",desc:"Open your first business",done:businessCountSafe()>0},
    {name:"CITY PLAYER",desc:"Unlock a new location",done:(state.unlockedLocations||[]).length>BASE_LOCATIONS.length},
    {name:"ESTABLISHED EMPIRE",desc:"Own 3 businesses",done:businessCountSafe()>=3},
    {name:"HALFWAY MARK",desc:"Reach day 30",done:day>=30},
    {name:"60-DAY SURVIVOR",desc:"Reach day 60",done:day>=60},
    {name:"LEGACY MODE",desc:"Keep building beyond day 60",done:!!state.legacyMode},
    {name:"CITY EXPANSION",desc:"Unlock Boardwalk Elite or The Heights",done:expansionRegionOpen("elite")||expansionRegionOpen("heights")}
  ];
  const done=achievements.filter(a=>a.done).length;
  return `<div class="card sl-campaign-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="section-label" style="margin:0 0 4px">CAMPAIGN PROGRESS</div><b>DAY ${Math.min(day,60)} / 60</b></div><b style="color:var(--green)">${progress}%</b></div><div class="sl-campaign-track"><div style="width:${progress}%"></div></div><div class="sl-campaign-stats"><span>ACHIEVEMENTS</span><b>${done}/${achievements.length}</b><span>MISSIONS</span><b>${Number(state.stats?.missionsCompleted)||0} CLEARED</b><span>LOCATIONS</span><b>${(state.locationsVisited||[]).length} VISITED</b></div><div class="sl-achievements">${achievements.map(a=>`<div class="sl-achievement ${a.done?'earned':''}"><span>${a.done?'✓':'○'}</span><div><b>${a.name}</b><small>${a.desc}</small></div></div>`).join('')}</div><div style="font-size:.62rem;color:var(--muted);margin-top:8px">Achievements are tracked on this run. Reaching day 60 triggers the existing run-end screen.</div></div>`;
}

function generateMission() {
  if (state.mission || Math.random() > 0.18) return;
  const c = contactOf(state.location, ["connector","market","muscle"][Math.floor(Math.random()*3)]);
  if (!c || trustOf(state.location, c.role) < 25) return;
  const rewards = [250, 400, 600];
  state.mission = { loc: state.location, contact: c.name, reward: rewards[Math.floor(Math.random()*rewards.length)], role: c.role, expires: state.day + 2 };
  addLog(`${c.name} has a job for you. Check CONTACTS.`);
}
function acceptMission() {
  const m = state.mission; if (!m || m.loc !== state.location) return;
  spendEnergy(8, "Mission"); state.stats.energySpent = (state.stats.energySpent||0)+8;
  const success = Math.random() < (0.68 + Math.min(.18, trustOf(state.location,m.role)/500));
  if (success) {
    const bonus = state.perkId === "hustler" ? 1.2 : 1;
    const pay = Math.round(m.reward * bonus); state.cash += pay; gainContactTrust(state.location,m.role,12); state.stats.missionsCompleted++; gainReputation(5, "mission completed");
    state.heat = Math.min(100, state.heat + 3); sndGood(); addLog(`${m.contact}'s job went clean. +$${pay.toLocaleString()} and trust increased.`);
  } else {
    state.stats.missionsFailed++; state.heat = Math.min(100, state.heat + 10); damageHealth(8, "The mission goes sideways"); sndBad(); addLog(`${m.contact}'s job went sideways. No payout and heat rises.`);
  }
  state.mission = null; render();
}
function declineMission() { if (!state.mission) return; addLog(`Passed on ${state.mission.contact}'s job.`); state.mission = null; render(); }
function renderRivalWatch() {
  const rival = rivalFor(state.location);
  const pressure = rivalPressureFor(state.location);
  return `
    <div class="section-label">RIVAL WATCH</div>
    <div class="card">
      <div class="contactname">${rival.name} <span class="trustpct">PRESSURE ${pressure}%</span></div>
      <div class="contactline">${rival.style}. Influence rating: ${rival.power}%.</div><div class="contactline">${rival.behavior || "Pressure pattern: standard."}</div>
      <div class="trustbar"><div class="trustfill" style="width:${pressure}%"></div></div>
      <div class="contactmeta"><span>STATUS · ${rivalStatus(pressure)}</span><span>HOME · ${rival.home}</span></div>
      <div class="contact-tier"><span>MARKET EFFECT</span><b>${pressure >= 45 ? "PRICES UNDER PRESSURE" : "NORMAL MARKET"}</b></div>
      <div style="font-size:.75rem;color:var(--muted);margin-top:8px;">Trading and territory claims raise pressure. It cools down over time.</div>
    </div>
  `;
}

function trustBeforeSafe(n) { return Math.max(0, Math.min(100, Number(n)||0)); }

  state.talkedDay=state.talkedDay||{};state.dealsSinceTalk=state.dealsSinceTalk||{};state.contactTrust=state.contactTrust||{};state.contactFavorUsedDay=state.contactFavorUsedDay||{};state.contactFavors=state.contactFavors||{};
  const loc=state.location, contacts=CONTACTS[loc]||[], roleNote={connector:'CONNECTOR',market:'MARKET',muscle:'MUSCLE'}, roleService={connector:'Info / Access',market:'Supplies / Deals',muscle:'Protection / Hit'}, rolePrice={connector:'$0 – $500',market:'$100 – $1,000',muscle:'$500 – $2,000'};
  const cards=contacts.map(c=>{const trust=trustOf(loc,c.role), talkedToday=state.talkedDay[contactKey(loc,c.role)]===state.day, milestones=contactMilestones(trust), ready=favorReady(loc,c.role);const favorText=trust<50?`Reach ${50-trust} more Trust to unlock a favor.`:ready?'Favor ready — restores 15 Energy + 5 Health.':'Favor used — available again after 5 days.';const convo=(state.contactDialogue||{})[contactKey(loc,c.role)];const showConvo=convo&&convo.day===state.day;const topicButtons=[['word',c.role==='market'?'ASK ABOUT PRICES':'ASK THE WORD'],['people',c.role==='market'?'TALK BUSINESS':c.role==='muscle'?'ASK ABOUT THE BLOCK':'ASK ABOUT PEOPLE'],['check','CHECK IN']].map(([topic,label])=>`<button class="btn" data-contact-talk="${String(loc).replace(/"/g,'&quot;')}" data-contact-role="${String(c.role).replace(/"/g,'&quot;')}" data-contact-topic="${topic}" ${talkedToday?'disabled':''}>${talkedToday?'DONE TODAY':label}</button>`).join('');return `<div class="contact-card-premium ${ready?'ready':''} ${(showConvo)?'expanded':''}" data-contact-card="1" data-contact-role-card="${c.role}"><div class="contact-portrait">${contactPortraitSVG(c,68)}</div><div class="contact-main"><div class="contact-topline"><div><div class="contactname">${esc(c.name)}</div><div class="contact-role">${roleNote[c.role]}</div></div></div><div class="contactline">⌖ ${esc(loc)}</div><div class="contact-mini-meta"><span>♟ Trust: <b>${trust}%</b></span><span>${roleService[c.role]}</span></div><div class="contact-trust-row"><span>TRUST</span><div class="trustbar"><div class="trustfill" style="width:${trust}%"></div></div><span class="trustpct">${trust}%</span></div></div><div class="contact-side"><b>${roleService[c.role]}</b>${rolePrice[c.role]}</div><button type="button" class="contact-arrow" data-contact-open="1" aria-label="Open ${esc(c.name)}">›</button><div class="contact-actions"><div class="contact-talk-options">${topicButtons}</div>${trust>=50?`<button class="btn ${ready?'btn-green':''}" data-contact-favor="${String(loc).replace(/"/g,'&quot;')}" data-contact-favor-role="${String(c.role).replace(/"/g,'&quot;')}" ${ready?'':'disabled'}>${ready?'★ CALL IN FAVOR':'FAVOR COOLDOWN'}</button>`:`<button class="btn" disabled>FAVOR UNLOCKS AT 50</button>`}</div><div class="contact-dialogue ${showConvo?'visible':''}"><div class="contact-dialogue-kicker">PRIVATE CHAT · ${showConvo?esc(convo.name).toUpperCase():esc(c.name).toUpperCase()}</div>${showConvo?`<div class="contact-bubble player">${esc(convo.player)}</div><div class="contact-bubble reply"><b>${esc(c.name)}:</b> ${esc(convo.reply)}</div><div class="contact-dialogue-foot">Trust ${trustBeforeSafe(convo.beforeTrust)}% → ${trust}% · Come back tomorrow for another conversation.</div>`:''}</div><div class="contact-milestones"><div class="contact-milestone ${milestones[0]?'on':''}">25 · FAMILIAR</div><div class="contact-milestone ${milestones[1]?'on':''}">50 · TRUSTED</div><div class="contact-milestone ${milestones[2]?'on':''}">75 · CLOSE</div><div class="contact-milestone ${milestones[3]?'on':''}">100 · FAMILY</div></div><div>${ready?'★ FAVOR READY':favorText}</div></div>`;}).join('');
  const owned=state.territories[loc];
  const territoryCard=owned?`<div class="card" style="border-color:var(--green);"><div style="font-size:.85rem;font-weight:bold;color:var(--green);margin-bottom:4px;">YOUR TERRITORY</div><div style="font-size:.78rem;color:var(--muted);">Held ${territoryHeldDays(loc)} day${territoryHeldDays(loc)===1?'':'s'}. Upkeep $${TERRITORY_UPKEEP} every 5 days. Risk cut: ${Math.round((1-territoryRiskCut(loc))*100)}%.</div><div style="font-size:.74rem;margin-top:7px;color:var(--text);">DEFENSE ${territoryDefenseLevel(loc)}/3 · Higher defense lowers dispute risk.</div>${territoryDefenseLevel(loc)<3?`<button class="btn btn-wide btn-green" onclick="reinforceTerritory(${JSON.stringify(loc).replace(/"/g,'&quot;')})">REINFORCE — $${(750+territoryDefenseLevel(loc)*750).toLocaleString()}</button>`:`<div style="font-size:.72rem;color:var(--green);margin-top:7px;">FULLY REINFORCED</div>`}</div>`:`<div class="card"><div style="font-size:.85rem;color:var(--muted);margin-bottom:10px;">Claim this town as yours — lowers police & gang risk here the longer you hold it, but costs upkeep every 5 days.</div><button class="btn btn-wide btn-green" onclick="claimTerritory(${JSON.stringify(loc).replace(/"/g,'&quot;')})">CLAIM TERRITORY — $${TERRITORY_COST.toLocaleString()}</button></div>`;
  const snitchWarning=(state.dealsSinceTalk[loc]||0)>8?`<div style="font-size:.74rem;color:var(--danger);margin-bottom:10px;">⚠ It's been ${(state.dealsSinceTalk[loc]||0)} deals since you checked in here — someone might talk.</div>`:'';
  return `<div class="landing contacts-reference">${renderPersistentInboxView()}<div class="contacts-ref-head"><div><div class="contacts-ref-title">CONTACTS</div><div class="contacts-ref-sub">Your network. Different skills. Different prices.</div></div><select class="contacts-filter"><option>All</option><option>Connector</option><option>Market</option><option>Muscle</option></select></div>${state.mission&&state.mission.loc===loc?`<div class="card mission-card"><div style="font-weight:bold;font-size:.82rem;">${state.mission.contact.toUpperCase()} HAS A JOB</div><p style="font-size:.7rem;color:var(--muted);margin:5px 0 9px;">Finish it for $${state.mission.reward.toLocaleString()}. Expires after day ${state.mission.expires}.</p><div class="cardbtns"><button class="btn btn-green" onclick="acceptMission()">TAKE IT</button><button class="btn" onclick="declineMission()">PASS</button></div></div>`:''}${cards}<div class="section-label">TERRITORY // ${String(loc).toUpperCase()}</div>${territoryCard}${snitchWarning}</div>`;
}

function renderEvent(ev) {
  if (ev.type === "world") {
    return `
      <div class="event-box">
        <h2>${ev.title}</h2>
        <p>${ev.text}</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveWorld('a')">${ev.a}</button>
          <button class="btn" onclick="resolveWorld('b')">${ev.b}</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "police") {
    return `
      <div class="event-box">
        <h2>⚠ POLICE CHECKPOINT</h2>
        <p>An officer's waving cars down up ahead. Heat level: ${Math.round(state.heat)}%.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolvePolice('run')">TRY TO RUN</button>
          <button class="btn" onclick="resolvePolice('bribe')">SLIP A BRIBE</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "gang") {
    return `
      <div class="event-box">
        <h2>⚠ AMBUSH</h2>
        <p>A crew steps out of the shadows. They want $${ev.demand.toLocaleString()} or trouble.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveGang('pay')">PAY UP</button>
          <button class="btn" onclick="resolveGang('run')">RUN</button>
          <button class="btn" onclick="resolveGang('fight')">FIGHT (${currentWeapon().name})</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "street") {
    return `
      <div class="event-box">
        <h2>${ev.title}</h2>
        <p>${ev.text}</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveStreet('a')">${ev.a}</button>
          <button class="btn" onclick="resolveStreet('b')">${ev.b}</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "hospital") {
    return `
      <div class="event-box">
        <h2>⚕ YOU'RE DOWN</h2>
        <p>${ev.cause || "The street caught up with you."}. Your health hit 0. You need to recover before getting back out there.</p>
        <div class="event-actions">
          <button class="btn btn-green" onclick="resolveHospital('hospital')">HOSPITAL — $250</button>
          <button class="btn" onclick="resolveHospital('laylow')">LAY LOW — FREE</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "rival") {
    const fee = Math.min(state.cash, 150 + Math.round((ev.pressure || 0) * 2));
    return `
      <div class="event-box">
        <h2>⚠ RIVAL PRESSURE</h2>
        <p><b>${ev.rivalName}</b> is pushing back on your business in ${state.location}. Pressure is at ${Math.round(ev.pressure || 0)}%.</p>
        <p style="color:var(--muted);font-size:.82rem;">${ev.style}. Choose how you want to handle the pressure.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveRival('negotiate')">NEGOTIATE — $${fee.toLocaleString()}</button>
          <button class="btn" onclick="resolveRival('laylow')">LAY LOW — 10 ENERGY</button>
          <button class="btn btn-green" onclick="resolveRival('compete')">COMPETE</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "territory") {
    const reinforceCost = 500 + (ev.defense || 0) * 500;
    return `
      <div class="event-box">
        <h2>⚠ TERRITORY DISPUTE</h2>
        <p><b>${ev.rivalName}</b> is testing your control of <b>${ev.loc}</b>. Rival pressure is ${Math.round(ev.pressure || 0)}%.</p>
        <p style="color:var(--muted);font-size:.82rem;">Defense level: ${ev.defense || 0}/3. Handle it without letting the dispute take over the neighborhood.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveTerritory('negotiate')">NEGOTIATE</button>
          <button class="btn" onclick="resolveTerritory('reinforce')">REINFORCE — $${reinforceCost.toLocaleString()}</button>
          <button class="btn btn-green" onclick="resolveTerritory('hold')">HOLD THE TERRITORY</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "snitch") {
    return `
      <div class="event-box">
        <h2>⚠ WORD GOT OUT</h2>
        <p>${ev.name} got tired of you never checking in. Word is they tipped the cops — you can pay to bury it or take what's coming.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveSnitch('payoff')">PAY OFF — $${ev.demand.toLocaleString()}</button>
          <button class="btn" onclick="resolveSnitch('takehit')">TAKE THE HIT</button>
        </div>
      </div>
    `;
  }
  return "";
}

document.addEventListener("click", (e) => {
  const key = e.target.closest(".key[data-nav]");
  if (key) {
    e.preventDefault();
    e.stopPropagation();
    setView(key.dataset.nav);
    return;
  }
  const regionBtn = e.target.closest("[data-map-region]");
  if (regionBtn) {
    e.preventDefault();
    e.stopPropagation();
    if (regionBtn.dataset.mapRegion === "regional") openRegionalMap();
    else if (regionBtn.dataset.mapRegion === "marina") openMarinaMap();
    else openAtlanticMap();
  }
});

document.addEventListener("change", (e) => {
  const filter = e.target.closest(".contacts-filter");
  if (!filter) return;
  document.querySelectorAll("[data-contact-card]").forEach(card => {
    card.style.display = (!filter.value || filter.value === "All" || card.getAttribute("data-contact-role-card") === filter.value.toLowerCase()) ? "grid" : "none";
  });
});

// Contact cards are interactive; the reference design keeps actions tucked behind the chevron.
document.addEventListener("click", (e) => {
  const openBtn = e.target.closest("[data-contact-open]");
  if (openBtn) {
    const card = openBtn.closest("[data-contact-card]");
    if (card) card.classList.toggle("expanded");
    return;
  }

  // Contact buttons are rendered dynamically.

  const talkBtn = e.target.closest("[data-contact-talk]");
  if (talkBtn && !talkBtn.disabled) {
    const loc = talkBtn.getAttribute("data-contact-talk");
    const role = talkBtn.getAttribute("data-contact-role");
    if (typeof talkTo === "function") talkTo(loc, role, talkBtn.getAttribute("data-contact-topic") || "word");
    return;
  }

  const favorBtn = e.target.closest("[data-contact-favor]");
  if (favorBtn && !favorBtn.disabled) {
    const loc = favorBtn.getAttribute("data-contact-favor");
    const role = favorBtn.getAttribute("data-contact-favor-role");
    if (typeof callInFavor === "function") callInFavor(loc, role);
  }
});

render();
setTimeout(() => { if (!splashDone) skipSplash(); }, 3600);
setInterval(() => { if (appStarted) render(); }, 30000);
</script>
