<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STREETLINE</title>
<style>
  :root {
    --bg: #0a0d13;
    --card: #131722;
    --card-border: rgba(255,255,255,0.08);
    --text: #e7e9ee;
    --muted: #7b8394;
    --muted-2: #545b6b;
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.15);
    --debt: #ff6b7d;
    --danger: #ff5566;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }
  body {
    font-family: 'Courier New', ui-monospace, Menlo, monospace;
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  .screen {
    flex: 1 1 auto;
    background: var(--bg);
    color: var(--text);
    padding: 0 16px 10px;
    overflow-y: auto;
    position: relative;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    color: var(--muted);
    padding: 10px 0 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }
  .statusbar .appname { letter-spacing: 2px; color: var(--muted); }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .battery {
    width: 20px; height: 10px;
    border: 1px solid var(--muted);
    border-radius: 2px;
    position: relative;
    display: inline-block;
  }
  .battery::after {
    content: "";
    position: absolute; top: -3px; right: -3px;
    width: 2px; height: 4px;
    background: var(--muted);
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    position: absolute; top: 1px; bottom: 1px; left: 1px;
    width: 60%;
    background: var(--muted);
    border-radius: 1px;
  }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 9px; }
  .bars span { width: 2px; background: var(--muted); display: block; }
  .bars span:nth-child(1) { height: 3px; }
  .bars span:nth-child(2) { height: 5px; }
  .bars span:nth-child(3) { height: 7px; }
  .bars span:nth-child(4) { height: 9px; }
  .mutebtn {
    background: none; border: none; color: var(--muted);
    font-size: 0.85rem; padding: 0; cursor: pointer; line-height: 1;
  }
  .statline {
    display: flex; justify-content: space-between;
    font-size: 0.8rem; padding: 5px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .statline:last-child { border-bottom: none; }
  .statline span:first-child { color: var(--muted); }

  .playerbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0 10px;
  }
  .playerbar-name { font-size: 0.86rem; font-weight: bold; }
  .avgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .avbtn {
    background: var(--card); border: 2px solid var(--card-border); border-radius: 12px;
    padding: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .avbtn-sel { border-color: var(--green); box-shadow: 0 0 0 2px rgba(34,197,94,0.25); }
  .perkcard {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 2px solid var(--card-border); border-radius: 10px; padding: 11px 13px;
    margin-bottom: 8px; cursor: pointer; font-family: inherit;
  }
  .perkcard-sel { border-color: var(--green); }
  .perkcard-label { font-weight: bold; font-size: 0.86rem; color: var(--text); margin-bottom: 3px; }
  .perkcard-desc { font-size: 0.74rem; color: var(--muted); }
  .hdr {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 10px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .statrow {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 12px;
    font-size: 0.88rem;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 12px;
  }
  .statrow .label { color: var(--muted); font-size: 0.72rem; display: block; }
  .statrow .debt-val { color: var(--debt); }
  .locflavor {
    font-size: 0.76rem;
    color: var(--muted);
    font-style: italic;
    margin: -2px 0 10px;
  }
  .section-label {
    font-size: 0.76rem;
    color: var(--muted);
    margin: 12px 0 8px;
    letter-spacing: 0.5px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .cardrow-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .cardrow-top .name { font-weight: bold; font-size: 0.95rem; }
  .cardrow-top .price { font-weight: bold; font-size: 0.95rem; }
  .cardrow-sub {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted-2);
    margin-bottom: 10px;
  }
  .tag-fair { color: var(--muted); }
  .tag-low { color: var(--green); }
  .tag-high { color: var(--debt); }
  .cardbtns { display: flex; gap: 8px; }
  .btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 11px 8px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    flex: 1;
  }
  .btn:active { background: rgba(255,255,255,0.06); }
  .btn[disabled] { opacity: 0.3; }
  .btn-wide { width: 100%; margin-top: 8px; }
  .btn-green {
    background: var(--green);
    border-color: var(--green);
    color: #06210f;
    font-weight: bold;
  }
  .muted { color: var(--muted); }

  .qtypanel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 14px 0;
  }
  .qtypanel .section-label { margin: 0 0 10px; }
  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .stepper button {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1.1rem;
    flex: 0 0 auto;
  }
  .stepper button:active { background: rgba(255,255,255,0.08); }
  .stepper .qtyval {
    flex: 1;
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    min-width: 0;
  }
  .quickset { display: flex; gap: 8px; }
  .quickset .btn { padding: 9px 4px; font-size: 0.76rem; }
  .qtymeta { font-size: 0.72rem; color: var(--muted); margin-top: 10px; }

  .amtfield {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .amtfield input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    padding: 10px;
    min-width: 0;
    text-align: center;
  }
  .amtfield .btn { flex: 1; }
  .amtsplit { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }

  .locgrid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .maploc { text-align: left; padding: 14px 16px; flex: none; }
  .maploc-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .maploc-name { font-weight: bold; font-size: 0.92rem; }
  .maploc-here { color: var(--green); font-size: 0.72rem; font-weight: bold; }
  .maploc-go { color: var(--muted); font-size: 0.72rem; }
  .maploc-flavor { font-size: 0.76rem; color: var(--muted); font-style: italic; margin-bottom: 6px; }
  .maploc-tags { font-size: 0.7rem; color: var(--muted-2); }

  .contactname { font-size: 0.92rem; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 4px; }
  .trustpct { color: var(--muted); font-size: 0.74rem; font-weight: normal; }
  .contactline { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-bottom: 10px; }
  .trustbar { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .trustfill { height: 100%; background: var(--green); }
  .contactmeta { font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 10px; }

  .log {
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--card-border);
    margin-top: 12px;
    padding-top: 10px;
  }
  .log div { margin-bottom: 4px; }
  .event-box {
    background: var(--card);
    border: 1px solid var(--danger);
    padding: 16px;
    border-radius: 12px;
  }
  .event-box h2 { font-size: 1rem; margin: 0 0 8px; color: var(--danger); }
  .event-box p { font-size: 0.85rem; margin: 0 0 14px; color: var(--text); }
  .event-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .event-actions .btn { border-color: var(--danger); color: var(--danger); min-width: 90px; }
  .keys {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: #000;
    border-top: 1px solid var(--card-border);
  }
  .keys.row2 { grid-template-columns: repeat(3, 1fr); margin-top: 0; padding-top: 0; }
  .keysgrid { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: #000; border-top: 1px solid var(--card-border); }
  .keysgrid .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: bold;
    padding: 12px 0;
    letter-spacing: 0.5px;
  }
  .key.active { background: var(--green); border-color: var(--green); color: #06210f; }
  .key:active { transform: translateY(1px); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }

  .splash {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    cursor: pointer;
  }
  .splash-boot {
    font-size: 0.76rem;
    color: var(--muted);
    margin-bottom: 6px;
    opacity: 0;
    letter-spacing: 1px;
    animation: splash-fadein 0.4s ease forwards;
  }
  .splash-title {
    font-size: 2.1rem;
    font-weight: bold;
    letter-spacing: 4px;
    margin-top: 18px;
    opacity: 0;
    transform: scale(0.8);
    text-shadow: 0 0 24px rgba(34,197,94,0.55);
    animation: splash-titlein 0.6s ease forwards;
    animation-delay: 1.3s;
  }
  .splash-sub {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 10px;
    opacity: 0;
    animation: splash-fadein 0.5s ease forwards;
    animation-delay: 2.0s;
  }
  .splash-tap {
    font-size: 0.72rem;
    color: var(--muted-2);
    margin-top: 40px;
    opacity: 0;
    animation: splash-pulse 1.6s ease-in-out infinite;
    animation-delay: 2.6s;
    animation-fill-mode: backwards;
  }
  @keyframes splash-fadein { to { opacity: 1; } }
  @keyframes splash-titlein { to { opacity: 1; transform: scale(1); } }
  @keyframes splash-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.75; } }
  .landing { display: flex; flex-direction: column; min-height: 100%; }
  .landcredit { text-align: center; font-size: 0.7rem; color: var(--muted-2); letter-spacing: 1px; margin-top: 12px; }
  .landtitle { font-size: 1.7rem; letter-spacing: 3px; margin: 16px 0 2px; text-align: center; font-weight: bold; }
  .landsub {
    text-align: center; font-size: 0.8rem; color: var(--muted); margin-bottom: 18px;
    border-bottom: 1px solid var(--card-border); padding-bottom: 16px;
  }
  .landp { font-size: 0.88rem; line-height: 1.55; margin: 0 0 4px; color: var(--text); }
  .landtable { width: 100%; border-collapse: collapse; font-size: 0.84rem; margin-bottom: 6px; }
  .landtable td { padding: 7px 8px 7px 0; vertical-align: top; }
  .landtable td:first-child { white-space: nowrap; color: var(--green); font-weight: bold; width: 1%; }
  .landtable td:last-child { color: var(--muted); }
  .landlist { margin: 0 0 10px; padding-left: 18px; font-size: 0.84rem; line-height: 1.65; color: var(--muted); }
  .landlist li { margin-bottom: 3px; }
  .landstart { margin-top: auto; padding: 16px 0; font-size: 0.95rem; letter-spacing: 1px; }
</style>
</head>

// Simple inline-SVG bust avatars — no external images allowed in published pages,
// so each avatar is a distinct silhouette built from paths.
function avatarSVG(avatarId, size) {
  const s = size || 48;
  const style = AVATAR_STYLES.find(a => a.id === avatarId) || AVATAR_STYLES[0];
  const shoulders = style.wide
    ? `<path d="M4 62 C4 42 16 36 32 36 C48 36 60 42 60 62 Z" fill="#3a4150"/>`
    : `<path d="M8 62 C8 46 18 40 32 40 C46 40 56 46 56 62 Z" fill="#3a4150"/>`;
  return `
    <svg viewBox="0 0 64 64" width="${s}" height="${s}" style="flex:0 0 auto;">
      <circle cx="32" cy="32" r="31" fill="#0e131c" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <clipPath id="avclip-${style.id}"><circle cx="32" cy="32" r="29"/></clipPath>
      <g clip-path="url(#avclip-${style.id})">
        ${shoulders}
        <circle cx="32" cy="24" r="14" fill="#3a4150"/>
        ${style.hair}
      </g>
    </svg>
  `;
}

const DRUGS = [
  { key: "grass",  name: "Bud",  base: 40,  vol: 0.5 },
  { key: "pills",  name: "Bars", base: 90,  vol: 0.6 },
  { key: "powder", name: "Blow", base: 260, vol: 0.7 },
  { key: "crank",  name: "Ice",  base: 180, vol: 0.8 },
  { key: "tar",    name: "Dope", base: 420, vol: 0.9 },
];
// The 4 unlockable towns use their own local slang for the same product.
const LOCATION_SLANG = {
  "Pleasantville": { grass: "Loud",   pills: "Footballs", powder: "Snow",   crank: "Crank", tar: "Boy" },
  "Absecon":       { grass: "Gas",    pills: "Zannies",   powder: "Powder", crank: "Tina",  tar: "Smack" },
  "Mays Landing":  { grass: "Reggie", pills: "Beans",     powder: "Flour",  crank: "Crystal", tar: "Brown" },
  "Margate":       { grass: "Kush",   pills: "Xans",      powder: "Coke",   crank: "Glass", tar: "China White" },
};
function localName(key) {
  const overrides = LOCATION_SLANG[state.location];
  return (overrides && overrides[key]) || nameOf(key);
}

// ---- Save / mute persistence ----
const SAVE_KEY = "streetline_save_v2";
const MUTE_KEY = "streetline_muted_v1";
let muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) {}

function saveGame() {
  if (!appStarted || !state || state.over) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.over) return null;
    return s;
  } catch (e) { return null; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (e) {}
  render();
}

// ---- New Game+ unlock progress (persists across runs) ----
const UNLOCK_KEY = "streetline_unlocks_v1";
function getUnlockedCount() {
  try { return Math.max(0, Math.min(EXTRA_LOCATIONS.length, parseInt(localStorage.getItem(UNLOCK_KEY) || "0", 10) || 0)); }
  catch (e) { return 0; }
}
function setUnlockedCount(n) {
  try { localStorage.setItem(UNLOCK_KEY, String(n)); } catch (e) {}
}
function computeLocations() {
  const n = getUnlockedCount();
  return BASE_LOCATIONS.concat(EXTRA_LOCATIONS.slice(0, n));
}
function unlockNextTown() {
  const n = getUnlockedCount();
  if (n >= EXTRA_LOCATIONS.length) return null;
  setUnlockedCount(n + 1);
  return EXTRA_LOCATIONS[n];
}

// ---- Sound engine (Web Audio, synthesized — no external assets) ----
let audioCtx = null;
function ac() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  return audioCtx;
}
function beep(freq, dur, type, vol, delay) {
  if (muted) return;
  const ctx = ac();
  if (!ctx) return;
  try {
    const t0 = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol || 0.18, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function sndBuy()    { beep(720, 0.07, "square", 0.14); }
function sndSell()   { beep(660, 0.08, "sine", 0.16); beep(990, 0.1, "sine", 0.16, 0.07); }
function sndFail()   { beep(160, 0.18, "sawtooth", 0.12); }
function sndClick()  { beep(500, 0.05, "sine", 0.1); }
function sndTravel() { beep(420, 0.08, "sine", 0.1); beep(520, 0.1, "sine", 0.1, 0.06); }
function sndPolice() { beep(720, 0.1, "square", 0.14); beep(500, 0.1, "square", 0.14, 0.1); beep(720, 0.1, "square", 0.14, 0.2); }
function sndGang()   { beep(140, 0.3, "sawtooth", 0.14); }
function sndGood()   { beep(660, 0.09, "sine", 0.15); beep(880, 0.09, "sine", 0.15, 0.09); beep(1100, 0.14, "sine", 0.16, 0.18); }
function sndBad()    { beep(300, 0.12, "sawtooth", 0.14); beep(220, 0.18, "sawtooth", 0.14, 0.1); }

let state = null;
let appStarted = false;
let charSelectOpen = false;
let splashDone = false;
function skipSplash() {
  if (splashDone) return;
  splashDone = true;
  render();
}
let creation = { name: "", avatarId: AVATAR_STYLES[0].id, perkId: PERKS[0].id };

function openCharacterSelect() {
  appStarted = false;
  charSelectOpen = true;
  render();
}
function backToLanding() {
  charSelectOpen = false;
  render();
}
function selectAvatar(id) { creation.avatarId = id; render(); }
function selectPerk(id) { creation.perkId = id; render(); }
function startWithCreation() {
  const nameEl = document.getElementById("creationName");
  if (nameEl) creation.name = nameEl.value;
  charSelectOpen = false;
  newGame(creation.perkId, creation.name, creation.avatarId);
}

function newGame(perkId, customName, avatarId) {
  appStarted = true;
  clearSave();
  LOCATIONS = computeLocations();
  const perk = PERKS.find(p => p.id === perkId) || PERKS[0];
  const avatarStyle = AVATAR_STYLES.find(a => a.id === avatarId) || AVATAR_STYLES[0];
  const playerName = (customName && customName.trim()) ? customName.trim().slice(0, 20) : "Hustler";
  state = {
    day: 1,
    maxDays: 30,
    cash: 800,
    bank: 0,
    debt: 4000,
    capacity: 60,
    capacityLevel: 0,
    wantedStreak: 0,
    weaponLevel: 0,
    heat: 0,
    location: LOCATIONS[0],
    inventory: {},
    prices: {},
    contactTrust: {},
    talkedDay: {},
    log: [],
    view: "deal",
    over: false,
    pendingEvent: null,
    qty: 1,       // shared buy/sell quantity
    bankAmt: 0,   // shared deposit/withdraw amount
    debtAmt: 0,   // debt paydown amount
    playerName: playerName,
    avatarId: avatarStyle.id,
    perkId: perk.id,
    perkLabel: perk.label,
    stats: {
      totalSpent: 0, totalRevenue: 0, totalInterestPaid: 0,
      policeCaught: 0, policeBribed: 0, policeEscaped: 0,
      gangPaid: 0, gangEscaped: 0, gangCaught: 0,
      fightsWon: 0, fightsLost: 0,
    },
    netWorthHistory: [],
  };
  DRUGS.forEach(d => state.inventory[d.key] = 0);
  if (perk.id === "debt") {
    state.debt = Math.max(0, state.debt - 1000);
  } else if (perk.id === "connector" || perk.id === "market" || perk.id === "muscle") {
    LOCATIONS.forEach(loc => gainContactTrust(loc, perk.id, 15));
  }
  LOCATIONS.forEach(loc => rollPrices(loc));
  addLog(`You arrive in Atlantic City with $800 and a $${state.debt.toLocaleString()} problem.`);
  addLog(`Playing as ${playerName} — ${perk.desc}`);
  state.netWorthHistory.push({ day: state.day, nw: netWorth() });
  render();
}

function continueGame() {
  const saved = loadSave();
  if (!saved) return;
  appStarted = true;
  LOCATIONS = computeLocations();
  state = saved;
  if (!state.stats) {
    state.stats = {
      totalSpent: 0, totalRevenue: 0, totalInterestPaid: 0,
      policeCaught: 0, policeBribed: 0, policeEscaped: 0,
      gangPaid: 0, gangEscaped: 0, gangCaught: 0,
      fightsWon: 0, fightsLost: 0,
    };
  }
  if (!state.netWorthHistory) state.netWorthHistory = [{ day: state.day, nw: netWorth() }];
  if (!state.avatarId) state.avatarId = AVATAR_STYLES[0].id;
  if (!state.perkId) state.perkId = PERKS[0].id;
  if (!state.playerName) state.playerName = "Hustler";
  if (state.capacityLevel === undefined) state.capacityLevel = 0;
  if (state.wantedStreak === undefined) state.wantedStreak = 0;
  if (state.weaponLevel === undefined) state.weaponLevel = 0;
  render();
}

function rollPrices(loc) {
  state.prices[loc] = {};
  const mod = LOCATION_MODS[loc] || { priceMult: 1, volMult: 1 };
  DRUGS.forEach(d => {
    const vol = d.vol * mod.volMult;
    const swing = 1 + (Math.random() * 2 - 1) * vol;
    let price = Math.max(4, Math.round(d.base * mod.priceMult * swing));
    if (Math.random() < 0.12) {
      const spike = Math.random() < 0.5 ? 2.4 : 0.35;
      price = Math.round(price * spike);
      if (!state._spikeNote) state._spikeNote = [];
      state._spikeNote.push(`${d.name} ${spike > 1 ? "spiked" : "crashed"} in ${loc}`);
    }
    state.prices[loc][d.key] = price;
  });
}

function addLog(msg) {
  state.log.unshift(msg);
  state.log = state.log.slice(0, 6);
}

function invUsed() {
  return Object.values(state.inventory).reduce((a,b) => a+b, 0);
}

function netWorth() {
  const stock = DRUGS.reduce((sum,d) => sum + d.base * state.inventory[d.key], 0);
  return state.cash + state.bank + Math.round(stock*0.4) - state.debt;
}

function nameOf(key) { return DRUGS.find(d => d.key === key).name; }

// ---- Contacts / trust ----
function contactKey(loc, role) { return loc + "::" + role; }
function contactOf(loc, role) { return (CONTACTS[loc] || []).find(c => c.role === role); }
function trustOf(loc, role) { return state.contactTrust[contactKey(loc, role)] || 0; }
function gainContactTrust(loc, role, amt) {
  const k = contactKey(loc, role);
  state.contactTrust[k] = Math.min(100, (state.contactTrust[k] || 0) + amt);
}
function bumpAllContacts(loc, amt) {
  (CONTACTS[loc] || []).forEach(c => gainContactTrust(loc, c.role, amt));
}
function tierIndex(trust) { return Math.min(4, Math.floor(trust / 25)); }
function tierWord(trust) { return TIER_WORDS[tierIndex(trust)]; }

function talkTo(loc, role) {
  const k = contactKey(loc, role);
  if (state.talkedDay[k] === state.day) {
    sndFail();
    addLog("Already caught up with them today.");
    render();
    return;
  }
  gainContactTrust(loc, role, 8);
  state.talkedDay[k] = state.day;
  const c = contactOf(loc, role);
  sndClick();
  addLog(`Caught up with ${c.name}.`);
  render();
}

function getBuyPrice(key) {
  const base = state.prices[state.location][key];
  const t = trustOf(state.location, "market") / 100;
  return Math.max(1, Math.round(base * (1 - 0.15 * t)));
}
function getSellPrice(key) {
  const base = state.prices[state.location][key];
  const t = trustOf(state.location, "market") / 100;
  return Math.max(1, Math.round(base * (1 + 0.10 * t)));
}
function priceLevel(key) {
  const base = state.prices[state.location][key];
  const mod = LOCATION_MODS[state.location] || { priceMult: 1 };
  const typical = DRUGS.find(d => d.key === key).base * mod.priceMult;
  const ratio = base / typical;
  if (ratio < 0.85) return { word: "LOW", cls: "tag-low" };
  if (ratio > 1.15) return { word: "HIGH", cls: "tag-high" };
  return { word: "FAIR", cls: "tag-fair" };
}

// ---- quantity / amount setters (inline, no modal) ----
function setQty(n) {
  n = Math.max(1, Math.floor(Number(n)) || 1);
  state.qty = n;
  render();
}
function stepQty(delta) { setQty(state.qty + delta); }

function setBankAmt(n) {
  n = Math.max(0, Math.floor(Number(n)) || 0);
  state.bankAmt = n;
  render();
}
function setDebtAmt(n) {
  n = Math.max(0, Math.floor(Number(n)) || 0);
  state.debtAmt = n;
  render();
}

function buy(key) {
  const qty = state.qty;
  const price = getBuyPrice(key);
  const cost = price * qty;
  if (qty <= 0) return;
  if (invUsed() + qty > state.capacity) { sndFail(); addLog("Not enough room in the stash."); render(); return; }
  if (cost > state.cash) { sndFail(); addLog("Not enough cash."); render(); return; }
  state.cash -= cost;
  state.inventory[key] += qty;
  const loc = state.location;
  const heatMult = (LOCATION_MODS[loc] || {}).heatMult ?? 1;
  const muscleCut = 1 - 0.3 * (trustOf(loc, "muscle") / 100);
  state.heat = Math.min(100, state.heat + qty * 0.4 * heatMult * muscleCut);
  bumpAllContacts(loc, 1);
  state.stats.totalSpent += cost;
  sndBuy();
  addLog(`Bought ${qty} ${localName(key)} for $${cost.toLocaleString()}.`);
  render();
}

function sell(key) {
  let qty = Math.min(state.qty, state.inventory[key]);
  if (qty <= 0) { sndFail(); addLog(`You don't have any ${nameOf(key)} to sell.`); render(); return; }
  const price = getSellPrice(key);
  const total = price * qty;
  state.inventory[key] -= qty;
  state.cash += total;
  bumpAllContacts(state.location, 1);
  state.stats.totalRevenue += total;
  sndSell();
  addLog(`Sold ${qty} ${localName(key)} for $${total.toLocaleString()}.`);
  render();
}

function bankDeposit() {
  const amt = Math.min(state.bankAmt, state.cash);
  if (amt <= 0) { sndFail(); addLog("Nothing to deposit."); render(); return; }
  state.cash -= amt;
  state.bank += amt;
  sndClick();
  addLog(`Stashed $${amt.toLocaleString()} in the bank.`);
  render();
}
function bankWithdraw() {
  const amt = Math.min(state.bankAmt, state.bank);
  if (amt <= 0) { sndFail(); addLog("Nothing to withdraw."); render(); return; }
  state.bank -= amt;
  state.cash += amt;
  sndClick();
  addLog(`Pulled $${amt.toLocaleString()} from the bank.`);
  render();
}
function payDebt() {
  const amt = Math.min(state.debtAmt, state.cash, state.debt);
  if (amt <= 0) { sndFail(); addLog("Nothing to pay."); render(); return; }
  state.cash -= amt;
  state.debt -= amt;
  sndClick();
  addLog(`Paid down $${amt.toLocaleString()} of debt.`);
  render();
}

function bagUpgradeCost() { return 400 + state.capacityLevel * 300; }
function upgradeBag() {
  const cost = bagUpgradeCost();
  if (state.cash < cost) { sndFail(); addLog("Not enough cash to upgrade the bag."); render(); return; }
  state.cash -= cost;
  state.capacityLevel++;
  state.capacity += 20;
  sndGood();
  addLog(`Upgraded the stash bag. Capacity now ${state.capacity}.`);
  render();
}

// ---- Weapons / protection (affects gang fight outcomes) ----
const WEAPONS = [
  { name: "Unarmed", cost: 0,    winBonus: 0,    takeMult: 1.0, lossMult: 1.0 },
  { name: "Knife",   cost: 600,  winBonus: 0.10, takeMult: 1.1, lossMult: 0.9 },
  { name: "Pistol",  cost: 1500, winBonus: 0.20, takeMult: 1.25, lossMult: 0.75 },
  { name: "Strap",   cost: 3000, winBonus: 0.30, takeMult: 1.5,  lossMult: 0.6 },
];
function currentWeapon() { return WEAPONS[state.weaponLevel] || WEAPONS[0]; }
function nextWeapon() { return WEAPONS[state.weaponLevel + 1] || null; }
function upgradeWeapon() {
  const next = nextWeapon();
  if (!next) { addLog("Already carrying the best protection there is."); render(); return; }
  if (state.cash < next.cost) { sndFail(); addLog("Not enough cash for that piece."); render(); return; }
  state.cash -= next.cost;
  state.weaponLevel++;
  sndGood();
  addLog(`Picked up a ${next.name}. Better odds if it comes to a fight.`);
  render();
}

function travel(loc) {
  if (loc === state.location) return;
  state.location = loc;
  advanceDay();
}

function advanceDay() {
  state.day++;
  delete state._spikeNote;
  LOCATIONS.forEach(l => rollPrices(l));
  sndTravel();
  state.netWorthHistory.push({ day: state.day, nw: netWorth() });

  if (state.day % 5 === 0) {
    const interest = Math.round(state.debt * 0.1);
    state.debt += interest;
    state.stats.totalInterestPaid += interest;
    addLog(`The loan shark's crew adds $${interest.toLocaleString()} interest. Debt: $${state.debt.toLocaleString()}.`);
  }

  if (state.day > state.maxDays) {
    state.over = true;
    const nw = netWorth();
    (nw >= 0 ? sndGood : sndBad)();
    state.justUnlocked = nw >= 0 ? unlockNextTown() : null;
    clearSave();
    render();
    return;
  }

  if (state.heat >= 90) {
    state.wantedStreak = (state.wantedStreak || 0) + 1;
  } else {
    state.wantedStreak = 0;
  }
  if (state.wantedStreak >= 3 && state.bank > 0) {
    const seized = Math.round(state.bank * 0.25);
    state.bank -= seized;
    state.heat = Math.max(0, state.heat - 40);
    state.wantedStreak = 0;
    sndBad();
    addLog(`You're too hot. Cops raided your bank account and took $${seized.toLocaleString()}.`);
  }

  const mod = LOCATION_MODS[state.location] || { policeMult: 1, gangMult: 1 };
  const connectorCut = 1 - 0.3 * (trustOf(state.location, "connector") / 100);
  const policeChance = 0.16 * mod.policeMult * connectorCut;
  const gangChance = 0.14 * mod.gangMult * connectorCut;
  const roll = Math.random();
  if (roll < policeChance) {
    state.pendingEvent = { type: "police" };
    sndPolice();
  } else if (roll < policeChance + gangChance) {
    state.pendingEvent = { type: "gang", demand: Math.round(150 + Math.random()*350 + state.cash*0.1) };
    sndGang();
  } else if (state._spikeNote && state._spikeNote.length) {
    addLog(state._spikeNote[0]);
  }
  render();
}

function resolvePolice(choice) {
  const heatFactor = state.heat / 100;
  if (choice === "run") {
    const caught = Math.random() < (0.25 + heatFactor*0.4);
    if (caught) {
      const lostPct = 0.4 + Math.random()*0.3;
      DRUGS.forEach(d => state.inventory[d.key] = Math.floor(state.inventory[d.key]*(1-lostPct)));
      const fine = Math.round(state.cash*0.3);
      state.cash -= fine;
      state.heat = Math.max(0, state.heat - 30);
      state.stats.policeCaught++;
      sndBad();
      addLog(`Cops caught you running. Product seized, fined $${fine.toLocaleString()}.`);
    } else {
      state.stats.policeEscaped++;
      sndGood();
      addLog("You slipped past the patrol.");
    }
  } else if (choice === "bribe") {
    const bribe = Math.min(state.cash, Math.round(200 + state.heat*8));
    state.cash -= bribe;
    state.heat = Math.max(0, state.heat - 50);
    state.stats.policeBribed++;
    sndClick();
    addLog(`Paid a $${bribe.toLocaleString()} "toll" to look the other way.`);
  }
  state.pendingEvent = null;
  render();
}

function resolveGang(choice) {
  const ev = state.pendingEvent;
  if (choice === "pay") {
    const amt = Math.min(state.cash, ev.demand);
    state.cash -= amt;
    state.stats.gangPaid++;
    sndClick();
    addLog(`Paid ${amt < ev.demand ? "everything you had — " : ""}$${amt.toLocaleString()} to walk away.`);
  } else if (choice === "run") {
    const escaped = Math.random() < 0.55;
    if (escaped) {
      state.stats.gangEscaped++;
      sndGood();
      addLog("You bolted down an alley and lost them.");
    } else {
      const lostPct = 0.2 + Math.random()*0.3;
      DRUGS.forEach(d => state.inventory[d.key] = Math.floor(state.inventory[d.key]*(1-lostPct)));
      const cashLoss = Math.round(state.cash * 0.25);
      state.cash -= cashLoss;
      state.stats.gangCaught++;
      sndBad();
      addLog(`They caught you. Roughed up, took $${cashLoss.toLocaleString()} and some product.`);
    }
  } else if (choice === "fight") {
    const weapon = currentWeapon();
    const win = Math.random() < (0.45 + weapon.winBonus);
    if (win) {
      const take = Math.round((80 + Math.random()*200) * weapon.takeMult);
      state.cash += take;
      state.stats.fightsWon++;
      sndGood();
      addLog(`Won the scrap${weapon.name !== "Unarmed" ? ` with the ${weapon.name}` : ""}, took $${take.toLocaleString()} off them.`);
    } else {
      const cashLoss = Math.round(state.cash * 0.35 * weapon.lossMult);
      state.cash -= cashLoss;
      state.stats.fightsLost++;
      sndBad();
      addLog(`Lost the fight. Down $${cashLoss.toLocaleString()} and bruised.`);
    }
  }
  state.pendingEvent = null;
  render();
}

function setView(v) { state.view = v; render(); }

function esc(s) { return String(s); }

function sparklineSVG(history) {
  if (!history || history.length < 2) return "";
  const w = 300, h = 60, pad = 4;
  const values = history.map(pt => pt.nw);
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0);
  const range = (max - min) || 1;
  const stepX = (w - 2 * pad) / (history.length - 1);
  const pts = history.map((pt, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((pt.nw - min) / range) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const last = values[values.length - 1];
  const color = last >= 0 ? "#22c55e" : "#ff6b7d";
  const zeroY = h - pad - ((0 - min) / range) * (h - 2 * pad);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:60px;display:block;">
      <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>
  `;
}

function computeBadges() {
  const s = state.stats;
  const nw = netWorth();
  const maxTrust = Math.max(0, ...Object.values(state.contactTrust || {}));
  const badges = [];
  if (nw >= 0) badges.push({ label: "Debt Free", desc: "Ended the run in the black." });
  if (s.policeCaught === 0 && s.gangCaught === 0) badges.push({ label: "Untouchable", desc: "Never once got caught." });
  if (s.totalSpent >= 20000) badges.push({ label: "Big Spender", desc: "Moved $20,000+ in product." });
  if (s.fightsWon >= 3 && s.fightsLost === 0) badges.push({ label: "Sharp Shooter", desc: "Won every fight you had." });
  if (maxTrust >= 100) badges.push({ label: "Maxed Out", desc: "Earned a contact's full trust." });
  if (state.justUnlocked) badges.push({ label: "Trailblazer", desc: `Opened up ${state.justUnlocked}.` });
  if (state.capacityLevel >= 2) badges.push({ label: "Bigger Bag", desc: "Upgraded the stash bag twice or more." });
  return badges;
}

function statsBreakdown() {
  const s = state.stats;
  const profit = s.totalRevenue - s.totalSpent;
  const badges = computeBadges();
  return `
    ${badges.length ? `
    <div class="section-label">BADGES EARNED</div>
    <div class="card">
      ${badges.map(b => `
        <div class="statline" style="align-items:flex-start;">
          <span style="color:var(--green);font-weight:bold;">🏅 ${b.label}</span>
          <span style="text-align:right;">${b.desc}</span>
        </div>
      `).join("")}
    </div>` : ""}
    <div class="section-label">NET WORTH OVER TIME</div>
    <div class="card">${sparklineSVG(state.netWorthHistory)}</div>
    <div class="section-label">RUN BREAKDOWN</div>
    <div class="card">
      <div class="statline"><span>Trading revenue</span><span>$${s.totalRevenue.toLocaleString()}</span></div>
      <div class="statline"><span>Trading spend</span><span>$${s.totalSpent.toLocaleString()}</span></div>
      <div class="statline"><span>Trading profit</span><span class="${profit>=0?'tag-low':'tag-high'}">$${profit.toLocaleString()}</span></div>
      <div class="statline"><span>Interest paid</span><span class="debt-val">$${s.totalInterestPaid.toLocaleString()}</span></div>
      <div class="statline"><span>Police: caught / bribed / dodged</span><span>${s.policeCaught} / ${s.policeBribed} / ${s.policeEscaped}</span></div>
      <div class="statline"><span>Gangs: paid / escaped / caught</span><span>${s.gangPaid} / ${s.gangEscaped} / ${s.gangCaught}</span></div>
      <div class="statline"><span>Fights: won / lost</span><span>${s.fightsWon} / ${s.fightsLost}</span></div>
    </div>
  `;
}

function riskLabel(loc) {
  const mod = LOCATION_MODS[loc];
  const avg = (mod.policeMult + mod.gangMult) / 2;
  if (avg <= 0.75) return "LOW";
  if (avg <= 1.1) return "MED";
  return "HIGH";
}
function mktLabel(loc) {
  const mod = LOCATION_MODS[loc];
  if (mod.priceMult <= 0.85) return "CHEAP";
  if (mod.priceMult <= 1.1) return "FAIR";
  return "RICH";
}

function statusBar() {
  const now = new Date();
  const h24 = now.getHours();
  const h = h24 % 12 || 12;
  const m = String(now.getMinutes()).padStart(2, "0");
  const isNight = h24 >= 19 || h24 < 6;
  return `
    <div class="statusbar">
      <span>${isNight ? "🌙" : "☀️"} ${h}:${m}</span>
      <span class="appname">STREETLINE</span>
      <span class="right">
        <button class="mutebtn" onclick="toggleMute()">${muted ? "🔇" : "🔊"}</button>
        <span class="bars"><span></span><span></span><span></span><span></span></span>
        <span class="battery"><span class="battery-fill"></span></span>
      </span>
    </div>
  `;
}

function render() {
  const screen = document.getElementById("screen");
  const keysEl = document.querySelector(".keysgrid");

  if (!splashDone) {
    keysEl.style.visibility = "hidden";
    screen.innerHTML = renderSplash();
    return;
  }

  if (!appStarted) {
    keysEl.style.visibility = "hidden";
    screen.innerHTML = statusBar() + (charSelectOpen ? renderCreateHustler() : renderLanding());
    return;
  }
  keysEl.style.visibility = "visible";

  if (!state) { screen.innerHTML = ""; return; }

  saveGame();

  document.querySelectorAll(".key").forEach(k => {
    k.classList.toggle("active", k.dataset.nav === state.view && !state.over && !state.pendingEvent);
  });

  if (state.pendingEvent) {
    screen.innerHTML = statusBar() + renderEvent(state.pendingEvent);
    return;
  }

  if (state.over) {
    const nw = netWorth();
    screen.innerHTML = statusBar() + `
      <div class="hdr"><span>STREETLINE</span><span>RUN COMPLETE</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        ${avatarSVG(state.avatarId, 44)}
        <h1 style="font-size:1.15rem;margin:0;">${state.playerName || "You"} — ${nw >= 0 ? "GOT OUT CLEAN" : "STILL IN THE HOLE"}</h1>
      </div>
      <div class="statrow">
        <div><span class="label">CASH</span>$${state.cash.toLocaleString()}</div>
        <div><span class="label">BANK</span>$${state.bank.toLocaleString()}</div>
        <div><span class="label">DEBT</span><span class="debt-val">$${state.debt.toLocaleString()}</span></div>
        <div><span class="label">NET</span>$${nw.toLocaleString()}</div>
      </div>
      <p style="font-size:0.85rem;color:var(--muted);">30 days on the street. ${nw >= 0 ? "You cleared your debt and then some." : "You're still under water — the crew won't forget."}</p>
      ${state.justUnlocked ? `
      <div class="card" style="border-color:var(--green);">
        <div style="font-size:0.9rem;font-weight:bold;color:var(--green);margin-bottom:4px;">🔓 NEW TERRITORY UNLOCKED</div>
        <div style="font-size:0.85rem;">${state.justUnlocked} is open for your next run.</div>
      </div>` : (nw >= 0 && getUnlockedCount() >= EXTRA_LOCATIONS.length ? `
      <div class="card">
        <div style="font-size:0.85rem;color:var(--muted);">All territory outside AC is already open — nothing left to unlock.</div>
      </div>` : (nw < 0 ? `
      <div class="card">
        <div style="font-size:0.85rem;color:var(--muted);">Win clean next time to unlock new territory outside AC.</div>
      </div>` : ""))}
      ${statsBreakdown()}
      <button class="btn btn-wide btn-green" onclick="openCharacterSelect()">RUN IT BACK</button>
    `;
    return;
  }

  let body = "";
  if (state.view === "deal") body = renderDeal();
  else if (state.view === "map") body = renderMap();
  else if (state.view === "stash") body = renderStash();
  else if (state.view === "contacts") body = renderContacts();

  screen.innerHTML = statusBar() + renderTop() + body + `
    <div class="section-label">LOG</div>
    <div class="log">${state.log.map(l => `<div>&gt; ${esc(l)}</div>`).join("")}</div>
  `;
}

function renderSplash() {
  const bootLines = [
    "INITIALIZING PAGER...",
    "LOADING STREET DATA...",
    "CONNECTING TO NETWORK...",
  ];
  return `
    <div class="splash" onclick="skipSplash()">
      <div class="splash-boot" style="animation-delay:0.1s;">${bootLines[0]}</div>
      <div class="splash-boot" style="animation-delay:0.5s;">${bootLines[1]}</div>
      <div class="splash-boot" style="animation-delay:0.9s;">${bootLines[2]}</div>
      <div class="splash-title">STREETLINE</div>
      <div class="splash-sub">a hustler's pager, 30 days on the clock</div>
      <div class="splash-tap">tap to continue</div>
    </div>
  `;
}

function renderCreateHustler() {
  const avatarButtons = AVATAR_STYLES.map(a => `
    <button class="avbtn ${creation.avatarId === a.id ? 'avbtn-sel' : ''}" onclick="selectAvatar('${a.id}')">
      ${avatarSVG(a.id, 44)}
    </button>
  `).join("");
  const perkCards = PERKS.map(p => `
    <button class="perkcard ${creation.perkId === p.id ? 'perkcard-sel' : ''}" onclick="selectPerk('${p.id}')">
      <div class="perkcard-label">${p.label}</div>
      <div class="perkcard-desc">${p.desc}</div>
    </button>
  `).join("");
  return `
    <div class="landing">
      <h1 class="landtitle" style="font-size:1.4rem;">CREATE YOUR HUSTLER</h1>
      <div class="landsub">name yourself, pick a look, pick an edge</div>

      <div class="section-label">NAME</div>
      <input id="creationName" type="text" maxlength="20" placeholder="Enter your name" value="${creation.name}"
        oninput="creation.name = this.value"
        style="width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--card-border);border-radius:8px;color:var(--text);font-family:inherit;font-size:0.95rem;padding:11px;margin-bottom:16px;text-align:center;">

      <div class="section-label">AVATAR</div>
      <div class="avgrid">${avatarButtons}</div>

      <div class="section-label">EDGE</div>
      ${perkCards}

      <button class="btn btn-wide btn-green" onclick="startWithCreation()" style="margin-top:8px;">HIT THE STREET</button>
      <button class="btn btn-wide" onclick="backToLanding()" style="margin-top:8px;">BACK</button>
    </div>
  `;
}

function renderLanding() {
  const saved = loadSave();
  return `
    <div class="landing">
      <div class="landcredit">Created by Khalil Jones</div>
      <h1 class="landtitle">STREETLINE</h1>
      <div class="landsub">a hustler's pager, 30 days on the clock</div>

      ${saved ? `
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
          ${avatarSVG(saved.avatarId || "cap", 40)}
          <div style="font-size:0.85rem;">${saved.playerName || "Run"} in progress — Day ${saved.day}/${saved.maxDays}, ${saved.location}, net $${(saved.cash + saved.bank - saved.debt).toLocaleString()}.</div>
        </div>
        <button class="btn btn-wide btn-green" onclick="continueGame()">CONTINUE RUN</button>
      </div>` : ""}

      <div class="section-label">THE SETUP</div>
      <p class="landp">You owe $4,000 to people who don't send reminders. You've got a pager, a stash bag, and 5 neighborhoods to work. Buy low, sell high, and clear your name before day 30 — or don't, and see what that costs you.</p>

      <div class="section-label">HOW TO PLAY</div>
      <table class="landtable">
        <tr><td>DEAL</td><td>Buy and sell product at the local price.</td></tr>
        <tr><td>MAP</td><td>Travel to a new spot (costs a day) or pay down your debt.</td></tr>
        <tr><td>STASH</td><td>Bank cash so it can't be taken from you, check inventory.</td></tr>
        <tr><td>CONTACTS</td><td>Talk to each town's three contacts to build trust.</td></tr>
      </table>

      <div class="section-label">WATCH FOR</div>
      <ul class="landlist">
        <li>Prices swing every day, and sometimes spike or crash hard.</li>
        <li>Heat rises the more you buy — high heat means rougher cop stops.</li>
        <li>Gangs and police can hit you on the road. Pay, run, or fight.</li>
        <li>Debt collects interest every 5 days if you let it sit.</li>
        <li>Every town has 3 contacts. Trust rises when you talk or deal — higher trust means better prices, less heat, and fewer close calls.</li>
        <li>Win a run clean and a new town outside AC unlocks for good — keep winning to open them all.</li>
      </ul>

      <button class="btn btn-wide ${saved ? '' : 'btn-green'} landstart" onclick="openCharacterSelect()">${saved ? "START A NEW RUN" : "HIT THE STREET"}</button>
    </div>
  `;
}

function renderTop() {
  return `
    <div class="playerbar">
      ${avatarSVG(state.avatarId, 30)}
      <span class="playerbar-name">${state.playerName || "Hustler"}</span>
    </div>
    <div class="hdr">
      <span>DAY ${state.day}/${state.maxDays}</span>
      <span>${state.location.toUpperCase()}</span>
    </div>
    <div class="locflavor">${LOCATION_FLAVOR[state.location] || ""}</div>
    <div class="statrow">
      <div><span class="label">CASH</span>$${state.cash.toLocaleString()}</div>
      <div><span class="label">BANK</span>$${state.bank.toLocaleString()}</div>
      <div><span class="label">DEBT</span><span class="debt-val">$${state.debt.toLocaleString()}</span></div>
      <div><span class="label">HEAT</span>${Math.round(state.heat)}%</div>
      <div><span class="label">STASH</span>${invUsed()}/${state.capacity}</div>
      <div><span class="label">NET</span>$${netWorth().toLocaleString()}</div>
    </div>
    ${state.wantedStreak > 0 ? `<div style="font-size:0.74rem;color:var(--danger);margin:-6px 0 10px;">⚠ WANTED — heat's been maxed ${state.wantedStreak} day${state.wantedStreak>1?'s':''} straight. Cool off or the bank gets hit.</div>` : ""}
  `;
}

function renderDeal() {
  const rows = DRUGS.map(d => {
    const buyP = getBuyPrice(d.key);
    const sellP = getSellPrice(d.key);
    const own = state.inventory[d.key];
    const lvl = priceLevel(d.key);
    const canSell = own > 0;
    return `
      <div class="card">
        <div class="cardrow-top">
          <span class="name">${localName(d.key)}</span>
          <span class="price">$${buyP}</span>
        </div>
        <div class="cardrow-sub">
          <span>HOLD: ${own}</span>
          <span class="${lvl.cls}">${lvl.word}</span>
        </div>
        <div class="cardbtns">
          <button class="btn" onclick="buy('${d.key}')">BUY ${state.qty}</button>
          <button class="btn" onclick="sell('${d.key}')" ${canSell ? "" : "disabled"}>SELL ${state.qty}</button>
        </div>
      </div>
    `;
  }).join("");

  return `
    ${rows}
    <div class="qtypanel">
      <div class="section-label">QUANTITY</div>
      <div class="stepper">
        <button onclick="stepQty(-1)">−</button>
        <input class="qtyval" type="number" inputmode="numeric" value="${state.qty}" min="1" oninput="setQty(this.value)">
        <button onclick="stepQty(1)">+</button>
      </div>
      <div class="quickset">
        <button class="btn" onclick="setQty(5)">5</button>
        <button class="btn" onclick="setQty(10)">10</button>
        <button class="btn" onclick="setQty(25)">25</button>
      </div>
      <div class="qtymeta">SPACE LEFT: ${state.capacity - invUsed()} · CASH $${state.cash.toLocaleString()}</div>
    </div>
  `;
}

function renderMap() {
  const locs = LOCATIONS.map(loc => `
    <button class="btn maploc ${loc===state.location ? '' : ''}" onclick="travel('${loc}')">
      <div class="maploc-top">
        <span class="maploc-name">${loc}</span>
        <span class="${loc===state.location ? 'maploc-here' : 'maploc-go'}">${loc===state.location ? "HERE" : "GO &gt;"}</span>
      </div>
      <div class="maploc-flavor">${LOCATION_FLAVOR[loc] || ""}</div>
      <div class="maploc-tags">RISK ${riskLabel(loc)} · MKT ${mktLabel(loc)}</div>
    </button>
  `).join("");
  const remaining = EXTRA_LOCATIONS.length - (LOCATIONS.length - BASE_LOCATIONS.length);
  const teaser = remaining > 0 ? `
    <div class="card maploc" style="opacity:0.55;">
      <div class="maploc-top">
        <span class="maploc-name">??? — LOCKED</span>
      </div>
      <div class="maploc-flavor">Win a run clean (net worth ≥ $0) to open new territory outside AC. ${remaining} more to unlock.</div>
    </div>
  ` : "";
  return `
    <div class="section-label">TRAVEL — EACH TRIP COSTS A DAY</div>
    <div class="locgrid">${locs}${teaser}</div>
    <div class="section-label">DEBT</div>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--muted);margin:0 0 10px;">Owe <span class="debt-val">$${state.debt.toLocaleString()}</span>. Interest adds every 5 days.</p>
      <div class="amtfield">
        <input type="number" inputmode="numeric" value="${state.debtAmt}" min="0" oninput="setDebtAmt(this.value)">
        <button class="btn btn-green" onclick="payDebt()">PAY DOWN DEBT</button>
      </div>
      <div class="quickset">
        <button class="btn" onclick="setDebtAmt(100)">$100</button>
        <button class="btn" onclick="setDebtAmt(500)">$500</button>
        <button class="btn" onclick="setDebtAmt(Math.min(state.cash,state.debt))">MAX</button>
      </div>
    </div>
  `;
}

function renderStash() {
  return `
    <div class="section-label">BANK — SAFER THAN CASH ON HAND</div>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--muted);margin:0 0 10px;">Cops and gangs go for your pocket first. Stay maxed on heat too many days running, though, and they'll come for the bank too.</p>
      <div class="amtfield">
        <input type="number" inputmode="numeric" value="${state.bankAmt}" min="0" oninput="setBankAmt(this.value)">
        <button class="btn" onclick="bankDeposit()">DEPOSIT</button>
        <button class="btn" onclick="bankWithdraw()">WITHDRAW</button>
      </div>
      <div class="amtsplit"><span>POCKET $${state.cash.toLocaleString()}</span><span>BANK $${state.bank.toLocaleString()}</span></div>
      <div class="quickset">
        <button class="btn" onclick="setBankAmt(100)">$100</button>
        <button class="btn" onclick="setBankAmt(500)">$500</button>
        <button class="btn" onclick="setBankAmt(1000)">$1000</button>
        <button class="btn" onclick="setBankAmt(Math.max(state.cash,state.bank))">MAX</button>
      </div>
    </div>
    <div class="section-label">STASH BAG</div>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--muted);margin:0 0 10px;">Current capacity: ${state.capacity}. Bigger bag, bigger runs.</p>
      <button class="btn btn-wide btn-green" onclick="upgradeBag()">UPGRADE BAG — $${bagUpgradeCost().toLocaleString()} (+20 cap)</button>
    </div>
    <div class="section-label">PROTECTION</div>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--muted);margin:0 0 10px;">Carrying: <span style="color:var(--text);font-weight:bold;">${currentWeapon().name}</span>. Better protection means better odds if a gang fight breaks out.</p>
      ${nextWeapon()
        ? `<button class="btn btn-wide btn-green" onclick="upgradeWeapon()">GET A ${nextWeapon().name.toUpperCase()} — $${nextWeapon().cost.toLocaleString()}</button>`
        : `<div style="font-size:0.82rem;color:var(--green);">Already carrying the best protection there is.</div>`}
    </div>
    <div class="section-label">INVENTORY</div>
    <div class="card">
      ${DRUGS.map(d => `
        <div class="cardrow-top" style="margin-bottom:6px;">
          <span>${d.name}</span><span>${state.inventory[d.key]}</span>
        </div>
      `).join("")}
    </div>
  `;
}

function renderContacts() {
  const loc = state.location;
  const contacts = CONTACTS[loc] || [];
  const roleNote = {
    connector: "Cuts police & gang encounter odds",
    market: "Cuts buy price, boosts sell price",
    muscle: "Cuts heat gained from buying",
  };
  const cards = contacts.map(c => {
    const trust = trustOf(loc, c.role);
    const talkedToday = state.talkedDay[contactKey(loc, c.role)] === state.day;
    return `
      <div class="card">
        <div class="contactname">${c.name.toUpperCase()} <span class="trustpct">TRUST ${trust}</span></div>
        <div class="contactline">${c.line}</div>
        <div class="trustbar"><div class="trustfill" style="width:${trust}%"></div></div>
        <div class="contactmeta">
          <span>LV${tierIndex(trust)+1} · ${tierWord(trust)}</span>
          <span>${roleNote[c.role]}</span>
        </div>
        <button class="btn btn-wide ${talkedToday ? '' : 'btn-green'}" onclick="talkTo('${loc}','${c.role}')" ${talkedToday ? "disabled" : ""}>
          ${talkedToday ? "TALKED TODAY" : "TALK"}
        </button>
      </div>
    `;
  }).join("");
  return `
    <div class="section-label">CONTACTS — ${loc.toUpperCase()}</div>
    ${cards}
    <p style="font-size:0.76rem;color:var(--muted);margin-top:4px;">Trust rises when you talk and deal. Higher trust unlocks better prices, less heat, and fewer close calls.</p>
  `;
}

function renderEvent(ev) {
  if (ev.type === "police") {
    return `
      <div class="event-box">
        <h2>⚠ POLICE CHECKPOINT</h2>
        <p>An officer's waving cars down up ahead. Heat level: ${Math.round(state.heat)}%.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolvePolice('run')">TRY TO RUN</button>
          <button class="btn" onclick="resolvePolice('bribe')">SLIP A BRIBE</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "gang") {
    return `
      <div class="event-box">
        <h2>⚠ AMBUSH</h2>
        <p>A crew steps out of the shadows. They want $${ev.demand.toLocaleString()} or trouble.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveGang('pay')">PAY UP</button>
          <button class="btn" onclick="resolveGang('run')">RUN</button>
          <button class="btn" onclick="resolveGang('fight')">FIGHT (${currentWeapon().name})</button>
        </div>
      </div>
    `;
  }
  return "";
}

document.querySelectorAll(".key").forEach(k => {
  k.addEventListener("click", () => setView(k.dataset.nav));
});

render();
setTimeout(() => { if (!splashDone) skipSplash(); }, 3600);
setInterval(() => { if (appStarted) render(); }, 30000);
</script>
</body>
</html>
