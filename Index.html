    <div class="section-label">STASH BAG</div>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--muted);margin:0 0 10px;">Current capacity: ${stashCapacity()} (${state.capacity} base + ${vehicleCapacity()} vehicle). Bigger bag, bigger runs.</p>
      <button class="btn btn-wide btn-green" onclick="upgradeBag()">UPGRADE BAG — $${bagUpgradeCost().toLocaleString()} (+20 cap)</button>
    </div>
    <div class="section-label">PROTECTION</div>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--muted);margin:0 0 10px;">${armorName()} · ${Math.round(armorReduction()*100)}% damage reduction.</p>
      <button class="btn btn-wide" onclick="upgradeArmor()" ${armorCost()===null?'disabled':''}>${armorCost()===null?'ARMOR MAXED':`UPGRADE ARMOR — $${armorCost().toLocaleString()}`}</button>
    </div>
    <div class="section-label">RECOVERY</div>
    <div class="card">
      <p style="font-size:.8rem;color:var(--muted);margin:0 0 8px;">Need to recharge? REST advances one day and restores +50 Energy. Normal overnight recovery is +5 Energy after an action that advances the day.</p>
      <button class="btn btn-wide ${state.energy >= (state.maxEnergy || 100) ? '' : 'btn-green'}" onclick="rest()" ${state.energy >= (state.maxEnergy || 100) ? 'disabled' : ''}>REST · +50 ENERGY · ADVANCE DAY</button>
    </div>
    <div class="section-label">SAFEHOUSE — ${state.location.toUpperCase()}</div>
    <div class="card">
      ${safehouseFor(state.location) ? `<p style="font-size:.8rem;color:var(--muted);margin:0 0 8px;">${hasSafehouse(state.location) ? 'Your safehouse is active here.' : `Buy a safehouse for $${safehouseCost(state.location).toLocaleString()}.`}</p><div class="muted" style="font-size:.7rem;margin-bottom:8px;">${safehouseFor(state.location).recovery} HP · +50 Energy recovery · -${safehouseFor(state.location).heatCut} Heat · +${safehouseFor(state.location).capacity} stash cap</div><button class="btn btn-wide ${hasSafehouse(state.location)?'btn-green':''}" onclick="${hasSafehouse(state.location)?'useSafehouse()':`buySafehouse('${state.location}')`}">${hasSafehouse(state.location)?'USE SAFEHOUSE':'BUY SAFEHOUSE'}</button>` : `<p style="font-size:.8rem;color:var(--muted);margin:0;">No safehouse available in this location yet.</p>`}
    </div>
    <div class="section-label">GARAGE</div>
    <div class="card">
      <div style="font-size:.9rem;font-weight:bold;margin-bottom:4px;">🚗 ${currentVehicle().name}</div>
      <div style="font-size:.76rem;color:var(--muted);margin-bottom:8px;">${currentVehicle().desc}</div>
      <div class="summary-grid" style="margin-bottom:10px;">
        <div><span>CONDITION</span>${vehicleCondition()}%</div>
        <div><span>TRAVEL</span>${Math.ceil(vehicleEnergyCost() / vehicleConditionMult())} ENERGY</div>
        <div><span>CAPACITY</span>+${vehicleCapacity()}</div>
        <div><span>PROTECTION</span>+${vehicleProtection()}%</div>
      </div>
      ${vehicleCondition() < 100 ? `<button class="btn btn-wide btn-green" onclick="repairVehicle()">REPAIR — $${vehicleMaintenanceCost().toLocaleString()}</button>` : `<div style="font-size:.76rem;color:var(--green);margin-bottom:8px;">VEHICLE CONDITION IS 100%</div>`}
    </div>
    <div class="card">
      ${VEHICLES.map(v => {
        const owned = v.id === currentVehicle().id;
        return `<div style="padding:9px 0;border-bottom:1px solid var(--card-border);">
          <div style="display:flex;justify-content:space-between;gap:8px;font-weight:bold;font-size:.82rem;"><span>${v.name}</span><span>${v.cost ? '$'+v.cost.toLocaleString() : 'STARTER'}</span></div>
          <div style="font-size:.7rem;color:var(--muted);margin:4px 0 7px;">-${v.energy} travel Energy · +${v.capacity} capacity · +${v.protection}% protection</div>
          <button class="btn btn-wide ${owned?'':'btn-green'}" onclick="buyVehicle('${v.id}')" ${owned?'disabled':''}>${owned?'CURRENT VEHICLE':v.cost > state.cash ? 'NOT ENOUGH CASH' : 'GET '+v.name}</button>
        </div>`;
      }).join('')}
    </div>
    <div class="section-label">CURRENT PROTECTION</div>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--muted);margin:0 0 10px;">Carrying: <span style="color:var(--text);font-weight:bold;">${currentWeapon().name}</span>. Better protection means better odds if a gang fight breaks out.</p>
      ${nextWeapon()
        ? `<button class="btn btn-wide btn-green" onclick="upgradeWeapon()">GET A ${nextWeapon().name.toUpperCase()} — $${nextWeapon().cost.toLocaleString()}</button>`
        : `<div style="font-size:0.82rem;color:var(--green);">Already carrying the best protection there is.</div>`}
    </div>
    <div class="section-label">INVENTORY</div>
    <div class="card">
      ${DRUGS.map(d => `
        <div class="cardrow-top" style="margin-bottom:6px;">
          <span>${d.name}</span><span>${state.inventory[d.key]}</span>
        </div>
      `).join("")}
    </div>
  `;
}

function generateMission() {
  if (state.mission || Math.random() > 0.18) return;
  const c = contactOf(state.location, ["connector","market","muscle"][Math.floor(Math.random()*3)]);
  if (!c || trustOf(state.location, c.role) < 25) return;
  const rewards = [250, 400, 600];
  state.mission = { loc: state.location, contact: c.name, reward: rewards[Math.floor(Math.random()*rewards.length)], role: c.role, expires: state.day + 2 };
  addLog(`${c.name} has a job for you. Check CONTACTS.`);
}
function acceptMission() {
  const m = state.mission; if (!m || m.loc !== state.location) return;
  spendEnergy(8, "Mission"); state.stats.energySpent = (state.stats.energySpent||0)+8;
  const success = Math.random() < (0.68 + Math.min(.18, trustOf(state.location,m.role)/500));
  if (success) {
    const bonus = state.perkId === "hustler" ? 1.2 : 1;
    const pay = Math.round(m.reward * bonus); state.cash += pay; gainContactTrust(state.location,m.role,12); state.stats.missionsCompleted++;
    state.heat = Math.min(100, state.heat + 3); sndGood(); addLog(`${m.contact}'s job went clean. +$${pay.toLocaleString()} and trust increased.`);
  } else {
    state.stats.missionsFailed++; state.heat = Math.min(100, state.heat + 10); damageHealth(8, "The mission goes sideways"); sndBad(); addLog(`${m.contact}'s job went sideways. No payout and heat rises.`);
  }
  state.mission = null; render();
}
function declineMission() { if (!state.mission) return; addLog(`Passed on ${state.mission.contact}'s job.`); state.mission = null; render(); }
function renderRivalWatch() {
  const rival = rivalFor(state.location);
  const pressure = rivalPressureFor(state.location);
  return `
    <div class="section-label">RIVAL WATCH</div>
    <div class="card">
      <div class="contactname">${rival.name} <span class="trustpct">PRESSURE ${pressure}%</span></div>
      <div class="contactline">${rival.style}. Influence rating: ${rival.power}%.</div>
      <div class="trustbar"><div class="trustfill" style="width:${pressure}%"></div></div>
      <div class="contactmeta"><span>STATUS · ${rivalStatus(pressure)}</span><span>HOME · ${rival.home}</span></div>
      <div class="contact-tier"><span>MARKET EFFECT</span><b>${pressure >= 45 ? "PRICES UNDER PRESSURE" : "NORMAL MARKET"}</b></div>
      <div style="font-size:.75rem;color:var(--muted);margin-top:8px;">Trading and territory claims raise pressure. It cools down over time.</div>
    </div>
  `;
}

function renderContacts() {
  // Migrate older saves before reading contact data.
  state.talkedDay = state.talkedDay || {};
  state.dealsSinceTalk = state.dealsSinceTalk || {};
  state.contactTrust = state.contactTrust || {};
  state.contactFavorUsedDay = state.contactFavorUsedDay || {};
  state.contactFavors = state.contactFavors || {};
  const loc = state.location;
  const contacts = CONTACTS[loc] || [];
  const roleNote = {
    connector: "City intel & connections",
    market: "Local price knowledge",
    muscle: "Backup & recovery",
  };
  const cards = contacts.map(c => {
    const trust = trustOf(loc, c.role);
    const talkedToday = state.talkedDay[contactKey(loc, c.role)] === state.day;
    const milestones = contactMilestones(trust);
    const next = trust < 25 ? 25 : trust < 50 ? 50 : trust < 75 ? 75 : trust < 100 ? 100 : null;
    const ready = favorReady(loc, c.role);
    const favorText = trust < 50
      ? `Reach ${50 - (trust % 50)} more trust to unlock a favor.`
      : ready
        ? "Favor ready — restores 15 Energy + 5 Health."
        : "Favor used — available again after 5 days.";
    return `
    ${renderRivalWatch()}
      <div class="card">
        <div class="contactname">${c.name.toUpperCase()} <span class="trustpct">TRUST ${trust}</span></div>
        <div class="contactline">${c.line}</div>
        <div class="trustbar"><div class="trustfill" style="width:${trust}%"></div></div>
        <div class="contactmeta">
          <span>LV${tierIndex(trust)+1} · ${tierWord(trust)}</span>
          <span>${roleNote[c.role]}</span>
        </div>
        <div class="contact-tier"><span>RELATIONSHIP</span><b>${trust >= 100 ? "MAXED" : `${next - trust} TRUST TO NEXT TIER`}</b></div>
        <div class="contact-milestones">
          <div class="contact-milestone ${milestones[0]?'on':''}">25<br>FAMILIAR</div>
          <div class="contact-milestone ${milestones[1]?'on':''}">50<br>TRUSTED</div>
          <div class="contact-milestone ${milestones[2]?'on':''}">75<br>CLOSE</div>
          <div class="contact-milestone ${milestones[3]?'on':''}">100<br>FAMILY</div>
        </div>
        <button class="btn btn-wide ${talkedToday ? '' : 'btn-green'}" data-contact-talk="${String(loc).replace(/"/g, "&quot;")}" data-contact-role="${String(c.role).replace(/"/g, "&quot;")}" ${talkedToday ? "disabled" : ""}>
          ${talkedToday ? "TALKED TODAY" : "TALK +8 TRUST"}
        </button>
        <div class="contact-favor">
          <div class="${ready ? 'favor-ready' : 'favor-locked'}">${ready ? '★ FAVOR READY' : '○ FAVOR LOCKED'}</div>
          <div style="font-size:.68rem;color:var(--muted);margin:3px 0 7px;">${favorText}</div>
          ${trust >= 50 ? `<button class="btn btn-wide ${ready ? 'btn-green' : ''}" data-contact-favor="${String(loc).replace(/"/g, "&quot;")}" data-contact-favor-role="${String(c.role).replace(/"/g, "&quot;")}" ${ready ? '' : 'disabled'}>${ready ? 'CALL IN FAVOR' : 'FAVOR ON COOLDOWN'}</button>` : ''}
        </div>
      </div>
    `;
  }).join("");
  const owned = state.territories[loc];
  const dealsSince = state.dealsSinceTalk[loc] || 0;
  const territoryCard = owned
    ? `<div class="card" style="border-color:var(--green);">
        <div style="font-size:0.85rem;font-weight:bold;color:var(--green);margin-bottom:4px;">YOUR TERRITORY</div>
        <div style="font-size:0.78rem;color:var(--muted);">Held ${territoryHeldDays(loc)} day${territoryHeldDays(loc)===1?"":"s"}. Upkeep $${TERRITORY_UPKEEP} every 5 days. Risk cut: ${Math.round((1-territoryRiskCut(loc))*100)}%.</div>
        <div style="font-size:.74rem;margin-top:7px;color:var(--text);">DEFENSE ${territoryDefenseLevel(loc)}/3 · Higher defense lowers dispute risk.</div>
        ${territoryDefenseLevel(loc) < 3 ? `<button class="btn btn-wide btn-green" onclick="reinforceTerritory(${JSON.stringify(loc)})">REINFORCE — $${(750 + territoryDefenseLevel(loc)*750).toLocaleString()}</button>` : `<div style="font-size:.72rem;color:var(--green);margin-top:7px;">FULLY REINFORCED</div>`}
      </div>`
    : `<div class="card">
        <div style="font-size:0.85rem;color:var(--muted);margin-bottom:10px;">Claim this town as yours — lowers police & gang risk here the longer you hold it, but costs upkeep every 5 days.</div>
        <button class="btn btn-wide btn-green" onclick="claimTerritory(${JSON.stringify(loc).replace(/"/g, '&quot;')})">CLAIM TERRITORY — $${TERRITORY_COST.toLocaleString()}</button>
      </div>`;
  const snitchWarning = dealsSince > 8
    ? `<div style="font-size:0.74rem;color:var(--danger);margin-bottom:10px;">⚠ It's been ${dealsSince} deals since you checked in here — someone might talk.</div>`
    : "";
  return `
    <div class="section-label">CONTACT NETWORK — ${loc.toUpperCase()}</div>
    <div class="card" style="border-color:rgba(34,197,94,.25);">
      <div style="font-size:.86rem;font-weight:bold;color:var(--green);margin-bottom:4px;">CONTACTS 2.0</div>
      <div style="font-size:.74rem;color:var(--muted);line-height:1.45;">Build relationships through daily conversations. Reach 50 Trust to unlock personal favors, then strengthen the relationship through the higher tiers.</div>
    </div>
    ${state.mission && state.mission.loc === loc ? `<div class="section-label">STREET MISSION</div><div class="card mission-card"><div style="font-weight:bold;font-size:.88rem;">${state.mission.contact.toUpperCase()} HAS A JOB</div><p style="font-size:.76rem;color:var(--muted);margin:6px 0 10px;">Finish it for $${state.mission.reward.toLocaleString()}. Expires after day ${state.mission.expires}.</p><div class="cardbtns"><button class="btn btn-green" onclick="acceptMission()">TAKE IT</button><button class="btn" onclick="declineMission()">PASS</button></div></div>` : ""}
    ${cards}
    <div class="section-label">TERRITORY — ${loc.toUpperCase()}</div>
    ${territoryCard}
    ${snitchWarning}
  `;
}

function renderEvent(ev) {
  if (ev.type === "police") {
    return `
      <div class="event-box">
        <h2>⚠ POLICE CHECKPOINT</h2>
        <p>An officer's waving cars down up ahead. Heat level: ${Math.round(state.heat)}%.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolvePolice('run')">TRY TO RUN</button>
          <button class="btn" onclick="resolvePolice('bribe')">SLIP A BRIBE</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "gang") {
    return `
      <div class="event-box">
        <h2>⚠ AMBUSH</h2>
        <p>A crew steps out of the shadows. They want $${ev.demand.toLocaleString()} or trouble.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveGang('pay')">PAY UP</button>
          <button class="btn" onclick="resolveGang('run')">RUN</button>
          <button class="btn" onclick="resolveGang('fight')">FIGHT (${currentWeapon().name})</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "street") {
    return `
      <div class="event-box">
        <h2>${ev.title}</h2>
        <p>${ev.text}</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveStreet('a')">${ev.a}</button>
          <button class="btn" onclick="resolveStreet('b')">${ev.b}</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "hospital") {
    return `
      <div class="event-box">
        <h2>⚕ YOU'RE DOWN</h2>
        <p>${ev.cause || "The street caught up with you."}. Your health hit 0. You need to recover before getting back out there.</p>
        <div class="event-actions">
          <button class="btn btn-green" onclick="resolveHospital('hospital')">HOSPITAL — $250</button>
          <button class="btn" onclick="resolveHospital('laylow')">LAY LOW — FREE</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "rival") {
    const fee = Math.min(state.cash, 150 + Math.round((ev.pressure || 0) * 2));
    return `
      <div class="event-box">
        <h2>⚠ RIVAL PRESSURE</h2>
        <p><b>${ev.rivalName}</b> is pushing back on your business in ${state.location}. Pressure is at ${Math.round(ev.pressure || 0)}%.</p>
        <p style="color:var(--muted);font-size:.82rem;">${ev.style}. Choose how you want to handle the pressure.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveRival('negotiate')">NEGOTIATE — $${fee.toLocaleString()}</button>
          <button class="btn" onclick="resolveRival('laylow')">LAY LOW — 10 ENERGY</button>
          <button class="btn btn-green" onclick="resolveRival('compete')">COMPETE</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "territory") {
    const reinforceCost = 500 + (ev.defense || 0) * 500;
    return `
      <div class="event-box">
        <h2>⚠ TERRITORY DISPUTE</h2>
        <p><b>${ev.rivalName}</b> is testing your control of <b>${ev.loc}</b>. Rival pressure is ${Math.round(ev.pressure || 0)}%.</p>
        <p style="color:var(--muted);font-size:.82rem;">Defense level: ${ev.defense || 0}/3. Handle it without letting the dispute take over the neighborhood.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveTerritory('negotiate')">NEGOTIATE</button>
          <button class="btn" onclick="resolveTerritory('reinforce')">REINFORCE — $${reinforceCost.toLocaleString()}</button>
          <button class="btn btn-green" onclick="resolveTerritory('hold')">HOLD THE TERRITORY</button>
        </div>
      </div>
    `;
  }
  if (ev.type === "snitch") {
    return `
      <div class="event-box">
        <h2>⚠ WORD GOT OUT</h2>
        <p>${ev.name} got tired of you never checking in. Word is they tipped the cops — you can pay to bury it or take what's coming.</p>
        <div class="event-actions">
          <button class="btn" onclick="resolveSnitch('payoff')">PAY OFF — $${ev.demand.toLocaleString()}</button>
          <button class="btn" onclick="resolveSnitch('takehit')">TAKE THE HIT</button>
        </div>
      </div>
    `;
  }
  return "";
}

document.addEventListener("click", (e) => {
  const key = e.target.closest(".key[data-nav]");
  if (key) {
    e.preventDefault();
    e.stopPropagation();
    setView(key.dataset.nav);
    return;
  }
  const regionBtn = e.target.closest("[data-map-region]");
  if (regionBtn) {
    e.preventDefault();
    e.stopPropagation();
    if (regionBtn.dataset.mapRegion === "regional") openRegionalMap();
    else openAtlanticMap();
  }
});

// Contact buttons are rendered dynamically, so use one delegated handler.
document.addEventListener("click", (e) => {
  const talkBtn = e.target.closest("[data-contact-talk]");
  if (talkBtn && !talkBtn.disabled) {
    const loc = talkBtn.getAttribute("data-contact-talk");
    const role = talkBtn.getAttribute("data-contact-role");
    if (typeof talkTo === "function") talkTo(loc, role);
    return;
  }

  const favorBtn = e.target.closest("[data-contact-favor]");
  if (favorBtn && !favorBtn.disabled) {
    const loc = favorBtn.getAttribute("data-contact-favor");
    const role = favorBtn.getAttribute("data-contact-favor-role");
    if (typeof callInFavor === "function") callInFavor(loc, role);
  }
});

render();
setTimeout(() => { if (!splashDone) skipSplash(); }, 3600);
setInterval(() => { if (appStarted) render(); }, 30000);
</script>
</body>
</html>
