<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STREETLINE</title>
<style>
  :root {
    --bg: #0a0d13;
    --card: #131722;
    --card-border: rgba(255,255,255,0.08);
    --text: #e7e9ee;
    --muted: #7b8394;
    --muted-2: #545b6b;
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.15);
    --debt: #ff6b7d;
    --danger: #ff5566;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }
  body {
    font-family: 'Courier New', ui-monospace, Menlo, monospace;
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  .screen {
    flex: 1 1 auto;
    background: var(--bg);
    color: var(--text);
    padding: 0 16px 10px;
    overflow-y: auto;
    position: relative;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    color: var(--muted);
    padding: 10px 0 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }
  .statusbar .appname { letter-spacing: 2px; color: var(--muted); }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .battery {
    width: 20px; height: 10px;
    border: 1px solid var(--muted);
    border-radius: 2px;
    position: relative;
    display: inline-block;
  }
  .battery::after {
    content: "";
    position: absolute; top: -3px; right: -3px;
    width: 2px; height: 4px;
    background: var(--muted);
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    position: absolute; top: 1px; bottom: 1px; left: 1px;
    width: 60%;
    background: var(--muted);
    border-radius: 1px;
  }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 9px; }
  .bars span { width: 2px; background: var(--muted); display: block; }
  .bars span:nth-child(1) { height: 3px; }
  .bars span:nth-child(2) { height: 5px; }
  .bars span:nth-child(3) { height: 7px; }
  .bars span:nth-child(4) { height: 9px; }
  .mutebtn {
    background: none; border: none; color: var(--muted);
    font-size: 0.85rem; padding: 0; cursor: pointer; line-height: 1;
  }
  .statline {
    display: flex; justify-content: space-between;
    font-size: 0.8rem; padding: 5px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .statline:last-child { border-bottom: none; }
  .statline span:first-child { color: var(--muted); }

  .playerbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0 10px;
  }
  .playerbar-name { font-size: 0.86rem; font-weight: bold; }
  .playerbar-info { flex: 1; min-width: 0; }
  .playerbar-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .health-readout { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
  .healthbar { height: 7px; width: 100%; background: #202633; border: 1px solid rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
  .healthfill { height: 100%; width: 100%; background: var(--green); border-radius: 99px; transition: width 0.25s ease, background 0.25s ease; }
  .healthfill.warn { background: #eab308; }
  .healthfill.danger { background: var(--danger); }
  .health-warning { font-size: 0.72rem; margin: -4px 0 10px; color: #eab308; }
  .health-warning.danger { color: var(--danger); }
  .meterrow { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:-4px 0 10px; }
  .mini-meter { background:var(--card); border:1px solid var(--card-border); border-radius:9px; padding:7px 9px; }
  .mini-meter-top { display:flex; justify-content:space-between; font-size:.68rem; color:var(--muted); margin-bottom:4px; }
  .meter { height:5px; background:#202633; border-radius:99px; overflow:hidden; }
  .meterfill { height:100%; border-radius:99px; transition:width .2s ease; }
  .energyfill { background:#60a5fa; }
  .armorfill { background:#a78bfa; }
  .heat-tier { font-weight:bold; }
  .day-summary { border-color:rgba(34,197,94,.35); }
  .summary-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:7px 12px; font-size:.76rem; }
  .summary-grid span { color:var(--muted); display:block; font-size:.65rem; }
  .mission-card { border-color:rgba(167,139,250,.45); }
  .contact-tier { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; font-size:.72rem; color:var(--muted); }
  .contact-tier b { color:var(--text); }
  .contact-milestones { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:8px 0 10px; }
  .contact-milestone { border:1px solid var(--card-border); border-radius:6px; padding:4px 2px; text-align:center; font-size:.58rem; color:var(--muted-2); }
  .contact-milestone.on { color:var(--green); border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.05); }
  .contact-favor { margin-top:8px; padding-top:8px; border-top:1px solid var(--card-border); }
  .favor-ready { color:var(--green); font-size:.7rem; font-weight:bold; }
  .favor-locked { color:var(--muted-2); font-size:.7rem; }

  /* STREETLINE MAP — OPTION 1: CLEAN STREET GRID */
  .street-map-layout { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:10px; align-items:start; }
  .citymap-wrap { min-width:0; }
  .citymap {
    position:relative; height:430px; overflow:hidden; border:1px solid rgba(255,255,255,.12); border-radius:12px;
    background:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px),
      #0b1118;
    background-size:34px 34px,34px 34px;
    box-shadow:inset 0 0 40px rgba(0,0,0,.5);
  }
  .citymap::before { content:""; position:absolute; inset:-30%; background:radial-gradient(circle at 50% 45%, rgba(34,197,94,.07), transparent 42%); pointer-events:none; }
  .cityroads { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:.8; }
  .citywater { fill:rgba(40,110,145,.13); stroke:rgba(75,170,205,.25); stroke-width:1; }
  .road { stroke:rgba(210,220,230,.18); stroke-width:2; fill:none; }
  .road-main { stroke:rgba(210,220,230,.28); stroke-width:3; fill:none; }
  .road-dash { stroke:rgba(34,197,94,.16); stroke-width:1; stroke-dasharray:5 7; fill:none; }
  .map-zone { position:absolute; border:1px solid rgba(255,255,255,.12); border-radius:40% 55% 45% 50%; pointer-events:none; opacity:.9; }
  .zone-bungalow { left:3%; top:20%; width:31%; height:27%; background:rgba(34,197,94,.14); border-color:rgba(34,197,94,.5); }
  .zone-back { left:2%; top:55%; width:31%; height:25%; background:rgba(255,85,102,.08); border-color:rgba(255,85,102,.38); }
  .zone-venice { left:35%; top:57%; width:27%; height:23%; background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.32); }
  .zone-downtown { left:37%; top:28%; width:27%; height:25%; background:rgba(59,130,246,.07); border-color:rgba(59,130,246,.28); }
  .zone-carver { left:66%; top:27%; width:30%; height:28%; background:rgba(234,179,8,.055); border-color:rgba(234,179,8,.25); }
  .zone-extra { background:rgba(255,255,255,.025); border-color:rgba(255,255,255,.12); }
  /* EMPIRE 2.0 — business markers */
  .business-marker { position:absolute; transform:translate(-50%,-50%); z-index:6; min-width:52px; max-width:78px; padding:4px 5px; border:1px solid rgba(34,197,94,.55); border-radius:7px; background:rgba(5,10,8,.94); color:var(--green); font-family:inherit; text-align:center; box-shadow:0 0 12px rgba(34,197,94,.14); pointer-events:none; }
  .business-marker .bm-icon { display:block; font-size:.8rem; line-height:1; }
  .business-marker .bm-name { display:block; margin-top:2px; font-size:.47rem; font-weight:bold; letter-spacing:.35px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .business-marker .bm-cond { display:block; margin-top:2px; font-size:.43rem; color:var(--muted); }
  .business-marker.bm-low { border-color:rgba(255,85,102,.65); color:#ff7180; }
  .business-marker.bm-low .bm-cond { color:#ff7180; }

.map-marker {
    position:absolute; transform:translate(-50%,-50%); z-index:4; min-width:92px; max-width:130px;
    padding:5px 7px 6px; border:1px solid rgba(255,255,255,.3); border-radius:8px;
    background:rgba(8,12,18,.93); color:var(--text); font-family:inherit; cursor:pointer; text-align:left;
    box-shadow:0 4px 14px rgba(0,0,0,.32); transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .map-marker:hover { transform:translate(-50%,-50%) scale(1.03); }
  .map-marker:active { transform:translate(-50%,-50%) scale(.98); }
  .map-marker .marker-name { display:block; font-size:.58rem; font-weight:bold; letter-spacing:.35px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .map-marker .marker-sub { display:flex; align-items:center; gap:4px; margin-top:3px; font-size:.53rem; color:var(--muted); white-space:nowrap; }
  .marker-dot { width:9px; height:9px; border-radius:50%; border:2px solid currentColor; display:inline-block; flex:0 0 auto; }
  .marker-current { border-color:#38bdf8; box-shadow:0 0 0 2px rgba(56,189,248,.12), 0 0 18px rgba(56,189,248,.18); }
  .marker-current .marker-dot { color:#38bdf8; background:#38bdf8; }
  .marker-owned { border-color:var(--green); box-shadow:0 0 0 2px rgba(34,197,94,.1), 0 0 15px rgba(34,197,94,.12); }
  .marker-owned .marker-dot { color:var(--green); background:var(--green); }
  .marker-available .marker-dot { color:#d9e0e8; background:transparent; }
  .marker-locked { opacity:.55; border-color:rgba(255,255,255,.18); cursor:not-allowed; }
  .marker-locked .marker-dot { color:#7b8394; background:#7b8394; }
  .marker-danger { border-color:rgba(255,85,102,.55); }
  .marker-danger .marker-sub { color:#ff7180; }
  .marker-highmarket .market-icon { color:#22c55e; }
  .marker-selected { outline:2px solid rgba(255,255,255,.72); outline-offset:2px; }
  .marker-icon { font-size:.62rem; margin-right:3px; }
  .map-compass { position:absolute; right:8px; top:8px; z-index:5; width:28px; height:38px; border:1px solid rgba(255,255,255,.18); border-radius:7px; background:rgba(8,12,18,.82); text-align:center; padding-top:4px; font-size:.65rem; color:#fff; }
  .map-compass .arrow { display:block; font-size:.9rem; line-height:12px; color:var(--text); }
  .map-caption { position:absolute; left:9px; bottom:8px; z-index:5; padding:4px 7px; border:1px solid rgba(255,255,255,.1); border-radius:5px; background:rgba(8,12,18,.78); font-size:.52rem; color:var(--muted); letter-spacing:.5px; }
  .map-panel { background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:11px 12px; }
  .map-panel-title { font-size:.67rem; letter-spacing:1px; color:var(--muted); margin-bottom:9px; }
  .map-legend { display:grid; gap:7px; margin-bottom:12px; }
  .legend-item { display:flex; align-items:center; gap:7px; font-size:.62rem; color:var(--muted); }
  .legend-icon { width:15px; text-align:center; font-size:.75rem; color:var(--text); flex:0 0 15px; }
  .legend-house { color:var(--green); }
  .legend-blue { color:#38bdf8; }
  .legend-red { color:#ff5566; }
  .legend-yellow { color:#eab308; }
  .legend-police { color:#60a5fa; }
  .legend-gang { color:#fb7185; }
  .location-info { border-top:1px solid var(--card-border); padding-top:10px; }
  .location-info-name { font-size:.8rem; font-weight:bold; margin-bottom:8px; }
  .map-stat { display:grid; grid-template-columns:56px 1fr auto; gap:5px; align-items:center; margin:5px 0; font-size:.59rem; }
  .map-stat-label { color:var(--muted); }
  .stat-bars { display:flex; gap:2px; }
  .stat-bars i { display:block; width:11px; height:5px; border-radius:1px; background:#2a313d; }
  .stat-bars i.on-market { background:#22c55e; }
  .stat-bars i.on-police { background:#60a5fa; }
  .stat-bars i.on-gang { background:#fb7185; }
  .map-stat-value { color:var(--text); font-size:.56rem; }
  .territory-badge { color:var(--green); font-size:.58rem; margin-top:7px; }
  .map-panel .btn { margin-top:8px; }
  .map-debt { margin-top:10px; }
  .map-extra-locked { margin-top:8px; font-size:.58rem; color:var(--muted); }
  .map-note { font-size:.58rem; color:var(--muted); line-height:1.4; margin:8px 0 0; }
  @media(max-width:760px) {
    .street-map-layout { grid-template-columns:1fr; }
    .citymap { height:520px; }
    .map-panel { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
    .map-panel > .map-panel-title, .map-panel > .map-legend { grid-column:1 / -1; }
    .map-legend { grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px 10px; margin-bottom:0; }
    .location-info { border-top:0; border-left:1px solid var(--card-border); padding:0 0 0 10px; }
  }
  @media(max-width:480px) {
    .citymap { height:500px; }
    .map-marker { min-width:74px; max-width:108px; padding:4px 5px 5px; }
    .map-marker .marker-name { font-size:.53rem; }
    .map-marker .marker-sub { font-size:.48rem; }
    .map-panel { display:block; }
    .map-legend { margin-bottom:12px; }
    .location-info { border-left:0; border-top:1px solid var(--card-border); padding:10px 0 0; }
  }

  .avgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .avbtn {
    background: var(--card); border: 2px solid var(--card-border); border-radius: 12px;
    padding: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .avbtn-sel { border-color: var(--green); box-shadow: 0 0 0 2px rgba(34,197,94,0.25); }
  .avbtn { position: relative; }
  .avbtn-locked { opacity: 0.4; cursor: not-allowed; }
  .avlock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .colorrow { display: flex; gap: 12px; margin-bottom: 18px; }
  .colorbtn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--card-border); cursor: pointer; }
  .colorbtn-sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.3); }
  .perkcard {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 2px solid var(--card-border); border-radius: 10px; padding: 11px 13px;
    margin-bottom: 8px; cursor: pointer; font-family: inherit;
  }
  .perkcard-sel { border-color: var(--green); }
  .perkcard-label { font-weight: bold; font-size: 0.86rem; color: var(--text); margin-bottom: 3px; }
  .perkcard-desc { font-size: 0.74rem; color: var(--muted); }
  .hdr {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 10px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .statrow {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 12px;
    font-size: 0.88rem;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 12px;
  }
  .statrow .label { color: var(--muted); font-size: 0.72rem; display: block; }
  .statrow .debt-val { color: var(--debt); }
  .locflavor {
    font-size: 0.76rem;
    color: var(--muted);
    font-style: italic;
    margin: -2px 0 10px;
  }
  .section-label {
    font-size: 0.76rem;
    color: var(--muted);
    margin: 12px 0 8px;
    letter-spacing: 0.5px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .cardrow-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .cardrow-top .name { font-weight: bold; font-size: 0.95rem; }
  .cardrow-top .price { font-weight: bold; font-size: 0.95rem; }
  .cardrow-sub {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted-2);
    margin-bottom: 10px;
  }
  .tag-fair { color: var(--muted); }
  .tag-low { color: var(--green); }
  .tag-high { color: var(--debt); }
  .cardbtns { display: flex; gap: 8px; }
  .btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 11px 8px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    flex: 1;
  }
  .btn:active { background: rgba(255,255,255,0.06); }
  .btn[disabled] { opacity: 0.3; }
  .btn-wide { width: 100%; margin-top: 8px; }
  .btn-green {
    background: var(--green);
    border-color: var(--green);
    color: #06210f;
    font-weight: bold;
  }
  .muted { color: var(--muted); }

  .qtypanel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 14px 0;
  }
  .qtypanel .section-label { margin: 0 0 10px; }
  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .stepper button {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1.1rem;
    flex: 0 0 auto;
  }
  .stepper button:active { background: rgba(255,255,255,0.08); }
  .stepper .qtyval {
    flex: 1;
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    min-width: 0;
  }
  .quickset { display: flex; gap: 8px; }
  .quickset .btn { padding: 9px 4px; font-size: 0.76rem; }
  .qtymeta { font-size: 0.72rem; color: var(--muted); margin-top: 10px; }

  .amtfield {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .amtfield input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    padding: 10px;
    min-width: 0;
    text-align: center;
  }
  .amtfield .btn { flex: 1; }
  .amtsplit { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }

  .locgrid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .maploc { text-align: left; padding: 14px 16px; flex: none; }
  .maploc-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .maploc-name { font-weight: bold; font-size: 0.92rem; }
  .maploc-here { color: var(--green); font-size: 0.72rem; font-weight: bold; }
  .maploc-go { color: var(--muted); font-size: 0.72rem; }
  .maploc-flavor { font-size: 0.76rem; color: var(--muted); font-style: italic; margin-bottom: 6px; }
  .maploc-tags { font-size: 0.7rem; color: var(--muted-2); }

  .contactname { font-size: 0.92rem; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 4px; }
  .trustpct { color: var(--muted); font-size: 0.74rem; font-weight: normal; }
  .contactline { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-bottom: 10px; }
  .trustbar { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .trustfill { height: 100%; background: var(--green); }
  .contactmeta { font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 10px; }

  .log {
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--card-border);
    margin-top: 12px;
    padding-top: 10px;
  }
  .log div { margin-bottom: 4px; }
  .event-box {
    background: var(--card);
    border: 1px solid var(--danger);
    padding: 16px;
    border-radius: 12px;
  }
  .event-box h2 { font-size: 1rem; margin: 0 0 8px; color: var(--danger); }
  .event-box p { font-size: 0.85rem; margin: 0 0 14px; color: var(--text); }
  .event-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .event-actions .btn { border-color: var(--danger); color: var(--danger); min-width: 90px; }
  .keys {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: #000;
    border-top: 1px solid var(--card-border);
  }
  .keys.row2 { grid-template-columns: repeat(3, 1fr); margin-top: 0; padding-top: 0; }

const VEHICLES = [
  { id:"streetRunner", name:"STREET RUNNER", cost:0, energy:0, capacity:0, protection:0, maintenance:0, desc:"Your starter ride. Nothing fancy, but it gets you there." },
  { id:"compact", name:"COMPACT", cost:2500, energy:2, capacity:5, protection:5, maintenance:35, desc:"Easy to move around in. Saves a little Energy on every trip." },

  { id:"performance", name:"PERFORMANCE", cost:12000, energy:4, capacity:8, protection:10, maintenance:100, desc:"Fast and efficient. The best Energy savings, with higher upkeep." }
];
function vehicleById(id) { return VEHICLES.find(v => v.id === id) || VEHICLES[0]; }
function currentVehicle() { return vehicleById(state.currentVehicle || "streetRunner"); }
function vehicleCapacity() { return currentVehicle().capacity || 0; }
function stashCapacity() { return (state.capacity || 0) + vehicleCapacity(); }
function vehicleEnergyCost() {
  const v = currentVehicle();
  const perkCost = state.perkId === "runner" ? 7 : 10;
  return Math.max(3, perkCost - (v.energy || 0));
}
function vehicleProtection() { return currentVehicle().protection || 0; }
function vehicleCondition() { return Math.max(0, Math.min(100, Math.round(state.vehicleCondition == null ? 100 : state.vehicleCondition))); }
function vehicleConditionMult() { return vehicleCondition() <= 20 ? 0.6 : vehicleCondition() <= 50 ? 0.8 : 1; }
function vehicleMaintenanceCost() {
  const v = currentVehicle();
  return Math.max(50, Math.round((v.maintenance || 0) * (1 + (100 - vehicleCondition()) / 100)));
}
function buyVehicle(id) {
  const v = vehicleById(id);
  if (!v || v.id === currentVehicle().id) return;
  if (state.cash < v.cost) { sndFail(); addLog(`Not enough cash for the ${v.name}.`); render(); return; }
  state.cash -= v.cost;
  state.currentVehicle = v.id;
  state.vehicleCondition = 100;
  sndGood();
  addLog(`Switched to the ${v.name}. Travel Energy is now ${vehicleEnergyCost()}.`);
  render();
}
function repairVehicle() {
  const condition = vehicleCondition();
  if (condition >= 100) { sndFail(); addLog("Your vehicle is already at 100% condition."); render(); return; }
  const cost = vehicleMaintenanceCost();
  if (state.cash < cost) { sndFail(); addLog(`Not enough cash for repairs. Need $${cost.toLocaleString()}.`); render(); return; }
  state.cash -= cost;
  state.vehicleCondition = 100;
  sndGood();
  addLog(`${currentVehicle().name} repaired to 100% for $${cost.toLocaleString()}.`);
  render();
}
function damageVehicle(amount) {
  if (!state || !currentVehicle()) return;
  state.vehicleCondition = Math.max(0, vehicleCondition() - Math.max(0, amount || 0));
  if (vehicleCondition() <= 20) addLog(`${currentVehicle().name} is in rough shape. Repairs are recommended.`);
}
function vehicleSummary() {
  const v = currentVehicle();
  return `${v.name} · ${vehicleCondition()}% condition · ${vehicleEnergyCost()} Energy/trip`;
}

// ---- Sound engine (Web Audio, synthesized — no external assets) ----
let audioCtx = null;
function ac() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  return audioCtx;
}
function beep(freq, dur, type, vol, delay) {
  if (muted) return;
  const ctx = ac();
  if (!ctx) return;
  try {
    const t0 = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol || 0.18, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}

function heatTier() {
  const h = state.heat || 0;
  if (h < 20) return "COOL";
  if (h < 45) return "WATCHED";
  if (h < 70) return "HOT";
  if (h < 90) return "WANTED";
  return "CRITICAL";
}
function heatTierClass() { return heatTier() === "CRITICAL" || heatTier() === "WANTED" ? "danger" : heatTier() === "HOT" ? "warn" : ""; }
function energyPct() { return Math.max(0, Math.min(100, Math.round(((state.energy ?? 100) / (state.maxEnergy || 100)) * 100))); }
function spendEnergy(amount, reason) {
  const before = state.energy ?? (state.maxEnergy || 100);
  state.energy = Math.max(0, before - Math.max(0, amount));
  if (before !== state.energy && reason) addLog(`${reason} -${before-state.energy} Energy.`);
}
function recoverEnergy(amount, reason) {
  const max = state.maxEnergy || 100;
  const before = state.energy ?? max;
  state.energy = Math.min(max, before + Math.max(0, amount));
  const gained = state.energy - before;
  if (gained && reason) addLog(`${reason} +${gained} Energy.`);
}
function armorReduction() {
  const lvl = state.armorLevel || 0;
  return Math.min(0.35, lvl * 0.12);
}
function safehouseFor(loc) { return SAFEHOUSES[loc] || null; }
function safehouseCost(loc) { const h = safehouseFor(loc); return h ? h.cost : 0; }
function hasSafehouse(loc) { return !!(state.safehouses && state.safehouses[loc]); }
function buySafehouse(loc) {
  const h = safehouseFor(loc);
  if (!h || hasSafehouse(loc)) return;
  if (state.cash < h.cost) { sndFail(); addLog(`Not enough cash for the ${loc} safehouse.`); render(); return; }
  state.cash -= h.cost; state.safehouses[loc] = true; state.capacity += h.capacity;
  sndGood(); addLog(`Bought a safehouse in ${loc}. Capacity +${h.capacity}.`); render();
}
function useSafehouse() {
  const h = safehouseFor(state.location);
  if (!h || !hasSafehouse(state.location)) return;
  recoverHealth(h.recovery, "Safehouse recovery"); recoverEnergy(h.energy, "Safehouse rest");
  state.heat = Math.max(0, state.heat - h.heatCut);
  addLog(`Safehouse reset: heat -${h.heatCut}%.`); render();
}

const BUSINESS_MANAGERS = [

  { id:"accountant", name:"ACCOUNTANT", cost:6000, incomeShield:0.15, desc:"Protects 15% of business income from bad days" }
];
const EMPIRE_LEVELS = [
  { name:"OWNER", min:1, max:1 },
  { name:"OPERATOR", min:2, max:3 },
  { name:"BOSS", min:4, max:5 },
  { name:"TYCOON", min:6, max:6 },
  { name:"EMPIRE", min:7, max:99 }
];

function businessOwned(id) { return !!(state.businesses && state.businesses[id]); }
function businessCount() { return Object.keys(state.businesses || {}).length; }
function businessLevel() {
  const n = businessCount();
  return (EMPIRE_LEVELS.find(x => n >= x.min && n <= x.max) || EMPIRE_LEVELS[EMPIRE_LEVELS.length-1]).name;
}
function businessCondition(id) {
  return Math.max(0, Math.min(100, Math.round(state.businesses?.[id]?.condition ?? 100)));
}
function businessManager(id) { return state.businesses?.[id]?.manager || null; }
function businessIncome(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || !businessOwned(id)) return 0;
  const conditionMult = 0.5 + businessCondition(id) / 200;
  const mgr = BUSINESS_MANAGERS.find(x => x.id === businessManager(id));
  const managerMult = mgr?.incomeMult || 0;
  const hqBoost = businessOwned("hq") ? 1.10 : 1;
  return Math.round(b.income * conditionMult * (1 + managerMult) * hqBoost);
}
function businessDailyIncome() {
  return BUSINESSES.reduce((sum,b) => sum + businessIncome(b.id), 0);
}
function businessMaintenanceCost(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || !businessOwned(id)) return 0;
  return Math.max(100, Math.round(b.cost * 0.025));
}
function businessEmpireValue() {
  return BUSINESSES.reduce((sum,b) => sum + (businessOwned(b.id) ? b.cost : 0), 0);
}
function empireManagerCost(id) {
  const b = state.businesses?.[id];
  if (!b) return 0;
  const current = b.manager;
  return current ? 0 : 0;
}
function businessCanBuy(b) {
  if (!b || businessOwned(b.id)) return false;
  if (b.empire && businessCount() < 6) return false;
  return state.cash >= b.cost;
}
function buyBusiness(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || businessOwned(id)) return;
  if (b.empire && businessCount() < 6) {
    sndFail(); addLog("HQ requires 6 other businesses first."); render(); return;
  }
  if (state.cash < b.cost) {
    sndFail(); addLog(`Not enough cash for ${b.name}.`); render(); return;
  }
  state.cash -= b.cost;
  state.businesses[id] = { condition:100, purchasedDay:state.day, manager:null };
  state.stats.businessesBought = (state.stats.businessesBought || 0) + 1;
  sndGood();
  addLog(`Opened ${b.name} in ${b.location} for $${b.cost.toLocaleString()}.`);
  render();
}
function maintainBusiness(id) {
  const b = BUSINESSES.find(x => x.id === id);
  if (!b || !businessOwned(id)) return;
  const cost = businessMaintenanceCost(id);
  if (state.cash < cost) {
    sndFail(); addLog(`Not enough cash to maintain ${b.name}.`); render(); return;
  }
  state.cash -= cost;
  state.businesses[id].condition = Math.min(100, businessCondition(id) + 25);
  state.stats.businessMaintenance = (state.stats.businessMaintenance || 0) + cost;
  sndGood();
  addLog(`${b.name} maintenance complete. Condition +25%.`);
  render();
}
function hireBusinessManager(id, managerId) {
  const b = BUSINESSES.find(x => x.id === id);
  const mgr = BUSINESS_MANAGERS.find(x => x.id === managerId);
  if (!b || !mgr || !businessOwned(id)) return;
  if (state.businesses[id].manager === managerId) return;
  if (state.cash < mgr.cost) {
    sndFail(); addLog(`Not enough cash to hire a ${mgr.name}.`); render(); return;
  }
  state.cash -= mgr.cost;
  state.businesses[id].manager = managerId;
  state.stats.managersHired = (state.stats.managersHired || 0) + 1;
  sndGood();
  addLog(`Hired ${mgr.name} for ${b.name}.`);
  render();
}
function resolveBusinessAttack() {
  const owned = BUSINESSES.filter(b => businessOwned(b.id));
  if (!owned.length) return;
  const pressure = Math.max(0, ...Object.values(state.rivalPressure || {}));
  if (pressure < 60) return;
  const chance = Math.min(0.16, 0.04 + pressure / 1200);
  if (Math.random() >= chance) return;
  const target = owned[Math.floor(Math.random() * owned.length)];
  const entry = state.businesses[target.id];
  const damage = 8 + Math.floor(Math.random() * 8);
  entry.condition = Math.max(0, businessCondition(target.id) - damage);
  state.heat = Math.min(100, state.heat + 3);
  if (state.stats) state.stats.businessesHit = (state.stats.businessesHit || 0) + 1;
  sndBad();
  addLog(`Rivals hit ${target.name}. Condition -${damage}%.`);
}

function businessDailyTick() {
  if (!state.businesses) return;
  resolveBusinessAttack();
  let gross = 0;
  let maintenance = 0;
  Object.keys(state.businesses).forEach(id => {
    const b = BUSINESSES.find(x => x.id === id);
    if (!b) return;
    const entry = state.businesses[id];
    const mgr = BUSINESS_MANAGERS.find(x => x.id === entry.manager);
    const loss = mgr?.conditionLoss ?? 1.5;
    entry.condition = Math.max(0, businessCondition(id) - loss);
    gross += businessIncome(id);
    if (b.heatCut) state.heat = Math.max(0, state.heat - b.heatCut);
    if (b.trust) {
      LOCATIONS.forEach(loc => {
        (CONTACTS[loc] || []).forEach(c => gainContactTrust(loc, c.role, b.trust));
      });
    }
    if (b.rivalCut) {
      Object.keys(state.rivalPressure || {}).forEach(k => state.rivalPressure[k] = Math.max(0, state.rivalPressure[k] - b.rivalCut));
    }
    if (b.recovery) recoverHealth(b.recovery, `${b.name} recovery`);
    if (b.energy) recoverEnergy(b.energy, `${b.name} rest`);
    if (mgr?.trustBonus) {
      LOCATIONS.forEach(loc => {
        (CONTACTS[loc] || []).forEach(c => gainContactTrust(loc, c.role, mgr.trustBonus));
      });
    }
    if (mgr?.rivalCut) {
      Object.keys(state.rivalPressure || {}).forEach(k => state.rivalPressure[k] = Math.max(0, state.rivalPressure[k] - mgr.rivalCut));
    }
  });
  if (gross > 0) {
    const pressure = Math.max(0, ...Object.values(state.rivalPressure || {}));
    const badDayLoss = pressure >= 50 ? Math.round(gross * Math.min(0.12, pressure / 1000)) : 0;
    const accountantOwned = Object.values(state.businesses).some(x => x.manager === "accountant");
    const protectedLoss = accountantOwned ? Math.round(badDayLoss * 0.15) : 0;
    const payout = Math.max(0, gross - badDayLoss + protectedLoss);
    state.cash += payout;
    state.stats.businessIncome = (state.stats.businessIncome || 0) + payout;
    if (badDayLoss > 0) {
      addLog(`Rival pressure cost the empire $${badDayLoss.toLocaleString()} in business income${accountantOwned ? ` — accountant protected $${protectedLoss.toLocaleString()}` : ''}.`);
    }
    addLog(`Businesses generated +$${payout.toLocaleString()} today.`);
  }
}
// ---- Neighborhood Influence 1.0 ----
function neighborhoodInfluence(loc) {
  if (!loc) return 0;
  let score = 0;
  if (state.territories?.[loc]) score += 35;
  const localBusinesses = BUSINESSES.filter(b => businessOwned(b.id) && b.location === loc);
  score += Math.min(30, localBusinesses.length * 15);
  const contacts = CONTACTS[loc] || [];
  const trustAvg = contacts.length ? contacts.reduce((sum, c) => sum + trustOf(loc, c.role), 0) / contacts.length : 0;
  score += Math.min(25, trustAvg * 0.25);
  score -= Math.min(20, (state.rivalPressure?.[loc] || 0) * 0.20);
  score -= Math.min(10, (state.heat || 0) * 0.05);
  return Math.max(0, Math.min(100, Math.round(score)));
}
function influenceTier(score) {
  if (score >= 80) return 'DOMINANT';
  if (score >= 60) return 'POWERFUL';
  if (score >= 40) return 'ESTABLISHED';
  if (score >= 20) return 'PRESENCE';
  return 'UNKNOWN';
}
function influenceBar(score) {
  const n = Math.max(0, Math.min(10, Math.round(score / 10)));
  return `<span class="stat-bars">${Array.from({length:10}, (_,i) => `<i class="${i<n ? 'on-market' : ''}"></i>`).join('')}</span>`;
}
function strongestInfluenceLocation() {
  return LOCATIONS.reduce((best, loc) => neighborhoodInfluence(loc) > neighborhoodInfluence(best) ? loc : best, LOCATIONS[0]);
}
function renderInfluenceCard() {
  const strongest = strongestInfluenceLocation();
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;font-weight:bold;"><span>🗺️ NEIGHBORHOOD INFLUENCE</span><span>${strongest ? strongest.toUpperCase() : '—'}</span></div>
    <div style="font-size:.7rem;color:var(--muted);margin:5px 0 9px;">Territories, businesses, contact trust, rival pressure and heat all shape your influence.</div>
    ${LOCATIONS.map(loc => {
      const score = neighborhoodInfluence(loc);
      return `<div style="margin:7px 0;"><div style="display:flex;justify-content:space-between;font-size:.7rem;"><span>${loc}</span><span>${score}% · ${influenceTier(score)}</span></div><div style="margin-top:3px;">${influenceBar(score)}</div></div>`;
    }).join('')}
  </div>`;
}

  LOCATIONS = computeLocations();
  state = saved;
  // Backward-compatible migration for older STREETLINE saves.
  state.maxHealth = state.maxHealth || 100;
  state.health = Math.max(0, Math.min(state.maxHealth, state.health ?? state.maxHealth));
  state.maxEnergy = state.maxEnergy || (state.perkId === "runner" ? 120 : 100);

  state.health = Math.max(0, Math.min(state.maxHealth, state.health));

function healthPct() {
  const max = state.maxHealth || 100;
  return Math.max(0, Math.min(100, Math.round(((state.health ?? max) / max) * 100)));
}

function healthClass() {
  const hp = healthPct();
  return hp <= 25 ? "danger" : hp <= 50 ? "warn" : "";
}

function recoverHealth(amount, reason) {
  const max = state.maxHealth || 100;
  const before = state.health ?? max;
  state.health = Math.min(max, before + Math.max(0, amount));
  const healed = state.health - before;
  if (healed > 0 && reason) addLog(`${reason} +${healed} HP.`);
  return healed;
}

function damageHealth(amount, reason) {
  const max = state.maxHealth || 100;
  const before = state.health ?? max;
  const perkCut = state.perkId === "iron" ? 0.15 : 0;
  const reduced = Math.max(0, amount * (1 - perkCut) * (1 - armorReduction()));
  state.health = Math.max(0, Math.round(before - reduced));
  const damage = before - state.health;
  state.stats.damageTaken = (state.stats.damageTaken || 0) + damage;
  if (damage > 0) addLog(`${reason} -${damage} HP.`);
  if (state.health <= 0 && !state.over) {
    state.health = 0;
    state.pendingEvent = { type: "hospital", cause: reason };
    sndBad();
    return true;
  }
  return false;
}

function rollPrices(loc) {
  state.prices[loc] = {};
  const mod = LOCATION_MODS[loc] || { priceMult: 1, volMult: 1 };
  DRUGS.forEach(d => {
    const vol = d.vol * mod.volMult;
    const swing = 1 + (Math.random() * 2 - 1) * vol;
    let price = Math.max(4, Math.round(d.base * mod.priceMult * swing));
    if (Math.random() < 0.12) {
      const spike = Math.random() < 0.5 ? 2.4 : 0.35;
      price = Math.round(price * spike);
      if (!state._spikeNote) state._spikeNote = [];
      state._spikeNote.push(`${d.name} ${spike > 1 ? "spiked" : "crashed"} in ${loc}`);
    }
    state.prices[loc][d.key] = price;
  });
}

function addLog(msg) {
  state.log.unshift(msg);
  state.log = state.log.slice(0, 6);
}

function invUsed() {
  return Object.values(state.inventory).reduce((a,b) => a+b, 0);
}

function netWorth() {
  const stock = DRUGS.reduce((sum,d) => sum + d.base * state.inventory[d.key], 0);
  return state.cash + state.bank + Math.round(stock*0.4) - state.debt;
}

function nameOf(key) { return DRUGS.find(d => d.key === key).name; }

// ---- Contacts / trust ----
function contactKey(loc, role) { return loc + "::" + role; }
function contactOf(loc, role) { return (CONTACTS[loc] || []).find(c => c.role === role); }
function trustOf(loc, role) { return state.contactTrust[contactKey(loc, role)] || 0; }
function gainContactTrust(loc, role, amt) {
  const k = contactKey(loc, role);
  state.contactTrust[k] = Math.min(100, (state.contactTrust[k] || 0) + amt);
}
function bumpAllContacts(loc, amt) {
  (CONTACTS[loc] || []).forEach(c => gainContactTrust(loc, c.role, amt));
}
function tierIndex(trust) { return Math.min(4, Math.floor(trust / 25)); }
function tierWord(trust) { return TIER_WORDS[tierIndex(trust)]; }
function contactMilestones(trust) { return [25,50,75,100].map(v => trust >= v); }
function favorReady(loc, role) {
  const trust = trustOf(loc, role);
  const last = state.contactFavorUsedDay[contactKey(loc, role)];
  return trust >= 50 && (last === undefined || (state.day - last) >= 5);
}
function callInFavor(loc, role) {
  const c = contactOf(loc, role);
  if (!c) return;
  const k = contactKey(loc, role);
  if (trustOf(loc, role) < 50) { sndFail(); addLog(`${c.name} says you need more trust first.`); render(); return; }
  if (!favorReady(loc, role)) { sndFail(); addLog(`${c.name}'s favor isn't ready yet.`); render(); return; }
  state.contactFavorUsedDay[k] = state.day;
  state.contactFavors[k] = (state.contactFavors[k] || 0) + 1;
  recoverEnergy(15, `${c.name}'s favor`);
  recoverHealth(5, `${c.name}'s favor`);
  sndGood();
  addLog(`${c.name} came through. +15 Energy and +5 Health.`);
  render();
}

function talkTo(loc, role) {
  // Defensive init keeps this working with older saved games too.
  state.talkedDay = state.talkedDay || {};
  state.dealsSinceTalk = state.dealsSinceTalk || {};
  state.contactTrust = state.contactTrust || {};

  const c = contactOf(loc, role);
  if (!c) {
    addLog("That contact isn't available in this location.");
    render();
    return;
  }

  const k = contactKey(loc, role);
  if (state.talkedDay[k] === state.day) {
    addLog(`${c.name} has nothing new for you today.`);
    render();
    return;
  }

  gainContactTrust(loc, role, 8);
  state.talkedDay[k] = state.day;
  state.dealsSinceTalk[loc] = 0;
  addLog(`Caught up with ${c.name}. +8 Trust.`);
  render();
  // Sound is optional; never let audio prevent the contact action from rendering.
  try { sndClick(); } catch (e) {}
}

// Expose contact action explicitly for mobile browsers and inline button handlers.
window.talkTo = talkTo;

function getBuyPrice(key) {
  const base = state.prices[state.location][key];
  const t = trustOf(state.location, "market") / 100;
  return Math.max(1, Math.round(base * (1 - 0.15 * t) * rivalMarketMult(state.location, "buy")));
}
function getSellPrice(key) {
  const base = state.prices[state.location][key];
  const t = trustOf(state.location, "market") / 100;
  return Math.max(1, Math.round(base * (1 + 0.10 * t) * rivalMarketMult(state.location, "sell")));
}
function priceLevel(key) {
  const base = state.prices[state.location][key];
  const mod = LOCATION_MODS[state.location] || { priceMult: 1 };
  const typical = DRUGS.find(d => d.key === key).base * mod.priceMult;
  const ratio = base / typical;
  if (ratio < 0.85) return { word: "LOW", cls: "tag-low" };
  if (ratio > 1.15) return { word: "HIGH", cls: "tag-high" };
  return { word: "FAIR", cls: "tag-fair" };
}

// ---- quantity / amount setters (inline, no modal) ----
function setQty(n) {
  n = Math.max(1, Math.floor(Number(n)) || 1);
  state.qty = n;
  render();
}
function stepQty(delta) { setQty(state.qty + delta); }

function setBankAmt(n) {
  n = Math.max(0, Math.floor(Number(n)) || 0);
  state.bankAmt = n;
  render();
}
function setDebtAmt(n) {
  n = Math.max(0, Math.floor(Number(n)) || 0);
  state.debtAmt = n;
  render();
}

function buy(key) {
  const qty = state.qty;
  const price = getBuyPrice(key);
  const cost = price * qty;
  if (qty <= 0) return;
  if (invUsed() + qty > stashCapacity()) { sndFail(); addLog("Not enough room in the stash."); render(); return; }
  if (cost > state.cash) { sndFail(); addLog("Not enough cash."); render(); return; }
  state.cash -= cost;
  state.inventory[key] += qty;
  const loc = state.location;
  const heatMult = (LOCATION_MODS[loc] || {}).heatMult ?? 1;
  const muscleCut = 1 - 0.3 * (trustOf(loc, "muscle") / 100);
  state.heat = Math.min(100, state.heat + qty * 0.4 * heatMult * muscleCut);
  bumpAllContacts(loc, 1);
  state.dealsSinceTalk[loc] = (state.dealsSinceTalk[loc] || 0) + 1;
  rivalBump(loc, Math.min(4, Math.max(1, Math.ceil(qty / 5))));
  state.stats.totalSpent += cost;
  sndBuy();
  addLog(`Bought ${qty} ${localName(key)} for $${cost.toLocaleString()}.`);
  render();
}

function sell(key) {
  let qty = Math.min(state.qty, state.inventory[key]);
  if (qty <= 0) { sndFail(); addLog(`You don't have any ${nameOf(key)} to sell.`); render(); return; }
  const price = getSellPrice(key);
  const total = price * qty;
  state.inventory[key] -= qty;
  state.cash += total;
  bumpAllContacts(state.location, 1);
  state.dealsSinceTalk[state.location] = (state.dealsSinceTalk[state.location] || 0) + 1;
  rivalBump(state.location, Math.min(3, Math.max(1, Math.ceil(qty / 5))));
  state.stats.totalRevenue += total;
  sndSell();
  addLog(`Sold ${qty} ${localName(key)} for $${total.toLocaleString()}.`);
  render();
}

function bankDeposit() {
  const amt = Math.min(state.bankAmt, state.cash);
  if (amt <= 0) { sndFail(); addLog("Nothing to deposit."); render(); return; }
  state.cash -= amt;
  state.bank += amt;
  sndClick();
  addLog(`Stashed $${amt.toLocaleString()} in the bank.`);
  render();
}
function bankWithdraw() {
  const amt = Math.min(state.bankAmt, state.bank);
  if (amt <= 0) { sndFail(); addLog("Nothing to withdraw."); render(); return; }
  state.bank -= amt;
  state.cash += amt;
  sndClick();
  addLog(`Pulled $${amt.toLocaleString()} from the bank.`);
  render();
}
function payDebt() {
  const amt = Math.min(state.debtAmt, state.cash, state.debt);
  if (amt <= 0) { sndFail(); addLog("Nothing to pay."); render(); return; }
  state.cash -= amt;
  state.debt -= amt;
  sndClick();
  addLog(`Paid down $${amt.toLocaleString()} of debt.`);
  render();
}

function bagUpgradeCost() { return 400 + state.capacityLevel * 300; }
function upgradeBag() {
  const cost = bagUpgradeCost();
  if (state.cash < cost) { sndFail(); addLog("Not enough cash to upgrade the bag."); render(); return; }
  state.cash -= cost;
  state.capacityLevel++;
  state.capacity += 20;
  sndGood();
  addLog(`Upgraded the stash bag. Capacity now ${state.capacity}.`);
  render();
}


// ---- Rival System ----
const RIVALS = [
  { id:"boardwalk", name:"BOARDWALK SYNDICATE", home:"Downtown", style:"High-market pressure", power:72 },
  { id:"venice", name:"VENICE CIRCLE", home:"Venice Park", style:"Territory pressure", power:66 },
  { id:"park", name:"PARK CREW", home:"Bungalow Park", style:"Low-cost pressure", power:54 },
  { id:"maryland", name:"MARYLAND SET", home:"Back Maryland", style:"Volatile-market pressure", power:61 },
  { id:"carver", name:"CARVER COLLECTIVE", home:"Carver Hall", style:"Quiet pressure", power:48 },
];
function rivalFor(loc) {
  return RIVALS.find(r => r.home === loc) || RIVALS[Math.max(0, LOCATIONS.indexOf(loc)) % RIVALS.length];
}
function rivalPressureFor(loc) {
  const r = rivalFor(loc);
  return Math.max(0, Math.min(100, Number((state.rivalPressure || {})[r.id] || 0)));
}
function rivalStatus(p) {
  if (p < 20) return "QUIET";
  if (p < 45) return "WATCHING";
  if (p < 70) return "ACTIVE";
  return "HOT";
}
function rivalMarketMult(loc, side) {
  const p = rivalPressureFor(loc);
  if (p < 45) return 1;
  const amount = Math.min(0.08, (p - 40) * 0.002);
  return side === "buy" ? 1 + amount : 1 - amount;
}
function rivalBump(loc, amount) {
  const r = rivalFor(loc);
  if (!state.rivalPressure) state.rivalPressure = {};
  state.rivalPressure[r.id] = Math.max(0, Math.min(100, (state.rivalPressure[r.id] || 0) + amount));
}
function rivalCool(loc, amount) {
  const r = rivalFor(loc);
  if (!state.rivalPressure) state.rivalPressure = {};
  state.rivalPressure[r.id] = Math.max(0, (state.rivalPressure[r.id] || 0) - amount);
}
function checkRivalEvent() {
  if (state.pendingEvent || state.over || state.day < 4) return false;
  const p = rivalPressureFor(state.location);
  if (p < 35 || Math.random() >= Math.min(0.18, 0.03 + p * 0.0015)) return false;
  const rival = rivalFor(state.location);
  state.pendingEvent = { type:"rival", rivalId:rival.id, rivalName:rival.name, style:rival.style, pressure:p };
  state.stats.rivalEncounters = (state.stats.rivalEncounters || 0) + 1;
  sndBad();
  return true;
}
function resolveRival(choice) {
  const ev = state.pendingEvent;
  if (!ev || ev.type !== "rival") return;
  const loc = state.location;
  const rival = rivalFor(loc);
  const p = rivalPressureFor(loc);
  if (choice === "negotiate") {
    const fee = Math.min(state.cash, 150 + Math.round(p * 2));
    state.cash -= fee; rivalCool(loc, 25); state.heat = Math.max(0, state.heat - 3);
    state.stats.rivalNegotiated = (state.stats.rivalNegotiated || 0) + 1;
    sndGood(); addLog(`You negotiated with ${rival.name}. Pressure drops and the market cools off.`);
  } else if (choice === "laylow") {
    const energy = Math.min(10, state.energy || 0);
    spendEnergy(energy, "Laying low"); state.stats.energySpent = (state.stats.energySpent || 0) + energy;
    rivalCool(loc, 18); state.heat = Math.max(0, state.heat - 8);
    state.stats.rivalAvoided = (state.stats.rivalAvoided || 0) + 1;
    sndClick(); addLog(`You kept a low profile. ${rival.name} loses interest for now.`);
  } else if (choice === "compete") {
    const chance = Math.max(0.35, 0.72 - rival.power / 250 + (state.perkId === "hustler" ? 0.08 : 0));
    const success = Math.random() < chance;
    state.stats.rivalChallenges = (state.stats.rivalChallenges || 0) + 1;
    if (success) {
      rivalCool(loc, 12); state.cash += 250; state.heat = Math.min(100, state.heat + 2);
      sndGood(); addLog(`You held your market position. +$250 and rival pressure eases.`);
    } else {
      rivalBump(loc, 12); state.cash = Math.max(0, state.cash - Math.min(state.cash, 175));
      state.heat = Math.min(100, state.heat + 7);
      sndBad(); addLog(`The market pushed back. You lost some cash and rival pressure rises.`);
    }
  }
  state.pendingEvent = null;
  render();
}

// ---- Weapons / protection (affects gang fight outcomes) ----
const WEAPONS = [
  { name: "Unarmed", cost: 0,    winBonus: 0,    takeMult: 1.0, lossMult: 1.0 },
  { name: "Knife",   cost: 600,  winBonus: 0.10, takeMult: 1.1, lossMult: 0.9 },
  { name: "Pistol",  cost: 1500, winBonus: 0.20, takeMult: 1.25, lossMult: 0.75 },
  { name: "Strap",   cost: 3000, winBonus: 0.30, takeMult: 1.5,  lossMult: 0.6 },
];
function armorName() { return ["None", "Light Vest", "Reinforced Vest", "Heavy Vest"][state.armorLevel || 0] || "Heavy Vest"; }
function armorCost() { return [700, 1400, 2600][state.armorLevel || 0] || null; }
function upgradeArmor() {
  if ((state.armorLevel || 0) >= 3) { addLog("Armor is already maxed."); render(); return; }
  const cost = armorCost();
  if (state.cash < cost) { sndFail(); addLog(`Not enough cash for ${armorName()} upgrade.`); render(); return; }
  state.cash -= cost; state.armorLevel++; sndGood(); addLog(`Upgraded protection to ${armorName()} — damage reduced ${Math.round(armorReduction()*100)}%.`); render();
}
function currentWeapon() { return WEAPONS[state.weaponLevel] || WEAPONS[0]; }
function nextWeapon() { return WEAPONS[state.weaponLevel + 1] || null; }
function upgradeWeapon() {
  const next = nextWeapon();
  if (!next) { addLog("Already carrying the best protection there is."); render(); return; }
  if (state.cash < next.cost) { sndFail(); addLog("Not enough cash for that piece."); render(); return; }
  state.cash -= next.cost;
  state.weaponLevel++;
  sndGood();
  addLog(`Picked up a ${next.name}. Better odds if it comes to a fight.`);
  render();
}

// ---- Territory ownership (claim a town, pay upkeep, risk drops the longer you hold it) ----
const TERRITORY_COST = 1000;
const TERRITORY_UPKEEP = 150;
function territoryHeldDays(loc) {
  const t = state.territories[loc];
  return t ? Math.max(0, state.day - t.claimedDay) : 0;
}
function territoryRiskCut(loc) {
  if (!state.territories[loc]) return 1;
  return 1 - Math.min(0.3, territoryHeldDays(loc) * 0.02);
}
function claimTerritory(loc) {
  if (state.territories[loc]) return;
  if (state.cash < TERRITORY_COST) { sndFail(); addLog("Not enough cash to claim this territory."); render(); return; }
  state.cash -= TERRITORY_COST;
  state.territories[loc] = { claimedDay: state.day };
  rivalBump(loc, 12);
  sndGood();
  addLog(`Claimed ${loc} as your territory. Upkeep $${TERRITORY_UPKEEP} every 5 days.`);
  render();
}

function territoryDefenseLevel(loc) {
  return Math.max(0, Math.min(3, Number(state.territoryDefense?.[loc] || 0)));
}
function reinforceTerritory(loc) {
  if (!state.territories?.[loc]) return;
  const level = territoryDefenseLevel(loc);
  if (level >= 3) { addLog(`${loc} is already fully reinforced.`); render(); return; }
  const cost = 750 + level * 750;
  if (state.cash < cost) { sndFail(); addLog(`Not enough cash to reinforce ${loc}.`); render(); return; }
  state.cash -= cost;
  state.territoryDefense[loc] = level + 1;
  state.stats.territoryReinforced = (state.stats.territoryReinforced || 0) + 1;
  rivalCool(loc, 5);
  sndGood();
  addLog(`Reinforced ${loc}. Defense level ${level + 1}/3.`);
  render();
}
function checkTerritoryDispute() {
  if (state.pendingEvent || state.over || state.day < 5) return false;
  const loc = state.location;
  if (!state.territories?.[loc]) return false;
  const pressure = rivalPressureFor(loc);
  if (pressure < 55) return false;
  const defense = territoryDefenseLevel(loc);
  const chance = Math.max(0.015, Math.min(0.12, 0.035 + (pressure - 50) * 0.0015 - defense * 0.012));
  if (Math.random() >= chance) return false;
  const rival = rivalFor(loc);
  state.pendingEvent = { type:'territory', loc, rivalId:rival.id, rivalName:rival.name, pressure, defense };
  state.stats.territoryDisputes = (state.stats.territoryDisputes || 0) + 1;
  sndBad();
  return true;
}
function resolveTerritory(choice) {
  const ev = state.pendingEvent;
  if (!ev || ev.type !== 'territory') return;
  const loc = ev.loc;
  const defense = territoryDefenseLevel(loc);
  const pressure = rivalPressureFor(loc);
  if (!state.territories?.[loc]) { state.pendingEvent = null; render(); return; }
  if (choice === 'negotiate') {
    const fee = Math.min(state.cash, 200 + Math.round(pressure * 3));
    state.cash -= fee; rivalCool(loc, 30); state.heat = Math.max(0, state.heat - 4);
    addLog(`You negotiated over ${loc}. Paid $${fee.toLocaleString()} and cooled the dispute.`);
    sndGood();
  } else if (choice === 'reinforce') {
    const cost = 500 + defense * 500;
    if (state.cash < cost) { addLog(`Not enough cash to reinforce ${loc} right now.`); render(); return; }
    state.cash -= cost;
    state.territoryDefense[loc] = Math.min(3, defense + 1);
    rivalCool(loc, 12 + defense * 4);
    state.heat = Math.min(100, state.heat + 1);
    state.stats.territoryReinforced = (state.stats.territoryReinforced || 0) + 1;
    addLog(`You reinforced ${loc}. Defense is now ${territoryDefenseLevel(loc)}/3.`);
    sndGood();
  } else if (choice === 'hold') {
    const chance = Math.min(0.92, 0.55 + defense * 0.10 + territoryHeldDays(loc) * 0.005 - Math.max(0, pressure - 55) * 0.003);
    if (Math.random() < chance) {
      rivalCool(loc, 22); state.heat = Math.min(100, state.heat + 2);
      state.stats.territoryWins = (state.stats.territoryWins || 0) + 1;
      addLog(`You held ${loc}. Rival pressure drops.`); sndGood();
    } else {
      delete state.territories[loc];
      delete state.territoryDefense[loc];
      rivalBump(loc, 8); state.heat = Math.min(100, state.heat + 6);
      state.stats.territoryLosses = (state.stats.territoryLosses || 0) + 1;
      addLog(`You lost control of ${loc}. The territory is gone.`); sndBad();
    }
  }
  state.pendingEvent = null;
  render();
}

function rest() {
  if (!state || state.over || state.pendingEvent) return;
  const before = state.energy ?? (state.maxEnergy || 100);
  if (before >= (state.maxEnergy || 100)) {
    sndFail();
    addLog("Energy is already full.");
    render();
    return;
  }
  recoverEnergy(50, "REST");
  advanceDay();
  render();
}

function travel(loc) {
  if (loc === state.location) return;
  if (state.pendingEvent || state.over) return;
  const cost = Math.ceil(vehicleEnergyCost() / vehicleConditionMult());
  const energy = state.energy ?? (state.maxEnergy || 100);
  if (energy < cost) {
    sndFail();
    addLog(`Not enough Energy to travel. REST to recover +50 Energy.`);
    render();
    return;
  }
  spendEnergy(cost, "Travel");
  state.stats.energySpent = (state.stats.energySpent || 0) + cost;
  damageVehicle(2 + Math.floor(Math.random() * 3));
  state.location = loc;
  state.locationsVisited = state.locationsVisited || [];
  if (!state.locationsVisited.includes(loc)) state.locationsVisited.push(loc);
  advanceDay();
  render();
}

function advanceDay() {
  state.day++;
  delete state._spikeNote;
  state.maxCash = Math.max(state.maxCash || 0, state.cash || 0);
  state.maxHeat = Math.max(state.maxHeat || 0, state.heat || 0);
  state.maxHealthReached = Math.max(state.maxHealthReached || 0, state.health || 0);
  const previous = { health: state.health, energy: state.energy, heat: state.heat, cash: state.cash, bank: state.bank, debt: state.debt };
  const energyRest = 5;
  recoverEnergy(energyRest, "A night's rest");
  if (state.health < (state.maxHealth || 100)) {
    recoverHealth(5, "A night's rest puts you back on your feet.");
  }
  businessDailyTick();
  if (state.perkId === "ghost") state.heat = Math.max(0, state.heat - 8);
  else state.heat = Math.max(0, state.heat - 4);
  LOCATIONS.forEach(l => rollPrices(l));
  Object.keys(state.rivalPressure || {}).forEach(id => { state.rivalPressure[id] = Math.max(0, state.rivalPressure[id] - 3); });
  sndTravel();
  state.netWorthHistory.push({ day: state.day, nw: netWorth() });
  state.daySummary = {
    day: state.day - 1, cash: state.cash - previous.cash, health: state.health - previous.health,
    energy: state.energy - previous.energy, heat: state.heat - previous.heat, nw: netWorth()
  };

  if (state.day % 5 === 0) {
    const interest = Math.round(state.debt * 0.1);
    state.debt += interest;
    state.stats.totalInterestPaid += interest;
    addLog(`The loan shark's crew adds $${interest.toLocaleString()} interest. Debt: $${state.debt.toLocaleString()}.`);

    Object.keys(state.territories).forEach(loc => {
      const total = TERRITORY_UPKEEP;
      if (state.cash >= total) {
        state.cash -= total;
        addLog(`Paid $${total.toLocaleString()} upkeep on ${loc}.`);
      } else if (state.cash + state.bank >= total) {
        const fromBank = total - state.cash;
        state.bank -= fromBank;
        state.cash = 0;
        addLog(`Paid $${total.toLocaleString()} upkeep on ${loc} (dipped into the bank).`);
      } else {
        delete state.territories[loc];
        sndBad();
        addLog(`Lost control of ${loc} — couldn't cover the upkeep.`);
      }
    });
  }

  if (state.day > state.maxDays) {
    state.over = true;
    const nw = netWorth();
    (nw >= 0 ? sndGood : sndBad)();
    state.justUnlocked = nw >= 0 ? unlockNextTown() : null;
    clearSave();
    render();
    return;
  }

  if (state.heat >= 90) {
    state.wantedStreak = (state.wantedStreak || 0) + 1;
  } else {
    state.wantedStreak = 0;
  }
  if (state.wantedStreak >= 3 && state.bank > 0) {
    const seized = Math.round(state.bank * 0.25);
    state.bank -= seized;
    state.heat = Math.max(0, state.heat - 40);
    state.wantedStreak = 0;
    sndBad();
    addLog(`You're too hot. Cops raided your bank account and took $${seized.toLocaleString()}.`);
  }

  if (state.mission && state.day > state.mission.expires) { addLog(`${state.mission.contact}'s job expired.`); state.stats.missionsFailed = (state.stats.missionsFailed||0) + 1; state.mission = null; }
  generateMission();
  if (!state.pendingEvent && Math.random() < 0.10) {
    const streetEvents = [
      { title: "⚠ STREET PROBLEM", text: "Someone outside the spot recognizes you and starts asking questions.", a: "WALK AWAY", b: "PAY $75", kind: "questions" },
      { title: "⚠ LOST WALLET", text: "You spot a wallet on the sidewalk. Nobody seems to be watching.", a: "LEAVE IT", b: "TAKE THE RISK", kind: "wallet" },
      { title: "⚠ CLOSED BLOCK", text: "A block ahead is shut down. You can wait it out or take a rough shortcut.", a: "WAIT", b: "SHORTCUT", kind: "block" }
    ];
    state.pendingEvent = { type: "street", ...streetEvents[Math.floor(Math.random()*streetEvents.length)] };
    sndClick();
  }
  if (checkTerritoryDispute()) { render(); return; }
  if (checkRivalEvent()) { render(); return; }

  const dealsSince = state.dealsSinceTalk[state.location] || 0;
  const snitchThreshold = 12;
  const snitchChance = dealsSince > snitchThreshold ? Math.min(0.35, (dealsSince - snitchThreshold) * 0.02) : 0;
  if (Math.random() < snitchChance) {
    const contacts = CONTACTS[state.location] || [];
    const snitch = contacts[Math.floor(Math.random() * contacts.length)];
    state.pendingEvent = { type: "snitch", name: snitch ? snitch.name : "someone close to you", demand: Math.round(150 + state.cash * 0.15) };
    sndBad();
    render();
    return;
  }

  const mod = LOCATION_MODS[state.location] || { policeMult: 1, gangMult: 1 };
  const connectorCut = 1 - 0.3 * (trustOf(state.location, "connector") / 100);
  const territoryCut = territoryRiskCut(state.location);
  const policeChance = 0.16 * mod.policeMult * connectorCut * territoryCut;
  const gangChance = 0.14 * mod.gangMult * connectorCut * territoryCut;
  const roll = Math.random();
  if (roll < policeChance) {
    state.pendingEvent = { type: "police" };
    sndPolice();
  } else if (roll < policeChance + gangChance) {
    state.pendingEvent = { type: "gang", demand: Math.round(150 + Math.random()*350 + state.cash*0.1) };
    sndGang();
  } else if (state._spikeNote && state._spikeNote.length) {
    addLog(state._spikeNote[0]);
  }
  render();
}

function resolveStreet(choice) {
  const ev = state.pendingEvent;
  if (!ev) return;
  if (ev.kind === "questions") {
    if (choice === "a") { state.heat = Math.max(0, state.heat - 3); recoverEnergy(2, "Keeping your head down"); addLog("You kept moving and the situation faded behind you."); sndGood(); }
    else { state.cash = Math.max(0, state.cash - 75); state.heat = Math.max(0, state.heat - 8); addLog("You paid to keep things quiet."); sndClick(); }
  } else if (ev.kind === "wallet") {
    if (choice === "a") { state.heat = Math.max(0, state.heat - 1); addLog("You left the wallet where it was. No complications."); sndGood(); }
    else { const found = 40 + Math.floor(Math.random()*160); state.cash += found; state.heat = Math.min(100, state.heat + 4); addLog(`You took the risk and found $${found}. Heat +4%.`); sndClick(); }
  } else if (ev.kind === "block") {
    if (choice === "a") { recoverEnergy(5, "Waiting it out"); addLog("You waited for the block to clear."); sndGood(); }
    else { spendEnergy(8, "Shortcut"); state.stats.energySpent = (state.stats.energySpent||0)+8; state.heat = Math.min(100, state.heat + 5); damageHealth(5, "The shortcut gets rough"); addLog("The shortcut saved time but cost energy and raised heat."); sndBad(); }
  }
  if (state.health > 0) state.pendingEvent = null;
  render();
}

function resolvePolice(choice) {
  const heatFactor = state.heat / 100;
  if (choice === "run") {
    const caught = Math.random() < (0.25 + heatFactor*0.4);
    if (caught) {
      const lostPct = 0.4 + Math.random()*0.3;
      DRUGS.forEach(d => state.inventory[d.key] = Math.floor(state.inventory[d.key]*(1-lostPct)));
      const fine = Math.round(state.cash*0.3);
      state.cash -= fine;
      state.heat = Math.max(0, state.heat - 30);
      state.stats.policeCaught++;
      damageHealth(15, "The checkpoint roughs you up");
      sndBad();
      addLog(`Cops caught you running. Product seized, fined $${fine.toLocaleString()}.`);
    } else {
      state.stats.policeEscaped++;
      sndGood();
      addLog("You slipped past the patrol.");
    }
  } else if (choice === "bribe") {
    const bribe = Math.min(state.cash, Math.round(200 + state.heat*8));
    state.cash -= bribe;
    state.heat = Math.max(0, state.heat - 50);
    state.stats.policeBribed++;
    sndClick();
    addLog(`Paid a $${bribe.toLocaleString()} "toll" to look the other way.`);
  }
  if (state.health > 0) state.pendingEvent = null;
  render();
}

function resolveGang(choice) {
  const ev = state.pendingEvent;
  if (choice === "pay") {
    const amt = Math.min(state.cash, ev.demand);
    state.cash -= amt;
    state.stats.gangPaid++;
    sndClick();
    addLog(`Paid ${amt < ev.demand ? "everything you had — " : ""}$${amt.toLocaleString()} to walk away.`);
  } else if (choice === "run") {
    const escaped = Math.random() < 0.55;
    if (escaped) {
      state.stats.gangEscaped++;
      sndGood();
      addLog("You bolted down an alley and lost them.");
    } else {
      const lostPct = 0.2 + Math.random()*0.3;
      DRUGS.forEach(d => state.inventory[d.key] = Math.floor(state.inventory[d.key]*(1-lostPct)));
      const cashLoss = Math.round(state.cash * 0.25);
      state.cash -= cashLoss;
      state.stats.gangCaught++;
      damageHealth(20, "The ambush leaves you bruised");
      sndBad();
      addLog(`They caught you. Roughed up, took $${cashLoss.toLocaleString()} and some product.`);
    }
  } else if (choice === "fight") {
    const weapon = currentWeapon();
    const win = Math.random() < (0.45 + weapon.winBonus);
    if (win) {
      const take = Math.round((80 + Math.random()*200) * weapon.takeMult);
      state.cash += take;
      state.stats.fightsWon++;
      sndGood();
      addLog(`Won the scrap${weapon.name !== "Unarmed" ? ` with the ${weapon.name}` : ""}, took $${take.toLocaleString()} off them.`);
    } else {
      const cashLoss = Math.round(state.cash * 0.35 * weapon.lossMult);
      state.cash -= cashLoss;
      state.stats.fightsLost++;
      damageHealth(30, "The fight leaves you hurt");
      sndBad();
      addLog(`Lost the fight. Down $${cashLoss.toLocaleString()} and bruised.`);
    }
  }
  if (state.health > 0) state.pendingEvent = null;
  render();
}

function resolveHospital(choice) {
  if (choice === "hospital") {
    const cost = 250;
    if (state.cash < cost) {
      sndFail();
      addLog("You can't afford the hospital. You have to lay low.");
      choice = "laylow";
    } else {
      state.cash -= cost;
      state.health = state.maxHealth || 100;
      state.heat = Math.max(0, state.heat - 10);
      sndGood();
      addLog(`Paid $${cost.toLocaleString()} for treatment. Health restored to ${state.health}.`);
    }
  }
  if (choice === "laylow") {
    state.health = Math.max(60, Math.round((state.maxHealth || 100) * 0.6));
    state.heat = Math.max(0, state.heat - 15);
    sndGood();
    addLog(`You lay low until you're back to ${state.health} HP. Heat cools off.`);
  }
  state.pendingEvent = null;
  render();
}

function resolveSnitch(choice) {
  const ev = state.pendingEvent;
  const loc = state.location;
  if (choice === "payoff") {
    const amt = Math.min(state.cash, ev.demand);
    state.cash -= amt;
    state.heat = Math.max(0, state.heat - 20);
    sndClick();
    addLog(`Paid $${amt.toLocaleString()} to make ${ev.name}'s tip disappear before it reached anyone.`);
  } else {
    const lostPct = 0.35 + Math.random() * 0.25;
    DRUGS.forEach(d => state.inventory[d.key] = Math.floor(state.inventory[d.key] * (1 - lostPct)));
    const fine = Math.round(state.cash * 0.3);
    state.cash -= fine;
    state.stats.policeCaught++;
    damageHealth(10, "The snitch fallout leaves you shaken");
    sndBad();
    addLog(`${ev.name} dropped a dime on you. Cops hit you for $${fine.toLocaleString()} and most of your stash.`);
  }
  // A snitch event means someone in this town's crew already turned once — trust takes a hit.
  (CONTACTS[loc] || []).forEach(c => {
    const k = contactKey(loc, c.role);
    state.contactTrust[k] = Math.max(0, (state.contactTrust[k] || 0) - 15);
  });
  state.dealsSinceTalk[loc] = 0;
  if (state.health > 0) state.pendingEvent = null;
  render();
}

function setView(v) { state.view = v; render(); }

function esc(s) { return String(s); }

function sparklineSVG(history) {
  if (!history || history.length < 2) return "";
  const w = 300, h = 60, pad = 4;
  const values = history.map(pt => pt.nw);
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0);
  const range = (max - min) || 1;
  const stepX = (w - 2 * pad) / (history.length - 1);
  const pts = history.map((pt, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((pt.nw - min) / range) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const last = values[values.length - 1];
  const color = last >= 0 ? "#22c55e" : "#ff6b7d";
  const zeroY = h - pad - ((0 - min) / range) * (h - 2 * pad);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:60px;display:block;">
      <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>
  `;
}

function computeBadges() {
  const s = state.stats || {};
  const nw = netWorth();
  const maxTrust = Math.max(0, ...Object.values(state.contactTrust || {}));
  const badges = [];
  if (nw >= 0) badges.push({ label: "Debt Free", desc: "Ended the run in the black." });
  if (s.policeCaught === 0 && s.gangCaught === 0) badges.push({ label: "Untouchable", desc: "Never once got caught." });
  if (s.totalSpent >= 20000) badges.push({ label: "Big Spender", desc: "Moved $20,000+ in product." });
  if (s.fightsWon >= 3 && s.fightsLost === 0) badges.push({ label: "Sharp Shooter", desc: "Won every fight you had." });
  if (maxTrust >= 100) badges.push({ label: "Maxed Out", desc: "Earned a contact's full trust." });
  if (state.justUnlocked) badges.push({ label: "Trailblazer", desc: `Opened up ${state.justUnlocked}.` });
  if (state.capacityLevel >= 2) badges.push({ label: "Bigger Bag", desc: "Upgraded the stash bag twice or more." });
  return badges;
}

function runAchievements() {
  const s = state.stats || {};
  const nw = netWorth();
  const visited = state.locationsVisited || [state.location];
  const territoryCount = Object.keys(state.territories || {}).length;
  const safehouseCount = Object.keys(state.safehouses || {}).length;
  const maxTrust = Math.max(0, ...Object.values(state.contactTrust || {}));
  return [
    { icon:"💰", label:"BIGGEST BAG", value:`$${(state.maxCash || state.cash || 0).toLocaleString()}`, desc:"Highest cash held during the run." },
    { icon:"📈", label:"MARKET KING", value:`$${Math.max(0, s.totalRevenue - s.totalSpent).toLocaleString()}`, desc:"Trading profit earned." },
    { icon:"🗺️", label:"CITY RUNNER", value:`${visited.length}/${LOCATIONS.length}`, desc:"Different locations visited." },
    { icon:"🏠", label:"NEIGHBORHOOD BOSS", value:`${territoryCount}`, desc:"Territories controlled at the end." },
    { icon:"🤝", label:"CONNECTED", value:`${maxTrust}%`, desc:"Highest contact trust reached." },
    { icon:"⚡", label:"ROAD WARRIOR", value:`${Math.round(s.energySpent || 0)}`, desc:"Energy spent during the run." },
    { icon:"❤️", label:"SURVIVOR", value:`${Math.round(state.health)}/${state.maxHealth || 100}`, desc:"Health remaining at the finish." },
    { icon:"👻", label:"GHOST RUN", value: state.maxHeat < 20 ? "YES" : "NO", desc:"Finished without ever reaching high heat." },
    { icon:"🔥", label:"HEAT MAGNET", value:`${Math.round(state.maxHeat || state.heat || 0)}%`, desc:"Highest heat reached." },
    { icon:"🏆", label:"30-DAY HUSTLE", value:"COMPLETE", desc:"Finished the full 30-day run." },
    { icon:"🏚️", label:"SAFEHOUSE NETWORK", value:`${safehouseCount}`, desc:"Safehouses owned at the end." },
  ];
}

  return `

          <span style="text-align:right;"><b>${a.value}</b><br><span class="muted">${a.desc}</span></span>
        </div>
      `).join("")}
    </div>
    ${badges.length ? `
    <div class="section-label">BADGES EARNED</div>
    <div class="card">
      ${badges.map(b => `
        <div class="statline" style="align-items:flex-start;">
          <span style="color:var(--green);font-weight:bold;">🏅 ${b.label}</span>
          <span style="text-align:right;">${b.desc}</span>
        </div>
      `).join("")}
    </div>` : ""}
    <div class="section-label">NET WORTH OVER TIME</div>
    <div class="card">${sparklineSVG(state.netWorthHistory)}</div>

    <div class="card">
      <div class="statline"><span>Trading revenue</span><span>$${s.totalRevenue.toLocaleString()}</span></div>
      <div class="statline"><span>Trading spend</span><span>$${s.totalSpent.toLocaleString()}</span></div>
      <div class="statline"><span>Trading profit</span><span class="${profit>=0?'tag-low':'tag-high'}">$${profit.toLocaleString()}</span></div>
      <div class="statline"><span>Interest paid</span><span class="debt-val">$${s.totalInterestPaid.toLocaleString()}</span></div>
      <div class="statline"><span>Police: caught / bribed / dodged</span><span>${s.policeCaught} / ${s.policeBribed} / ${s.policeEscaped}</span></div>
      <div class="statline"><span>Gangs: paid / escaped / caught</span><span>${s.gangPaid} / ${s.gangEscaped} / ${s.gangCaught}</span></div>
      <div class="statline"><span>Fights: won / lost</span><span>${s.fightsWon} / ${s.fightsLost}</span></div>
      <div class="statline"><span>Missions: complete / failed</span><span>${s.missionsCompleted || 0} / ${s.missionsFailed || 0}</span></div>

      <div class="statline"><span>Damage / energy used</span><span>${Math.round(s.damageTaken || 0)} / ${Math.round(s.energySpent || 0)}</span></div>

}

function riskLabel(loc) {
  const mod = LOCATION_MODS[loc];
  const avg = (mod.policeMult + mod.gangMult) / 2;
  if (avg <= 0.75) return "LOW";
  if (avg <= 1.1) return "MED";
  return "HIGH";
}
function mktLabel(loc) {
  const mod = LOCATION_MODS[loc];
  if (mod.priceMult <= 0.85) return "CHEAP";
  if (mod.priceMult <= 1.1) return "FAIR";
  return "RICH";
}

function statusBar() {
  const now = new Date();
  const h24 = now.getHours();
  const h = h24 % 12 || 12;
  const m = String(now.getMinutes()).padStart(2, "0");
  const isNight = h24 >= 19 || h24 < 6;
  return `
    <div class="statusbar">
      <span>${isNight ? "🌙" : "☀️"} ${h}:${m}</span>
      <span class="appname">STREETLINE</span>
      <span class="right">
        <button class="mutebtn" onclick="toggleMute()">${muted ? "🔇" : "🔊"}</button>
        <span class="bars"><span></span><span></span><span></span><span></span></span>
        <span class="battery"><span class="battery-fill"></span></span>
      </span>
    </div>
  `;
}

function render() {
  const screen = document.getElementById("screen");
  const keysEl = document.querySelector(".keysgrid");

  if (!splashDone) {
    keysEl.style.visibility = "hidden";
    screen.innerHTML = renderSplash();
    return;
  }

  if (!appStarted) {
    keysEl.style.visibility = "hidden";
    screen.innerHTML = statusBar() + (charSelectOpen ? renderCreateHustler() : renderLanding());
    return;
  }
  keysEl.style.visibility = "visible";

  if (!state) { screen.innerHTML = ""; return; }

  state.maxCash = Math.max(state.maxCash || 0, state.cash || 0);
  state.maxHeat = Math.max(state.maxHeat || 0, state.heat || 0);
  state.maxHealthReached = Math.max(state.maxHealthReached || 0, state.health || 0);
  saveGame();

  document.querySelectorAll(".key").forEach(k => {
    k.classList.toggle("active", k.dataset.nav === state.view && !state.over && !state.pendingEvent);
  });

  if (state.pendingEvent) {
    screen.innerHTML = statusBar() + renderEvent(state.pendingEvent);
    return;
  }

  if (state.over) {
    const nw = netWorth();
    screen.innerHTML = statusBar() + `
      <div class="hdr"><span>STREETLINE</span><span>RUN COMPLETE</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        ${avatarSVG(state.avatarId, 44, state.colorId, state.accessoryId)}
        <h1 style="font-size:1.15rem;margin:0;">${state.playerName || "You"} — ${nw >= 0 ? "GOT OUT CLEAN" : "STILL IN THE HOLE"}</h1>
      </div>
      <div class="statrow">
        <div><span class="label">CASH</span>$${state.cash.toLocaleString()}</div>
        <div><span class="label">BANK</span>$${state.bank.toLocaleString()}</div>
        <div><span class="label">DEBT</span><span class="debt-val">$${state.debt.toLocaleString()}</span></div>
        <div><span class="label">NET</span>$${nw.toLocaleString()}</div>
      </div>
      <p style="font-size:0.85rem;color:var(--muted);">30 days on the street. ${nw >= 0 ? "You cleared your debt and then some." : "You're still under water — the crew won't forget."}</p>
      ${state.justUnlocked ? `
      <div class="card" style="border-color:var(--green);">
        <div style="font-size:0.9rem;font-weight:bold;color:var(--green);margin-bottom:4px;">🔓 NEW TERRITORY UNLOCKED</div>
        <div style="font-size:0.85rem;">${state.justUnlocked} is open for your next run.</div>
      </div>` : (nw >= 0 && getUnlockedCount() >= EXTRA_LOCATIONS.length ? `
      <div class="card">
        <div style="font-size:0.85rem;color:var(--muted);">All territory outside AC is already open — nothing left to unlock.</div>
      </div>` : (nw < 0 ? `
      <div class="card">
        <div style="font-size:0.85rem;color:var(--muted);">Win clean next time to unlock new territory outside AC.</div>
      </div>` : ""))}
      ${statsBreakdown()}
      <button class="btn btn-wide btn-green" onclick="openCharacterSelect()">RUN IT BACK</button>
    `;
    return;
  }

  let body = "";
  if (state.view === "deal") body = renderDeal();
  else if (state.view === "map") body = renderMap();
  else if (state.view === "stash") body = renderStash();
  else if (state.view === "contacts") body = renderContacts();

  screen.innerHTML = statusBar() + renderTop() + body + `
    <div class="section-label">LOG</div>
    <div class="log">${state.log.map(l => `<div>&gt; ${esc(l)}</div>`).join("")}</div>
  `;
}

  const mod = LOCATION_MODS[loc] || {};

  for(let i=0;i<16;i++){
