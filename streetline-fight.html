function makeFighter(i){
 const main=new THREE.Group();scene.add(main);
 const root=new THREE.Group();main.add(root);
 const skin=new THREE.MeshStandardMaterial({color:i?0x9e694c:0x865439,roughness:.88});
 const cloth=new THREE.MeshStandardMaterial({color:i?0xa12530:0x101419,roughness:.85});

 const shoe=new THREE.MeshStandardMaterial({color:i?0xe1d8d3:0x0b0d11,roughness:.85});

 // Athletic human silhouette: tapered waist, broad shoulders, chest and jacket layers

 }
 cyl(torso,.13,.15,.19,skin,0,.59,0);

 sphere(head,.244,skin,0,.075,0,1.15,.90,.86);
 sphere(head,.185,skin,0,-.065,.015,.74,.90,.82);
 sphere(head,.078,skin,0,.025,.213,1.0,.48,.85);
 for(const side of [-1,1]){

  sphere(head,.030,dark,side*.087,.116,.211,.60,1.16,.35);

 }
 sphere(head,.086,hair,0,-.12,.173,.24,1.1,.30);
 if(i){
  // Durag-like fitted headwear and rear knot
  sphere(head,.25,hair,0,.247,-.017,.49,1,.96);

  sphere(head,.045,hair,0,.13,-.235,1.4,.9,.7);
 }else{
  // Buu: locs and shaped hairline
  sphere(head,.255,hair,0,.278,-.02,.47,1.02,.97);
  for(let j=0;j<12;j++){const x=((j%4)-1.5)*.11,z=-.13+Math.floor(j/4)*.11;sphere(head,.063,hair,x,.355,z,.9,1,.9)}
 }
 const arms=[];
 for(let sign of [-1,1]){
  const shoulder=new THREE.Group();shoulder.position.set(sign*.395,.43,0);torso.add(shoulder);
  sphere(shoulder,.18,cloth,0,-.08,0,1.06,1.13,1.05);

  sphere(shoulder,.115,cloth,0,-.50,0);
  const elbow=new THREE.Group();elbow.position.y=-.55;shoulder.add(elbow);

  cyl(elbow,.12,.105,.085,blackFabric,0,-.42,0);
  const fist=sphere(elbow,.145,skin,0,-.52,.02,.8,1.04,.84);
  for(let n=0;n<3;n++)sphere(elbow,.036,skin,(n-1)*.074,-.57,.126,.55,1,.7);
  arms.push({shoulder,elbow,fist,sign});
 }
 const legs=[];
 for(let sign of [-1,1]){
  const hip=new THREE.Group();hip.position.set(sign*.20,1.03,0);root.add(hip);
  sphere(hip,.19,pants,0,-.10,0,.8,1,.8);
  tapered(hip,.18,.155,.60,jean,0,-.41,0,.88);
  const knee=new THREE.Group();knee.position.y=-.78;hip.add(knee);
  sphere(knee,.143,jean,0,0,0,.78,1,.84);
  tapered(knee,.14,.115,.55,jean,0,-.33,0,.88);
  const sneaker=mesh(new THREE.BoxGeometry(.285,.17,.44),shoe,knee,0,-.72,.12);

 }
 // Streetwear identity: distinct silhouettes, layered fabric and hardware.
 if(i===0){
  // Buu: oversized black quilted puffer with stitched panels.

   for(let n=0;n<3;n++){const pad=sphere(arm.shoulder,.145,puff,0,-.15-n*.145,.005,.53,1.03,1.05);}
  }
  for(let k=0;k<12;k++){
   const loc=sphere(head,.045,hair,Math.cos(k*.525)*.22,.27,Math.sin(k*.525)*.20,.85,.75,.9);
   const strand=mesh(new THREE.CapsuleGeometry(.038,.17,4,7),hair,head,Math.cos(k*.525)*.23,.10,Math.sin(k*.525)*.22);
   strand.rotation.z=Math.cos(k*.525)*.27;

 }else{
  // Fats: red bomber jacket, durag, cargos and contrast cuffs.
  tapered(torso,.35,.33,.095,blackFabric,0,-.43,0,.77);
  for(const arm of arms){
   mesh(new THREE.BoxGeometry(.19,.07,.04),blackFabric,arm.shoulder,0,-.40,.12);
   mesh(new THREE.BoxGeometry(.14,.055,.04),trim,arm.shoulder,0,-.15,.14);
  }
  for(const leg of legs){
   const pocket=mesh(new THREE.BoxGeometry(.22,.19,.07),pants,leg.hip,leg.sign*.03,-.36,.18);
   mesh(new THREE.BoxGeometry(.22,.025,.08),trim,leg.hip,leg.sign*.03,-.26,.22);
  }
  mesh(new THREE.BoxGeometry(.065,.28,.025),hair,head,.13,-.02,-.22).rotation.z=-.25;
  for(const side of [-1,1]){
   mesh(new THREE.BoxGeometry(.11,.16,.075),blackFabric,torso,side*.18,.51,.18).rotation.z=side*.34;
   mesh(new THREE.BoxGeometry(.09,.028,.018),trim,torso,side*.26,-.14,.26);
  }
 }
 // Front-facing features and fitted accessories
 sphere(head,.018,skin,0,-.03,.263,.9,1.1,1);
 mesh(new THREE.BoxGeometry(.105,.013,.018),dark,head,0,-.135,.218);
 for(const side of [-1,1]){
  mesh(new THREE.BoxGeometry(.065,.022,.018),dark,head,side*.09,.105,.225);
  mesh(new THREE.BoxGeometry(.035,.015,.012),trim,head,side*.075,.067,.239);
 }
 // Waistband, pockets, belt and necklace
 cyl(root,.29,.31,.16,pants,0,1.035,0);
 mesh(new THREE.BoxGeometry(.52,.06,.06),dark,root,0,1.075,.25);
 mesh(new THREE.BoxGeometry(.09,.065,.02),metal,root,0,1.075,.288);
 for(let n=0;n<(i?1:2);n++){
  const chain=mesh(new THREE.TorusGeometry(.16+n*.028,.012,7,26,Math.PI),gold,torso,0,.43-n*.025,.255);
  chain.rotation.z=Math.PI;
 }
 mesh(new THREE.BoxGeometry(.065,.11,.025),gold,torso,0,.18,.28);
 main.position.x=i?1.55:-1.55;main.rotation.y=i?-Math.PI/2:Math.PI/2;
 return {main,root,torso,head,arms,legs,x:main.position.x,hp:100,busy:0,total:0,kind:'',hit:false,stun:0,dodge:0,guard:false,guardTime:0,ai:.6,combo:0,phase:0};
}
function sceneSetup(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x090e19);scene.fog=new THREE.FogExp2(0x0a1018,.032);
 camera=new THREE.PerspectiveCamera(38,1,.1,90);camera.position.set(0,2.15,3.85);camera.lookAt(0,1.25,0);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
 stage.prepend(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0x7895c2,0x22221e,1.75));

 const orange=new THREE.PointLight(0xff963c,65,15);orange.position.set(-5,5,1);scene.add(orange);

 const ground=mesh(new THREE.PlaneGeometry(70,45),mat(0x1c2429,.23,.12),scene);

 // Pavement cracks and puddles catch the streetlight.
 for(let j=0;j<32;j++){
  const x=((j*47)%113)/10-5.6,z=((j*31)%73)/10-3.2;

 }
 for(let j=0;j<23;j++){
  const x=((j*17)%107)/10-5.3,z=((j*29)%65)/10-2.8;
  const crack=mesh(new THREE.BoxGeometry(.45+(j%3)*.3,.008,.018),mat(0x0c1114),scene,x,.018,z);

 }
 // Brick buildings with windows and rooflines, deliberately behind the fight.
 const brick=mat(0x292c32),brick2=mat(0x342e2b),windowGlow=new THREE.MeshBasicMaterial({color:0xb68c55});
 for(let j=0;j<11;j++){
  const x=(j-5)*2.35,h=5+(j*7%5)*1.5,z=-8.8-(j%3)*1.4;
  mesh(new THREE.BoxGeometry(2.32,h,2.3),j%2?brick:brick2,scene,x,h/2,z);

   mesh(new THREE.BoxGeometry(.53,.73,.05),lit?windowGlow:mat(0x0c1820),scene,x+w,y,z+1.18);

 car(-6.6,-3.1,0x111518);car(6.5,-3.3,0x282b30);
 // Sodium street lamps with warm pools of light.
 for(const x of [-7.6,7.6]){

 }
 // Crowd silhouettes beyond the fence; low polygon to keep mobile rendering light.
 const crowdSkin=[mat(0x684a38),mat(0x916a4e),mat(0x48372e)];
 const jackets=[mat(0x12191e),mat(0x30363c),mat(0x292328),mat(0x202c25)];

 if(live){remaining=Math.max(0,remaining-dt);$('time').textContent=Math.ceil(remaining)+'s';if(remaining<=0)endFight(actors[0].hp>=actors[1].hp?0:1)
 const a=actors[0],b=actors[1],move=(keys.right?1:0)-(keys.left?1:0);
 if(!a.busy&&!a.stun&&!a.clinch){a.x=clamp(a.x+move*dt*2.8,-3.35,b.x-1.25)}
 a.guard=keys.block&&!a.busy;
 b.ai-=dt;if(b.ai<=0&&!b.busy&&!b.stun&&!b.clinch){if(Math.abs(a.x-b.x)>1.43){b.x=clamp(b.x-dt*2.8,a.x+1.25,3.35);b.ai=.11}else{if(Math.random()<.22){b.guard=true;b.guardTime=.55}else attack(1);b.ai=.62+Math.random()*.6}}
 if(b.guardTime>0){b.guardTime-=dt;if(b.guardTime<=0)b.guard=false}
 }
 actors.forEach((a,i)=>{
  animate(a,i,dt,t/1000);
  if(a.mixer){
   updateFightAction(a,i,dt);
   a.mixer.update(dt);
   // Return smoothly to a ready stance after each completed punch.
   if(a.clip && !a.activeFightAction && !a.clip.paused && !a.clip.isRunning() && a.busy<=0){
    a.clip.stop();a.clip.reset();a.clip.play();a.clip.paused=true;
    a.clip.time=a.idlePoseTime||.08;a.mixer.update(0);
   }
  }
 });
 // Keep fighters from walking through each other, including after knockback.
 if(live && actors[1].x-actors[0].x<1.25){
  const mid=(actors[0].x+actors[1].x)*.5;
  actors[0].x=mid-.625;actors[1].x=mid+.625;
 }
 if(ending){
  ending.elapsed+=dt;
  const v=ending.elapsed,w=actors[ending.winner],loser=actors[1-ending.winner];
  // After the knockout, the victor turns from the rival toward the viewer.
  // The character mesh faces local +Z, so world yaw 0 faces the camera.
  const turn=ease(clamp((v-.55)/1.05,0,1));
  const startYaw=ending.winner===0?Math.PI/2:-Math.PI/2;
  w.main.rotation.y=startYaw*(1-turn);
  const drop=ease(clamp((v-.15)/1.0,0,1));
  loser.root.rotation.z=(ending.winner===0?-.98:.98)*drop;
  loser.root.position.y=-.64*drop;
  loser.torso.rotation.x=.18*drop;
  loser.arms.forEach(arm=>{arm.shoulder.rotation.x=-.2*drop;arm.elbow.rotation.x=-.45});
  if(v>.55){
   const cheer=ease(clamp((v-.55)/.7,0,1));
   w.root.position.y=Math.sin(v*5)*.025;
   w.torso.rotation.y=(ending.winner===0?-.25:.25)*cheer;
   w.arms[0].shoulder.rotation.x=-.95-cheer*1.7;
   w.arms[0].elbow.rotation.x=-1.65+cheer*1.4;
   w.arms[1].shoulder.rotation.x=-.95-cheer*.8;
   w.arms[1].elbow.rotation.x=-1.65+cheer*.7;
  }
  if(v>2.1&&!$('victory').classList.contains('show')){
   $('winTitle').textContent=ending.winner===0?'VICTORY':'DEFEAT';
   $('winSubtitle').textContent=ending.winner===0?'STREET RESPECT EARNED':'THE STREETS HIT BACK';
   $('victory').classList.add('show');
  }
  const goalX=w.x;
  camera.position.x+=(goalX-camera.position.x)*Math.min(1,dt*1.4);
  camera.position.z+=(3.7-camera.position.z)*Math.min(1,dt*1.2);
  camera.position.y+=(2.15-camera.position.y)*Math.min(1,dt*1.2);
  camera.lookAt(camera.position.x,1.3,0);
  renderer.render(scene,camera);return;
 }
 const mid=(actors[0].x+actors[1].x)/2;camera.position.x+=(mid-camera.position.x)*Math.min(1,dt*2);camera.lookAt(camera.position.x,1.2,0);renderer.render(scene,camera)}
function hold(id,key){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys[key]=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}
hold('left','left');hold('right','right');hold('block','block');
$('punch').addEventListener('pointerdown',e=>{e.preventDefault();attack(0)});


$('finish').addEventListener('pointerdown',e=>{e.preventDefault();if(energy<100||!live)return;if(actors[0].busy>0||actors[0].stun>0)return;energy=0;updateHud();attack(0,'finish')});
$('restart').addEventListener('click',reset);
$('again').addEventListener('click',()=>{
 if(window.parent!==window && ending){
  window.parent.postMessage({type:'streetline-fight-result',won:ending.winner===0,opponentDamage:Math.round(100-(actors[1]?.hp||0))},location.origin);
 }else reset();
});
async function boot(){try{$('status').textContent='Loading Three.js rendering engine...';THREE=await import('https://esm.sh/three@0.160.1');({FBXLoader}=await import('https://esm.sh/three@0.160.1/examples/jsm/loaders/FBXLoader.js'));sceneSetup();$('overlay').style.display='none';requestAnimationFrame(frame);autoLoadFighters();loadFightAnimations()}catch(e){$('status').textContent='3D engine unavailable: '+e.message+' (internet needed for the engine).';$('retry').style.display='block';console.error(e)}}boot();
const ANIMATION_FILES={punch:'Jab Cross-Lite.fbx',hit:'Receiving A Hit-Lite.fbx',walk:'Walking-Lite.fbx'};
const animationClips={};
async function loadFightAnimations(){
 const entries=Object.entries(ANIMATION_FILES);
 await Promise.allSettled(entries.map(async ([key,name])=>{
  try{
   const response=await fetch('./'+encodeURIComponent(name));
   if(!response.ok)throw Error('HTTP '+response.status);
   const buffer=await response.arrayBuffer();
   const fbx=new FBXLoader().parse(buffer,'');
   const clip=fbx.animations?.[0];
   if(!clip)throw Error('No animation track');
   animationClips[key]=clip;
   actors.forEach(installFightActions);
   console.info('Loaded '+key+' animation');
  }catch(e){console.warn('Optional animation '+name+' unavailable:',e.message)}
 }));
}
function installFightActions(a){
 if(!a?.real||!a.mixer)return;
 a.fightActions ||= {};
 // Lightweight procedural guard, avoiding the damaged oversized Center Block FBX.
 if(!a.fightActions.block){
  const tracks=[];
  a.real.traverse(b=>{
   if(!b.isBone)return;
   const n=b.name.toLowerCase();
   let rx=0,ry=0,rz=0;
   if(/leftforearm$/.test(n)){rx=-.82;ry=.14;rz=-.16}
   else if(/rightforearm$/.test(n)){rx=-.82;ry=-.14;rz=.16}
   else if(/leftarm$/.test(n)){rx=-.40;rz=-.28}
   else if(/rightarm$/.test(n)){rx=-.40;rz=.28}
   else return;
   const base=b.quaternion.clone();
   const raised=base.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)));
   tracks.push(new THREE.QuaternionKeyframeTrack(b.name+'.quaternion',[0,.16,.70],
    [...base.toArray(),...raised.toArray(),...raised.toArray()]));
  });
  if(tracks.length){const action=a.mixer.clipAction(new THREE.AnimationClip('block',.70,tracks));
   action.setLoop(THREE.LoopOnce,1);action.clampWhenFinished=true;a.fightActions.block=action;}
 }
 for(const [key,clip] of Object.entries(animationClips)){
  if(a.fightActions[key])continue;
  // Mixamo track names are bone names; avoid mixing tracks targeting a different rig.
  const bones=new Set();a.real.traverse(o=>{if(o.isBone)bones.add(o.name)});
  const tracks=clip.tracks.filter(t=>{const dot=t.name.lastIndexOf('.'),bone=t.name.slice(0,dot);return bones.has(bone)&&!(t.name.slice(dot+1)==='position'&&/hips$/i.test(bone))});
  if(!tracks.length){console.warn('Rig mismatch for',key);continue}
  const compatible=new THREE.AnimationClip(key,clip.duration,tracks);
  const action=a.mixer.clipAction(compatible);
  action.setLoop(key==='walk'?THREE.LoopRepeat:THREE.LoopOnce,key==='walk'?Infinity:1);
  action.clampWhenFinished=key!=='walk';
  a.fightActions[key]=action;
 }
}
function playFightAction(a,key){
 const action=key==='originalPunch'?a?.clip:a?.fightActions?.[key];
 if(!action)return false;
 if(a.animState===key)return true;
 if(a.activeFightAction&&a.activeFightAction!==action)a.activeFightAction.fadeOut(.13);
 if(a.clip&&a.clip!==action){a.clip.paused=false;a.clip.fadeOut(.13)}
 action.enabled=true;action.paused=false;action.setEffectiveWeight(1);action.setEffectiveTimeScale(1);
 action.reset().fadeIn(.13).play();a.activeFightAction=action;a.animState=key;
 return true;
}
function updateFightAction(a,i,dt){
 if(!a.real||!a.mixer)return;
 const moving=i===0?(keys.left||keys.right):(Math.abs(actors[0].x-a.x)>1.7&&!a.busy);
 const desired=a.stun>0?'hit':a.busy>0?(a.kind==='finish'?'punch':a.combo?'punch':'originalPunch'):a.guard?'block':moving?'walk':'idle';
 if(desired==='idle'){
  if(a.animState!=='idle'){
   if(a.activeFightAction){a.activeFightAction.fadeOut(.16);a.activeFightAction=null}
   if(a.clip){a.clip.enabled=true;a.clip.paused=false;a.clip.reset().fadeIn(.16).play()}
   a.animState='idle';
  }
  if(a.clip&&a.clip.isRunning()&&a.clip.time>(a.idlePoseTime||.08))a.clip.paused=true;
 }else if(!playFightAction(a,desired)){
  if(a.animState!==desired){if(a.activeFightAction)a.activeFightAction.fadeOut(.12);a.activeFightAction=null;a.animState=desired}
 }
}
async function autoLoadFighters(){
  const files=['Punching.fbx','Boxing.fbx'];
  const results=await Promise.allSettled(files.map(async (name,i)=>{
    const res=await fetch('./'+encodeURIComponent(name));
    if(!res.ok)throw Error(name+' unavailable ('+res.status+')');
    const blob=await res.blob();
    if(!await loadRealFighter(i,new File([blob],name,{type:'application/octet-stream'})))throw Error(name+' could not be loaded');
  }));
  if(results.some(r=>r.status==='rejected')){
    say('MODELS NOT FOUND · CHECK FBX FILES ON WEBSITE');
    $('loadModels').style.display='none';
    console.warn('Local file previews may block automatic FBX loading:',results);
  } else {
    $('loadModels').style.display='none';
    say('FIGHTERS READY · LET’S FIGHT');
  }
}
$('buuFile').addEventListener('change',e=>{if(e.target.files?.[0]&&actors.length)loadRealFighter(0,e.target.files[0])});
$('fatsFile').addEventListener('change',e=>{if(e.target.files?.[0]&&actors.length)loadRealFighter(1,e.target.files[0])});
async function loadAnimationFile(key,file,inputId){
 const label=document.querySelector('label[for="'+inputId+'"]');
 const status=$('uploadStatus');status.textContent='LOADING '+file.name+' ...';
 try{
  const buffer=await file.arrayBuffer();
  const fbx=new FBXLoader().parse(buffer,'');
  const clip=fbx.animations?.[0];if(!clip)throw Error('No animation in file');
  animationClips[key]=clip;
  actors.forEach(a=>{if(a?.fightActions?.[key]){a.fightActions[key].stop();delete a.fightActions[key]}installFightActions(a)});
  label.classList.add('loaded');label.firstChild.textContent='✓ '+key.toUpperCase()+' ';
  status.textContent='LOADED '+file.name+' · '+clip.duration.toFixed(2)+'s · '+clip.tracks.length+' tracks';
  say(key.toUpperCase()+' ANIMATION READY');
 }catch(err){status.textContent='ERROR '+file.name+': '+err.message;console.error(err)}
}
for(const [key,id] of [['walk','walkFile'],['punch','punchFile'],['hit','hitFile']]){
 $(id).addEventListener('change',e=>{if(e.target.files?.[0]&&actors.length)loadAnimationFile(key,e.target.files[0],id)});
}
